[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1"]
build-backend = "build_backend"
backend-path = ["."]

[project]
name = "setta-json-render-app-gen"
version = "0.1.0"
description = "First-party app subsystem plugin package for Setta"
requires-python = ">=3.12"
dependencies = []

[tool.setuptools]
py-modules = []

[tool.setuptools.data-files]
"setta-json-render-app-gen" = ["setta.plugin.json", "README.md"]
"setta-json-render-app-gen/runtime_backend" = ["runtime_backend/main.py"]
"setta-json-render-app-gen/frontend/dist" = ["frontend/dist/index.css", "frontend/dist/index.js"]
