[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "setta-sharp-splat-viewer"
version = "0.1.0"
description = "Setta plugin"
requires-python = ">=3.12"
dependencies = []

[tool.setuptools]
py-modules = []

[tool.setuptools.data-files]
"." = ["setta.plugin.json", "README.md"]
"backend" = ["backend/*.py"]
"frontend/dist" = ["frontend/dist/*"]
"content/blueprints" = ["content/blueprints/*"]
"content/project_templates" = ["content/project_templates/*"]
"content/prompts" = ["content/prompts/*"]
