name: publish-plugin

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade build twine setta
      - run: setta plugins validate .
      - run: python -m build
      - run: python -m twine check dist/*
      # Configure publish credentials/secrets for your registry.
