[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "setta-basedpyright"
version = "0.1.0"
description = "First-party basedpyright language-server plugin for Setta"
requires-python = ">=3.12"
dependencies = [
    "basedpyright==1.25.0",
]

[tool.setuptools]
py-modules = []

[tool.setuptools.data-files]
"." = ["setta.plugin.json", "README.md"]
"backend" = ["backend/go.mod", "backend/main.go"]
"content/config" = ["content/config/schema.json"]
