[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "setta-basedpyright"
version = "0.1.0"
description = "First-party basedpyright language-server plugin for Setta"
requires-python = ">=3.12"
dependencies = [
    "basedpyright==1.25.0",
]

[tool.setuptools]
packages = ["setta_basedpyright"]

[tool.setuptools.package-dir]
setta_basedpyright = "."

[tool.setuptools.package-data]
setta_basedpyright = [
    "README.md",
    "setta.plugin.json",
    "backend/go.mod",
    "backend/main.go",
    "backend/plugin-backend",
    "backend/plugin-backend.exe",
    "content/config/schema.json",
]
