[build-system]
requires = ["hatchling==1.29.0"]
build-backend = "hatchling.build"

[project]
name = "setta-basedpyright"
version = "0.1.0"
description = "First-party basedpyright language-server plugin for Setta"
requires-python = ">=3.12"
dependencies = [
    "basedpyright==1.25.0",
]

[tool.hatch.build.targets.wheel]
only-include = []

[tool.hatch.build.targets.wheel.force-include]
"setta.plugin.json" = "setta_basedpyright/setta.plugin.json"
"README.md" = "setta_basedpyright/README.md"
"backend/go.mod" = "setta_basedpyright/backend/go.mod"
"backend/main.go" = "setta_basedpyright/backend/main.go"
"content/config/schema.json" = "setta_basedpyright/content/config/schema.json"

[tool.hatch.build.targets.sdist]
include = [
    "/setta.plugin.json",
    "/README.md",
    "/backend",
    "/content/config",
    "/pyproject.toml",
]
