name: Code Polishy security

on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  supply-chain:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0
      - name: Set up pinned Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: ".node-version"
          check-latest: false
      - name: Set up pnpm 10.23.0
        uses: pnpm/action-setup@9fd676a19091d4595eefd76e4bd31c97133911f1 # v4.2.0
        with:
          version: "10.23.0"
          run_install: false
      - name: Set up pinned Go
        uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00 # v6.0.0
        with:
          go-version-file: "packages/local-backend/.go-version"
          check-latest: false
      - name: Bootstrap pinned Code Polishy
        run: ./code-polishyw setup
      - name: Review dependencies before installation
        run: |
          ./code-polishyw dependency-review --base origin/main
      - name: Install frozen dependencies without build scripts
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
      - name: Run online Code Polishy supply-chain checks
        run: |
          code-polishy() { ./code-polishyw "$@"; }
          code-polishy supply-chain
