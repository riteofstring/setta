name: Code Polishy security

on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  supply-chain:
    runs-on:
      - self-hosted
      - ${{ 'code-polishy-0.23.0-c28b0d8b' }}
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install frozen dependencies without lifecycle scripts
        run: pnpm install --frozen-lockfile --ignore-scripts --force
      - name: Run online Code Polishy supply-chain checks
        run: code-polishy supply-chain
