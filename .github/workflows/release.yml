name: Publish to npm

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing annotated release tag (vMAJOR.MINOR.PATCH)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: npm
    permissions:
      contents: read
      id-token: write
    env:
      CHROME_BINARY: /usr/bin/google-chrome
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Check out release tag
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up pinned Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version-file: .node-version
          registry-url: https://registry.npmjs.org
      - name: Set up pinned pnpm
        uses: pnpm/action-setup@9fd676a19091d4595eefd76e4bd31c97133911f1
        with:
          version: "10.23.0"
          run_install: false
      - name: Set up npm for trusted publishing
        run: npm install --global --ignore-scripts npm@11.6.2
      - name: Verify release identity
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          test "$(git cat-file -t "refs/tags/$RELEASE_TAG")" = tag
          test "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")" = "$(git rev-parse HEAD)"
          git merge-base --is-ancestor HEAD origin/main
          test "$RELEASE_TAG" = "v$(node -p 'require("./packages/workspace/package.json").version')"
          grep -Eq "^## \[${RELEASE_TAG#v}\] - [0-9]{4}-[0-9]{2}-[0-9]{2}$" CHANGELOG.md
      - name: Bootstrap pinned Code Polishy
        run: ./code-polishyw setup
      - name: Review dependencies before installation
        run: ./code-polishyw dependency-review --base HEAD^
      - name: Install frozen dependencies without lifecycle scripts
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Build package
        run: pnpm build
      - name: Complete dependency verification
        run: ./code-polishyw supply-chain
      - name: Check source and package contracts
        run: ./code-polishyw check --all
      - name: Test package boundaries
        run: ./code-polishyw test --suite workspace-focused
      - name: Test the packed consumer
        run: ./code-polishyw test --suite packed-consumer-contract
      - name: Preserve verified package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: setta-${{ env.RELEASE_TAG }}
          path: packages/workspace/setta.tgz
          if-no-files-found: error
      - name: Check immutable registry version
        id: registry
        run: |
          node --input-type=module <<'JS'
          import { readFileSync, appendFileSync } from 'node:fs';
          import { createHash } from 'node:crypto';
          const { name, version } = JSON.parse(readFileSync('packages/workspace/package.json', 'utf8'));
          const response = await fetch(`https://registry.npmjs.org/${encodeURIComponent(name)}/${version}`);
          if (response.status === 404) {
            appendFileSync(process.env.GITHUB_OUTPUT, 'published=false\n');
          } else {
            if (!response.ok) throw new Error(`Registry lookup failed: ${response.status}`);
            const metadata = await response.json();
            const integrity = 'sha512-' + createHash('sha512').update(readFileSync('packages/workspace/setta.tgz')).digest('base64');
            if (metadata.dist.integrity !== integrity) throw new Error('Published version contains a different artifact; choose a new version.');
            appendFileSync(process.env.GITHUB_OUTPUT, 'published=true\n');
            console.log(`${name}@${version} already contains this exact tarball.`);
          }
          JS
      - name: Publish verified tarball through trusted publishing
        if: steps.registry.outputs.published != 'true'
        run: npm publish ./packages/workspace/setta.tgz --access public --provenance --ignore-scripts
