name: Code Policy security

on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  supply-chain:
    runs-on:
      - self-hosted
      - code-policy-0.7.1-57f3938d
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install frozen dependencies without lifecycle scripts
        run: pnpm install --frozen-lockfile --ignore-scripts --force
      - name: Run online Code Policy supply-chain checks
        run: code-policy supply-chain
