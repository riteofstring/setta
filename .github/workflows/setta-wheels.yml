name: Setta native wheels

on:
  pull_request:
    paths:
      - ".github/workflows/setta-wheels.yml"
      - "apps/python-canvas/**"
      - "apps/*/package.json"
      - "fixtures/packed-consumer/package.json"
      - "fixtures/packed-consumer/package.template.json"
      - "packages/setta-runtime/**"
      - "packages/workspace/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "pyproject.toml"
      - "scripts/check-package-boundary.mjs"
      - "scripts/compile-katex-styles.mjs"
      - "scripts/lib/process.mjs"
      - "uv.lock"
      - "uv.toml"
  push:
    branches: [main]
    paths:
      - ".github/workflows/setta-wheels.yml"
      - "apps/python-canvas/**"
      - "apps/*/package.json"
      - "fixtures/packed-consumer/package.json"
      - "fixtures/packed-consumer/package.template.json"
      - "packages/setta-runtime/**"
      - "packages/workspace/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "pyproject.toml"
      - "scripts/check-package-boundary.mjs"
      - "scripts/compile-katex-styles.mjs"
      - "scripts/lib/process.mjs"
      - "uv.lock"
      - "uv.toml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: setta-wheels-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos-wheel:
    name: macOS ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            target: darwin-amd64
            architecture: x86_64
            wheel_platform_tag: macosx_13_0_x86_64
          - runner: macos-15
            target: darwin-arm64
            architecture: arm64
            wheel_platform_tag: macosx_13_0_arm64
    steps:
      - name: Check out repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - name: Set up Python 3.12.13
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.12.13"
          check-latest: false
      - name: Set up Node 25.2.1
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "25.2.1"
          check-latest: false
      - name: Set up pnpm 10.23.0
        uses: pnpm/action-setup@9fd676a19091d4595eefd76e4bd31c97133911f1 # v4.2.0
        with:
          version: "10.23.0"
          run_install: false
      - name: Set up pinned Go
        uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00 # v6.0.0
        with:
          go-version-file: "apps/python-canvas/backend/.go-version"
          check-latest: false
      - name: Set up uv 0.8.19
        uses: astral-sh/setup-uv@c7f87aa956e4c323abf06d5dec078e358f6b4d04 # v6.0.0
        with:
          version: "0.8.19"
          enable-cache: false
      - name: Verify pinned toolchain and target architecture
        shell: bash
        run: |
          test "$(python --version)" = "Python 3.12.13"
          test "$(node --version)" = "v25.2.1"
          test "$(pnpm --version)" = "10.23.0"
          expected_go_version="$(tr -d '\r\n' < apps/python-canvas/backend/.go-version)"
          test "$(go version | awk '{print $3}')" = "go${expected_go_version}"
          test "$(uv --version | awk '{print $2}')" = "0.8.19"
          test "$(uname -m)" = "${{ matrix.architecture }}"
      - name: Install frozen build dependencies
        shell: bash
        run: |
          pnpm install --frozen-lockfile
          uv sync --frozen
      - name: Test the native server boundary
        shell: bash
        env:
          MACOSX_DEPLOYMENT_TARGET: "13.0"
          CGO_CFLAGS: "-mmacosx-version-min=13.0"
          CGO_LDFLAGS: "-mmacosx-version-min=13.0"
        run: |
          go -C apps/python-canvas/backend test ./...
          go -C apps/python-canvas/backend mod verify
      - name: Build macOS 13-compatible wheel
        shell: bash
        env:
          MACOSX_DEPLOYMENT_TARGET: "13.0"
          CGO_CFLAGS: "-mmacosx-version-min=13.0"
          CGO_LDFLAGS: "-mmacosx-version-min=13.0"
        run: |
          python packages/setta-runtime/scripts/build_setta_wheel.py \
            --target "${{ matrix.target }}" \
            --wheel-platform-tag "${{ matrix.wheel_platform_tag }}"
      - name: Smoke the installed wheel without source tooling
        shell: bash
        run: |
          test "$(find dist -maxdepth 1 -type f -name '*.whl' -print | wc -l | tr -d ' ')" = "1"
          wheel="$(find dist -maxdepth 1 -type f -name '*.whl' -print)"
          python packages/setta-runtime/scripts/smoke_setta_wheel.py \
            --wheel "$wheel" \
            --expected-platform-tag "${{ matrix.wheel_platform_tag }}"
      - name: Upload wheel artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: setta-${{ matrix.target }}
          path: dist/*.whl
          if-no-files-found: error
          retention-days: 7

  linux-wheel:
    name: Linux ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: linux-amd64
            architecture: x86_64
            wheel_platform_tag: manylinux_2_28_x86_64
            manylinux_image: quay.io/pypa/manylinux_2_28_x86_64@sha256:4dc41da7df20400310c80d162a2fe2d2c2f3d9734d8dec20f6b9843711618deb
          - runner: ubuntu-24.04-arm
            target: linux-arm64
            architecture: aarch64
            wheel_platform_tag: manylinux_2_28_aarch64
            manylinux_image: quay.io/pypa/manylinux_2_28_aarch64@sha256:29a6ceb78de5b00494e6e7456a72782a4cb54238de102e7491d15fe47789b4d1
    steps:
      - name: Check out repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - name: Set up Python 3.12.13
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.12.13"
          check-latest: false
      - name: Set up Node 25.2.1
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "25.2.1"
          check-latest: false
      - name: Set up pnpm 10.23.0
        uses: pnpm/action-setup@9fd676a19091d4595eefd76e4bd31c97133911f1 # v4.2.0
        with:
          version: "10.23.0"
          run_install: false
      - name: Set up pinned Go
        uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00 # v6.0.0
        with:
          go-version-file: "apps/python-canvas/backend/.go-version"
          check-latest: false
      - name: Set up uv 0.8.19
        uses: astral-sh/setup-uv@c7f87aa956e4c323abf06d5dec078e358f6b4d04 # v6.0.0
        with:
          version: "0.8.19"
          enable-cache: false
      - name: Verify pinned toolchain and target architecture
        shell: bash
        run: |
          test "$(python --version)" = "Python 3.12.13"
          test "$(node --version)" = "v25.2.1"
          test "$(pnpm --version)" = "10.23.0"
          expected_go_version="$(tr -d '\r\n' < apps/python-canvas/backend/.go-version)"
          test "$(go version | awk '{print $3}')" = "go${expected_go_version}"
          test "$(uv --version | awk '{print $2}')" = "0.8.19"
          test "$(uname -m)" = "${{ matrix.architecture }}"
      - name: Install frozen build dependencies
        shell: bash
        run: |
          pnpm install --frozen-lockfile
          uv sync --frozen
      - name: Test the native server boundary
        shell: bash
        run: |
          go -C apps/python-canvas/backend test ./...
          go -C apps/python-canvas/backend mod verify
      - name: Build the CGO server in pinned manylinux 2.28
        shell: bash
        run: |
          host_go_mod_cache="$(go env GOMODCACHE)"
          test -d "$host_go_mod_cache"
          mkdir -p build/setta-native/go-build-cache
          test ! -L build/setta-native/go-build-cache
          docker pull "${{ matrix.manylinux_image }}"
          docker run --rm \
            --network none \
            --user "$(id -u):$(id -g)" \
            --volume "$GITHUB_WORKSPACE:/workspace" \
            --volume "$GOROOT:/setta-go:ro" \
            --volume "$host_go_mod_cache:/setta-go-mod-cache:ro" \
            --workdir /workspace/apps/python-canvas/backend \
            --env GOROOT=/setta-go \
            --env CGO_ENABLED=1 \
            --env GOCACHE=/workspace/build/setta-native/go-build-cache \
            --env GOMODCACHE=/setta-go-mod-cache \
            --env GOTOOLCHAIN=local \
            --env GOPROXY=off \
            --env GOSUMDB=off \
            --env HOME=/tmp \
            "${{ matrix.manylinux_image }}" \
            /setta-go/bin/go build -mod=readonly -trimpath -buildvcs=false -o /workspace/build/setta-native/python-canvas ./cmd/python-canvas
      - name: Build tagged manylinux wheel
        shell: bash
        run: |
          python packages/setta-runtime/scripts/build_setta_wheel.py \
            --native-server build/setta-native/python-canvas \
            --target "${{ matrix.target }}" \
            --wheel-platform-tag "${{ matrix.wheel_platform_tag }}"
      - name: Verify manylinux ABI with image-pinned auditwheel
        shell: bash
        run: |
          set -euo pipefail
          test "$(find dist -maxdepth 1 -type f -name '*.whl' -print | wc -l | tr -d ' ')" = "1"
          wheel="$(find dist -maxdepth 1 -type f -name '*.whl' -print)"
          docker run --rm \
            --network none \
            --user "$(id -u):$(id -g)" \
            --volume "$GITHUB_WORKSPACE:/workspace:ro" \
            --workdir /workspace \
            --env "WHEEL_NAME=$(basename "$wheel")" \
            --entrypoint /bin/bash \
            "${{ matrix.manylinux_image }}" \
            -c 'command -v auditwheel >/dev/null || { echo "auditwheel is absent from the pinned manylinux image" >&2; exit 127; }; auditwheel --version; auditwheel show "/workspace/dist/${WHEEL_NAME}"' \
            2>&1 | tee build/auditwheel-show.txt
          python packages/setta-runtime/scripts/check_auditwheel_report.py \
            --report build/auditwheel-show.txt \
            --expected-architecture "${{ matrix.architecture }}" \
            --max-glibc-minor 28
      - name: Smoke the installed wheel without source tooling
        shell: bash
        run: |
          test "$(find dist -maxdepth 1 -type f -name '*.whl' -print | wc -l | tr -d ' ')" = "1"
          wheel="$(find dist -maxdepth 1 -type f -name '*.whl' -print)"
          python packages/setta-runtime/scripts/smoke_setta_wheel.py \
            --wheel "$wheel" \
            --expected-platform-tag "${{ matrix.wheel_platform_tag }}"
      - name: Upload wheel artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: setta-${{ matrix.target }}
          path: dist/*.whl
          if-no-files-found: error
          retention-days: 7

  windows-wheel:
    name: Windows windows-amd64
    runs-on: windows-2022
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - name: Set up Python 3.12.13
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.12.13"
          check-latest: false
      - name: Set up Node 25.2.1
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "25.2.1"
          check-latest: false
      - name: Set up pnpm 10.23.0
        uses: pnpm/action-setup@9fd676a19091d4595eefd76e4bd31c97133911f1 # v4.2.0
        with:
          version: "10.23.0"
          run_install: false
      - name: Set up pinned Go
        uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00 # v6.0.0
        with:
          go-version-file: "apps/python-canvas/backend/.go-version"
          check-latest: false
      - name: Set up uv 0.8.19
        uses: astral-sh/setup-uv@c7f87aa956e4c323abf06d5dec078e358f6b4d04 # v6.0.0
        with:
          version: "0.8.19"
          enable-cache: false
      - name: Verify pinned toolchain and target architecture
        run: |
          if ((python --version) -ne "Python 3.12.13") { throw "Wrong Python" }
          if ((node --version) -ne "v25.2.1") { throw "Wrong Node" }
          if ((pnpm --version) -ne "10.23.0") { throw "Wrong pnpm" }
          $expectedGoVersion = (Get-Content apps/python-canvas/backend/.go-version -Raw).Trim()
          $actualGoVersion = ((go version) -split ' ')[2]
          if ($actualGoVersion -ne "go${expectedGoVersion}") { throw "Wrong Go" }
          if (-not ((uv --version) -match "^uv 0\.8\.19")) { throw "Wrong uv" }
          if (-not [Environment]::Is64BitOperatingSystem) { throw "Windows amd64 runner required" }
      - name: Install frozen build dependencies
        run: |
          pnpm install --frozen-lockfile
          uv sync --frozen
      - name: Test the native server boundary
        run: |
          go -C apps/python-canvas/backend test ./...
          go -C apps/python-canvas/backend mod verify
      - name: Build Windows amd64 wheel
        run: |
          python packages/setta-runtime/scripts/build_setta_wheel.py `
            --target windows-amd64 `
            --wheel-platform-tag win_amd64
      - name: Smoke the installed wheel without source tooling
        run: |
          $wheels = @(Get-ChildItem -Path dist -Filter *.whl -File)
          if ($wheels.Count -ne 1) { throw "Expected exactly one wheel" }
          python packages/setta-runtime/scripts/smoke_setta_wheel.py `
            --wheel $wheels[0].FullName `
            --expected-platform-tag win_amd64
      - name: Upload wheel artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: setta-windows-amd64
          path: dist/*.whl
          if-no-files-found: error
          retention-days: 7
