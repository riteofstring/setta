name: Electron safeStorage Platform Probe

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/electron-safe-storage-platform-probe.yml"
      - "desktop/package.json"
      - "desktop/pnpm-lock.yaml"
      - "desktop/src/main/speech-credential-vault.ts"
      - "desktop/src/main/speech-credential-vault.test.ts"
      - "desktop/tests/electron/safe-storage-platform-probe.cjs"
      - "docs/plans/byok-desktop-speech-credentials-20260717.md"
      - "docs/reports/byok-desktop-speech-safe-storage-20260718.md"

permissions:
  contents: read

jobs:
  macos:
    name: macOS safeStorage probe
    runs-on: macos-15
    steps:
      - name: Check out requested commit
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          git -c "http.extraheader=AUTHORIZATION: bearer ${GITHUB_TOKEN}" fetch --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD

      - name: Install desktop dependencies
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@10.23.0 --activate
          pnpm -C desktop install --frozen-lockfile

      - name: Run macOS probe
        shell: bash
        run: |
          set -euo pipefail
          set +e
          desktop/node_modules/.bin/electron \
            desktop/tests/electron/safe-storage-platform-probe.cjs \
            --assert-byok-supported \
            --assert-policy-reason os_backed_platform \
            --assert-policy-status accept \
            --assert-round-trip \
            | tee safe-storage-platform-probe-macos.json
          probe_status=${PIPESTATUS[0]}
          set -e
          {
            echo "### macOS safeStorage probe"
            echo '```json'
            cat safe-storage-platform-probe-macos.json
            echo '```'
          } >>"${GITHUB_STEP_SUMMARY}"
          exit "${probe_status}"

  windows:
    name: Windows safeStorage probe
    runs-on: windows-2025
    steps:
      - name: Check out requested commit
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          git -c "http.extraheader=AUTHORIZATION: bearer ${GITHUB_TOKEN}" fetch --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD

      - name: Install desktop dependencies
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@10.23.0 --activate
          pnpm -C desktop install --frozen-lockfile

      - name: Run Windows probe
        shell: bash
        run: |
          set -euo pipefail
          set +e
          desktop/node_modules/.bin/electron.cmd \
            desktop/tests/electron/safe-storage-platform-probe.cjs \
            --assert-byok-supported \
            --assert-policy-reason os_backed_platform \
            --assert-policy-status accept \
            --assert-round-trip \
            | tee safe-storage-platform-probe-windows.json
          probe_status=${PIPESTATUS[0]}
          set -e
          {
            echo "### Windows safeStorage probe"
            echo '```json'
            cat safe-storage-platform-probe-windows.json
            echo '```'
          } >>"${GITHUB_STEP_SUMMARY}"
          exit "${probe_status}"

  linux-secret-service:
    name: Linux secret-service safeStorage probe
    runs-on: ubuntu-24.04
    steps:
      - name: Check out requested commit
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          git -c "http.extraheader=AUTHORIZATION: bearer ${GITHUB_TOKEN}" fetch --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD

      - name: Install desktop dependencies
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@10.23.0 --activate
          pnpm -C desktop install --frozen-lockfile

      - name: Install Linux secret-service prerequisites
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y dbus-x11 gnome-keyring libsecret-1-0 xvfb

      - name: Run Linux secret-service probe
        shell: bash
        run: |
          set -euo pipefail
          eval "$(dbus-launch --sh-syntax)"
          eval "$(printf '\n' | gnome-keyring-daemon --unlock 2>/dev/null || true)"
          eval "$(gnome-keyring-daemon --start --components=secrets 2>/dev/null || true)"
          set +e
          xvfb-run -a desktop/node_modules/.bin/electron \
            --no-sandbox \
            --password-store=gnome-libsecret \
            desktop/tests/electron/safe-storage-platform-probe.cjs \
            --assert-byok-supported \
            --assert-policy-reason linux_secret_service_backend \
            --assert-policy-status accept \
            --assert-round-trip \
            | tee safe-storage-platform-probe-linux-secret-service.json
          probe_status=${PIPESTATUS[0]}
          set -e
          {
            echo "### Linux secret-service safeStorage probe"
            echo '```json'
            cat safe-storage-platform-probe-linux-secret-service.json
            echo '```'
          } >>"${GITHUB_STEP_SUMMARY}"
          exit "${probe_status}"

  linux-basic-text:
    name: Linux basic_text rejection probe
    runs-on: ubuntu-24.04
    steps:
      - name: Check out requested commit
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          git -c "http.extraheader=AUTHORIZATION: bearer ${GITHUB_TOKEN}" fetch --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD

      - name: Install desktop dependencies
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@10.23.0 --activate
          pnpm -C desktop install --frozen-lockfile

      - name: Install Linux display prerequisites
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y xvfb

      - name: Run Linux basic_text rejection probe
        shell: bash
        run: |
          set -euo pipefail
          set +e
          xvfb-run -a desktop/node_modules/.bin/electron \
            --no-sandbox \
            --password-store=basic \
            desktop/tests/electron/safe-storage-platform-probe.cjs \
            --assert-policy-reason linux_basic_text_backend \
            --assert-policy-status reject \
            | tee safe-storage-platform-probe-linux-basic-text.json
          probe_status=${PIPESTATUS[0]}
          set -e
          {
            echo "### Linux basic_text rejection probe"
            echo '```json'
            cat safe-storage-platform-probe-linux-basic-text.json
            echo '```'
          } >>"${GITHUB_STEP_SUMMARY}"
          exit "${probe_status}"
