name: Setta checks

on:
  pull_request:
    paths:
      - ".github/workflows/setta-checks.yml"
      - ".code-polishy.json"
      - ".code-polishy.lock.json"
      - ".node-version"
      - "code-polishyw"
      - "code-polishyw.ps1"
      - "packages/**"
      - "fixtures/**"
      - "scripts/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig*.json"
  push:
    branches: [main]
    paths:
      - ".github/workflows/setta-checks.yml"
      - ".code-polishy.json"
      - ".code-polishy.lock.json"
      - ".node-version"
      - "code-polishyw"
      - "code-polishyw.ps1"
      - "packages/**"
      - "fixtures/**"
      - "scripts/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig*.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: setta-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  packages:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CHROME_BINARY: /usr/bin/google-chrome
    steps:
      - name: Check out repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0
      - name: Set up pinned Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: ".node-version"
          check-latest: false
      - name: Set up pnpm 10.23.0
        uses: pnpm/action-setup@9fd676a19091d4595eefd76e4bd31c97133911f1 # v4.2.0
        with:
          version: "10.23.0"
          run_install: false
      - name: Set up pinned Go
        uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00 # v6.0.0
        with:
          go-version-file: "packages/local-backend/.go-version"
          check-latest: false
      - name: Bootstrap pinned Code Polishy
        run: ./code-polishyw setup
      - name: Review dependencies before installation
        run: |
          ./code-polishyw dependency-review --base origin/main
      - name: Install frozen dependencies without build scripts
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
      - name: Complete dependency verification
        run: ./code-polishyw supply-chain
      - name: Verify repository configuration
        run: ./code-polishyw doctor
      - name: Build shared Workspace declarations
        run: pnpm --filter @riteofstring/setta run build
      - name: Check repository
        run: ./code-polishyw check --all
      - name: Test package boundaries
        run: |
          ./code-polishyw test --suite workspace-focused --suite local-backend-focused
      - name: Test browser workflows
        run: |
          test -x "$CHROME_BINARY"
          pnpm run workspace:browser:test -- --chrome-binary "$CHROME_BINARY"
      - name: Preserve failed check reports
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: setta-check-reports
          path: |
            .code-polishy-reports/
            .code-polishy-artifacts/
          include-hidden-files: true
          retention-days: 7
