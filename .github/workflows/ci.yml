name: CI

on:
  push:
    branches:
      - main
    paths-ignore:
      - "**/*.md"
      - "**/*.mdx"
      - "docs/**"
      - "images/**"
      - "LICENSE"
      - "CHANGELOG.md"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/PULL_REQUEST_TEMPLATE.md"
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "**/*.mdx"
      - "docs/**"
      - "images/**"
      - "LICENSE"
      - "CHANGELOG.md"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/PULL_REQUEST_TEMPLATE.md"

jobs:
  discover-tests:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    outputs:
      suites: ${{ steps.discover.outputs.suites }}
    steps:
      - uses: actions/checkout@v4

      - id: discover
        name: Discover backend test suites
        run: |
          python - <<'PY' > /tmp/test_suites.json
          import json
          from pathlib import Path

          root = Path("tests")
          excluded = {"__pycache__", "fixtures"}
          suites = [
              path.name
              for path in root.iterdir()
              if path.is_dir() and path.name not in excluded
          ]
          suites.sort()
          print(json.dumps(suites))
          PY
          echo "suites=$(cat /tmp/test_suites.json)" >> "$GITHUB_OUTPUT"

  discover-playwright:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    outputs:
      suites: ${{ steps.discover.outputs.suites }}
    steps:
      - uses: actions/checkout@v4

      - id: discover
        name: Discover Playwright suites
        run: |
          python - <<'PY' > /tmp/playwright_suites.json
          import json
          from pathlib import Path

          root = Path("frontend/tests/e2e")
          excluded = {"__pycache__", "fixtures"}
          suites = set()

          if root.exists():
              if any(root.glob("*.spec.*")):
                  suites.add("root")

              for spec in root.rglob("*.spec.*"):
                  rel = spec.relative_to(root)
                  if any(part in excluded for part in rel.parts):
                      continue

                  # Root-level specs are covered by the dedicated "root" suite.
                  if len(rel.parts) <= 1:
                      continue

                  suites.add(rel.parent.as_posix())

          print(json.dumps(sorted(suites)))
          PY
          echo "suites=$(cat /tmp/playwright_suites.json)" >> "$GITHUB_OUTPUT"

  backend:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: discover-tests
    strategy:
      fail-fast: false
      matrix:
        suite: ${{ fromJSON(needs.discover-tests.outputs.suites) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v3

      - uses: actions/setup-node@v4
        with:
          node-version-file: scripts/node_version.txt

      - uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false

      - name: Get pnpm store path
        run: echo "PNPM_STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_ENV"

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ env.PNPM_STORE_PATH }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('frontend/pnpm-lock.yaml') }}-v1
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Cache uv downloads
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-uv-${{ hashFiles('uv.lock') }}-v1
          restore-keys: |
            ${{ runner.os }}-uv-

      - name: Install frontend deps
        run: pnpm -C frontend install --frozen-lockfile

      - name: Install Python deps
        run: uv sync --all-extras

      - name: Backend tests (${{ matrix.suite }})
        run: ./scripts/run_backend_tests.sh "tests/${{ matrix.suite }}" --setup-show

  go-sdk-contracts:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: scripts/go_version.txt

      - name: Go SDK contract generator tests
        run: ./scripts/go.sh test ./internal/pythonsdkcontracts ./cmd/setta-gen-python-sdk-contracts -count=1

  frontend-unit:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v3

      - uses: actions/setup-node@v4
        with:
          node-version-file: scripts/node_version.txt

      - uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false

      - name: Get pnpm store path
        run: echo "PNPM_STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_ENV"

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ env.PNPM_STORE_PATH }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('frontend/pnpm-lock.yaml') }}-v1
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Cache uv downloads
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-uv-${{ hashFiles('uv.lock') }}-v1
          restore-keys: |
            ${{ runner.os }}-uv-

      - name: Install frontend deps
        run: pnpm -C frontend install --frozen-lockfile

      - name: Install Python deps
        run: uv sync --all-extras

      - name: Frontend unit tests
        run: pnpm -C frontend exec vitest run

  frontend-e2e:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: discover-playwright
    strategy:
      fail-fast: false
      matrix:
        suite: ${{ fromJSON(needs.discover-playwright.outputs.suites) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v3

      - uses: actions/setup-node@v4
        with:
          node-version-file: scripts/node_version.txt

      - uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false

      - name: Get pnpm store path
        run: echo "PNPM_STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_ENV"

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ env.PNPM_STORE_PATH }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('frontend/pnpm-lock.yaml') }}-v1
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Cache uv downloads
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-uv-${{ hashFiles('uv.lock') }}-v1
          restore-keys: |
            ${{ runner.os }}-uv-

      - name: Install frontend deps
        run: pnpm -C frontend install --frozen-lockfile

      - name: Install Python deps
        run: uv sync --all-extras

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('frontend/pnpm-lock.yaml') }}-v1
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright browsers
        run: pnpm -C frontend exec playwright install --with-deps

      - name: Playwright E2E (${{ matrix.suite }})
        run: |
          if [[ "${{ matrix.suite }}" == "root" ]]; then
            shopt -s nullglob
            files=(frontend/tests/e2e/*.spec.*)
            args=()
            for file in "${files[@]}"; do
              args+=("${file#frontend/}")
            done
            ./scripts/run-playwright-e2e.sh "${args[@]}"
          else
            ./scripts/run-playwright-e2e.sh "tests/e2e/${{ matrix.suite }}"
          fi
