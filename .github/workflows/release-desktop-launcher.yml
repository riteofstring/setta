name: Release Desktop Launcher

on:
  workflow_dispatch:
    inputs:
      package_spec:
        description: Optional package spec for smoke tests (defaults to local dist build)
        required: false
        default: ""
      installer_version:
        description: Optional installer version override (defaults to backend/setta/__init__.py version)
        required: false
        default: ""
  release:
    types:
      - published

permissions:
  contents: write

jobs:
  resolve_installer_version:
    runs-on: ubuntu-latest
    outputs:
      installer_version: ${{ steps.resolve.outputs.installer_version }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve installer version
        id: resolve
        env:
          INPUT_INSTALLER_VERSION: ${{ inputs.installer_version }}
          RELEASE_TAG_NAME: ${{ github.event.release.tag_name }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          version="$(./scripts/release/resolve_installer_version.sh)"
          echo "installer_version=${version}" >> "$GITHUB_OUTPUT"

  bootstrap-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build bootstrap assets
        run: ./scripts/release/build_launcher_bootstrap_assets.sh

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: launcher-bootstrap-assets
          path: dist/launcher-bootstrap/*

  macos-installer:
    needs:
      - resolve_installer_version
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-go@v5
        with:
          go-version-file: scripts/go_version.txt

      - name: Install Python build dependency
        run: python -m pip install build

      - name: Build packaged Setta sdist
        run: ./scripts/build_python_distribution_with_go_binaries.sh --sdist

      - name: Build macOS installer package
        env:
          SETTA_DESKTOP_INSTALLER_RELEASE_MODE: "1"
          SETTA_DESKTOP_INSTALLER_VERSION: ${{ needs.resolve_installer_version.outputs.installer_version }}
        run: ./scripts/release/build_macos_installer.sh

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-installer-assets
          path: dist/native-installers/macos/*

  windows-installer:
    needs:
      - resolve_installer_version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-go@v5
        with:
          go-version-file: scripts/go_version.txt

      - name: Install Python build dependency
        run: python -m pip install build

      - name: Build packaged Setta sdist
        shell: bash
        run: ./scripts/build_python_distribution_with_go_binaries.sh --sdist

      - name: Install WiX Toolset
        run: choco install wixtoolset -y --no-progress

      - name: Build Windows MSI installer
        shell: pwsh
        env:
          SETTA_DESKTOP_INSTALLER_RELEASE_MODE: "1"
          SETTA_DESKTOP_INSTALLER_VERSION: ${{ needs.resolve_installer_version.outputs.installer_version }}
        run: ./scripts/release/build_windows_installer.ps1

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer-assets
          path: dist/native-installers/windows/*

  macos-installer-smoke:
    needs:
      - macos-installer
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: macos-installer-assets
          path: dist/native-installers/macos

      - uses: astral-sh/setup-uv@v3

      - name: Run macOS native installer smoke
        run: |
          pkg_path="$(find dist/native-installers/macos -maxdepth 1 -type f -name 'SettaDesktop-*.pkg' | head -n 1)"
          if [[ -z "${pkg_path}" ]]; then
            echo "No macOS installer package found for smoke test." >&2
            exit 1
          fi
          ./scripts/release/smoke_test_native_installer_macos.sh --pkg "${pkg_path}"

  windows-installer-smoke:
    needs:
      - windows-installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: windows-installer-assets
          path: dist/native-installers/windows

      - uses: astral-sh/setup-uv@v3

      - name: Run Windows native installer smoke
        shell: pwsh
        run: |
          $msiPath = Get-ChildItem -Path dist/native-installers/windows -Filter "SettaDesktop-*.msi" | Select-Object -First 1
          if (-not $msiPath) {
            throw "No Windows installer MSI found for smoke test."
          }
          ./scripts/release/smoke_test_native_installer_windows.ps1 -MsiPath $msiPath.FullName

  launcher-smoke:
    runs-on: ubuntu-latest
    needs:
      - bootstrap-assets
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-go@v5
        with:
          go-version-file: scripts/go_version.txt

      - uses: astral-sh/setup-uv@v3

      - name: Resolve package spec for smoke tests
        id: package
        run: |
          if [[ -n "${{ inputs.package_spec }}" ]]; then
            echo "value=${{ inputs.package_spec }}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          python -m pip install build
          ./scripts/build_python_distribution_with_go_binaries.sh
          package_spec="$(find dist -maxdepth 1 -type f -name '*.tar.gz' | head -n 1)"
          if [[ -z "${package_spec}" ]]; then
            echo "Could not find built source distribution under dist/." >&2
            exit 1
          fi
          echo "value=${package_spec}" >> "$GITHUB_OUTPUT"

      - name: Run launcher smoke pipeline
        run: |
          ./scripts/release/smoke_test_launcher_pipeline.sh \
            --package "${{ steps.package.outputs.value }}"

  publish-release-assets:
    if: github.event_name == 'release'
    needs:
      - resolve_installer_version
      - bootstrap-assets
      - launcher-smoke
      - macos-installer-smoke
      - windows-installer-smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: launcher-bootstrap-assets
          path: dist/launcher-bootstrap

      - uses: actions/download-artifact@v4
        with:
          name: macos-installer-assets
          path: dist/native-installers/macos

      - uses: actions/download-artifact@v4
        with:
          name: windows-installer-assets
          path: dist/native-installers/windows

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/launcher-bootstrap/setta-install-desktop.sh
            dist/launcher-bootstrap/setta-install-desktop.ps1
            dist/launcher-bootstrap/checksums.sha256
            dist/native-installers/macos/*
            dist/native-installers/windows/*
