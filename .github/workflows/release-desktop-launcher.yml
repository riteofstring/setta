name: Release Desktop Launcher

on:
  workflow_dispatch:
    inputs:
      package_spec:
        description: Optional package spec for smoke tests (defaults to local dist build)
        required: false
        default: ""
  release:
    types:
      - published

permissions:
  contents: write

jobs:
  bootstrap-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build bootstrap assets
        run: ./scripts/release/build_launcher_bootstrap_assets.sh

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: launcher-bootstrap-assets
          path: dist/launcher-bootstrap/*

      - name: Attach bootstrap assets to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/launcher-bootstrap/setta-install-desktop.sh
            dist/launcher-bootstrap/setta-install-desktop.ps1
            dist/launcher-bootstrap/checksums.sha256

  macos-installer:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build macOS installer package
        run: ./scripts/release/build_macos_installer.sh

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-installer-assets
          path: dist/native-installers/macos/*

      - name: Attach macOS installer assets to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/native-installers/macos/*

  windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install WiX Toolset
        run: choco install wixtoolset -y --no-progress

      - name: Build Windows MSI installer
        shell: pwsh
        run: ./scripts/release/build_windows_installer.ps1

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer-assets
          path: dist/native-installers/windows/*

      - name: Attach Windows installer assets to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/native-installers/windows/*

  launcher-smoke:
    runs-on: ubuntu-latest
    needs:
      - bootstrap-assets
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v3

      - name: Resolve package spec for smoke tests
        id: package
        run: |
          if [[ -n "${{ inputs.package_spec }}" ]]; then
            echo "value=${{ inputs.package_spec }}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          python -m pip install build
          python -m build
          package_spec="$(find dist -maxdepth 1 -type f -name '*.tar.gz' | head -n 1)"
          if [[ -z "${package_spec}" ]]; then
            echo "Could not find built source distribution under dist/." >&2
            exit 1
          fi
          echo "value=${package_spec}" >> "$GITHUB_OUTPUT"

      - name: Run launcher smoke pipeline
        run: |
          ./scripts/release/smoke_test_launcher_pipeline.sh \
            --package "${{ steps.package.outputs.value }}"
