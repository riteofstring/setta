name: Feature request
description: Propose an improvement to a Setta workflow
title: "[Feature]: "
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Python Canvas
        - Realtime
        - Review
        - Experiment Lens
        - Command line or installation
        - Shared workspace
        - Other project infrastructure
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: Describe the workflow or outcome that is difficult today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed experience
      description: Explain the result you would like, without requiring a specific implementation.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Share current workarounds or related approaches if any.
