name: Feature request
description: Propose an improvement to the Setta library
title: "[Feature]: "
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Canvas, sections, and groups
        - Built-in items and controls
        - Graph ports and cables
        - Managed windows and Window Spaces
        - Saved views
        - Find, command palette, and commands
        - History, copy, and paste
        - Appearance and theming
        - Browser entry (`@riteofstring/setta/browser`)
        - Packaging and project infrastructure
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: Describe the workflow or outcome that is difficult today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed experience
      description: Explain the result you would like, without requiring a specific implementation.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Share current workarounds or related approaches if any.
