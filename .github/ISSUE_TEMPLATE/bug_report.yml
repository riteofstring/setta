name: Bug report
description: Report reproducible behavior that is not working as expected
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve Setta. Remove credentials and private project data before submitting.
  - type: input
    id: version
    attributes:
      label: Setta version
      description: The installed `@riteofstring/setta` version, for example from `npm ls @riteofstring/setta`.
      placeholder: 0.1.0
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Affected area
      options:
        - Canvas, sections, and groups
        - Built-in items and controls
        - Graph ports and cables
        - Managed windows and Window Spaces
        - Saved views
        - Find, command palette, and commands
        - History, copy, and paste
        - Appearance and theming
        - Browser entry (`@riteofstring/setta/browser`)
        - Packaging and installation
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser and React version
      placeholder: Chrome 142 on macOS 15, React 19.1.0
    validations:
      required: true
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the expected and actual result.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: List the smallest reliable sequence that reproduces the problem.
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Relevant diagnostics
      description: Add sanitized console output, screenshots, or the host code that configures the workspace.
      render: shell
  - type: checkboxes
    id: security
    attributes:
      label: Security check
      options:
        - label: This report contains no vulnerability details, credentials, or private project data.
          required: true
