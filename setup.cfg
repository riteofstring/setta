[metadata]
name = runcoder
version = attr: runcoder.__version__

[options]
packages = find:
package_dir =
    = python
include_package_data = True
install_requires =
    click==8.1.3
    requests==2.28.1
    PyYAML==6.0
    websockets==11.0.3
    jedi==0.19.0
    mypy==1.5.1
    fastapi==0.103.1
    uvicorn==0.23.2
    docstring_parser==0.15
    pywinpty==2.0.12

[options.entry_points]
console_scripts = 
    runcoder = runcoder.start:cli

[options.packages.find]
where = python

[options.extras_require]
dev =
    build==1.0.3
    black==23.7.0
    isort==5.12.0
    flake8==6.1.0
test =
    torchvision==0.16