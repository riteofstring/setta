[metadata]
name = setta
version = attr: setta.__version__
url = https://setta.dev
author = Kevin Musgrave, Jeff Musgrave
description = Python without the donkeywork.
long_description = file: README.md
long_description_content_type = text/markdown
license = Apache-2.0
project_urls =
    GitHub = https://github.com/settadev/setta

[options]
packages = find:
package_dir =
    = backend
license_files = LICENSE
include_package_data = True
install_requires =
    click == 8.2.1
    requests == 2.32.4
    PyYAML == 6.0.2
    websockets == 15.0.1
    fastapi == 0.115.12
    uvicorn == 0.34.3
    docstring_parser == 0.16
    pywinpty == 2.0.15; platform_system == "Windows"
    ptyprocess == 0.7.0; platform_system != "Windows"
    psutil == 7.0.0
    basedpyright == 1.25.0 # later versions were slower, so stick with this version
    docstring-to-markdown == 0.17
    watchdog == 6.0.0
    python-dotenv == 1.1.0
    mcp == 1.9.3
    anthropic == 0.52.2
    ruff == 0.12.12
    pydantic == 2.11.5
    SQLAlchemy == 2.0.41
    lsprotocol == 2023.0.1

[options.entry_points]
console_scripts = 
    setta = setta.start:cli

[options.packages.find]
where = backend

[options.extras_require]
dev =
    build==1.0.3
    pip-audit==2.9.0