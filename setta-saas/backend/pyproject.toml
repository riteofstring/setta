[project]
name = "backend"
version = "0.1.0"
description = "SaaS Platform Backend"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115.12",
    "uvicorn>=0.34.2",
    "sqlmodel>=0.0.22",
    "psycopg2-binary>=2.9.0",
    "pydantic-settings>=2.0.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4.0", "pytest-asyncio>=0.21.0", "mypy>=1.5.0", "ruff>=0.1.0"]
