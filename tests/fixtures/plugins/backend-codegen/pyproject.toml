[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "setta-fixture-backend-codegen"
version = "0.1.0"
description = "Backend codegen fixture plugin for Setta tests"
requires-python = ">=3.12"

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
"*" = ["setta.plugin.json", "backend/*.py"]
