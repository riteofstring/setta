[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1"]
build-backend = "build_backend"
backend-path = ["."]

[project]
name = "acme-app-subsystem-fixture"
version = "0.1.0"
description = "Unknown-id app subsystem fixture plugin for Setta tests"
requires-python = ">=3.12"
dependencies = ["setta==0.0.18"]

[tool.setuptools]
py-modules = []

[tool.setuptools.data-files]
"acme-app-subsystem-fixture" = ["setta.plugin.json", "README.md"]
"acme-app-subsystem-fixture/runtime_backend" = ["runtime_backend/main.py"]
"acme-app-subsystem-fixture/frontend/dist" = ["frontend/dist/index.css", "frontend/dist/index.js"]
