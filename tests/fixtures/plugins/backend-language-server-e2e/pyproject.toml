[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "setta-fixture-backend-language-server-e2e"
version = "0.1.0"
description = "Backend language server e2e fixture plugin for Setta tests"
requires-python = ">=3.12"

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
"*" = ["setta.plugin.json", "backend/*.py"]
