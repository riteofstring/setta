schema_version: 1

# Generated-file exclusions are shared from quality.paths.yaml. Use per-language
# generated_globs here only for deadcode-specific extras.

go:
  deadcode_version: v0.44.0
  staticcheck_version: 2025.1.1
  production_mains:
    - ./cmd/setta
    - ./cmd/setta-server
  staticcheck_packages:
    - ./...
  build_matrix:
    - goos: env
      goarch: env
      tags: []

python:
  lint_roots:
    - backend/setta
    - backend/scripts
    - scripts
    - plugins
  reachability_roots:
    - backend/setta
    - scripts
  entrypoint_commands:
    - ["-m", "setta", "--help"]
    - ["-m", "setta", "version"]
  public_modules:
    - backend/setta/api/__init__.py
    - backend/setta/llm/chat_toolkit/__init__.py
  vulture_min_confidence: 60

frontend:
  # TypeScript/React app entrypoints for the Knip production graph.
  app_roots:
    - frontend/src/index.tsx
  lint_roots:
    - src
    - plugin-sdk/app-subsystem/src
  package_roots:
    - frontend/plugin-sdk/app-subsystem
    - plugins/setta-json-render-app-gen/frontend
    - plugins/setta-watch-code/frontend
