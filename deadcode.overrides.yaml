schema_version: 1

go:
  deadcode_version: v0.44.0
  staticcheck_version: 2025.1.1
  build_matrix:
    - goos: env
      goarch: env
      tags: []
  production_mains:
    - ./cmd/setta
    - ./cmd/setta-server
  generated_globs:
    - "**/*_gen.go"

python:
  public_modules:
    - backend/setta/api/__init__.py
    - backend/setta/llm/chat_toolkit/__init__.py
  generated_globs:
    - backend/setta/types/generated/**
    - backend/setta/sdk_contracts/generated.py
    - backend/setta/api/listener_endpoint_client.py
  vulture_min_confidence: 80

frontend:
  app_roots:
    - frontend/src/index.tsx
  generated_globs:
    - frontend/src/openapi/**/generated/**
    - frontend/src/utils/generatedTypes.ts
