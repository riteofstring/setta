IMPORTS:
  torch.optim:
  torchvision:
  abcde_pip.templates:
    - simple_train_test

transforms: &transforms
  name: torchvision.transforms 

transforms_module_without_compose: &transforms_module_without_compose
  - ModuleInfo:
      <<: *transforms
      exclude:
        - Compose

transforms_module: &transforms_module
  - ModuleInfo:
      <<: *transforms
      include:
        - Compose
      set_type:
        Compose:
          transforms:
            list:
              - <<: *transforms_module_without_compose

SECTIONS:
  Model:
    - IMPORTS:
        torchvision:
          - models
    - ModuleInfo:
        name: models
        include:
          - ~REGEX~resnet*
    - ModuleInfo:
        name: simple_train_test
        include:
          - Net
          
  Optimizer:
    - ModuleInfo:
        name: torch.optim
        include:
          - SGD
          - Adam
          - Adadelta

  Transform:
    - <<: *transforms_module


  TrainDataset:
    - ModuleInfo:
        name: torchvision.datasets

  ValDataset:
    - ModuleInfo:
        name: torchvision.datasets
  
  # Various Params:
