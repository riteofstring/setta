transforms_module: &transforms_module
  name: torchvision.transforms 

transforms_module_without_compose: &transforms_module_without_compose
  - ModuleInfo:
      <<: *transforms_module
      exclude:
        - Compose


MODULES:
  torchvision_models:
    - ModuleInfo:
        name: torchvision.models
        include:
          - ~REGEX~resnet*
  my_models:
    - ModuleInfo:
        name: abcde_pip.templates.simple_train_test
        include:
          - Net
  optimizers:
    - ModuleInfo:
        name: torch.optim
        include:
          - SGD
          - Adam
          - Adadelta
      
  datasets:
    - ModuleInfo:
        name: torchvision.datasets

  transforms:
    - ModuleInfo:
        <<: *transforms_module
        include:
          - Compose
        set_type:
          Compose:
            transforms:
              list:
                - <<: *transforms_module_without_compose

PARAMETERS:
  various_params:
    - ParameterInfo:
        dataset_root:
          default_val: "."
        batch_size:
          default_val: 64
        test_batch_size:
          default_val: 1000
        epochs:
          default_val: 2

UI:
  Model:
    - torchvision_models
    - my_models
  Optimizer:
    - optimizers
  Transform:
    - transforms
  TrainDataset:
    - datasets
  ValDataset:
    - datasets
  OtherParameters:
    parameters:
      - various_params

FACTORIES:
  Optimizer:
    abcde_pip.templates.pytorch_factories.optimizer_factory:
      model: ~REF~Model
      optimizer: ~REF~Optimizer
      kwargs: ~KWARGS~Optimizer

  TrainDataset:
    abcde_pip.templates.pytorch_factories.dataset_factory:
      dataset: ~REF~TrainDataset
      transform: ~REF~Transform
      kwargs: ~KWARGS~TrainDataset

  ValDataset:
    abcde_pip.templates.pytorch_factories.dataset_factory:
      dataset: ~REF~ValDataset
      transform: ~REF~Transform
      kwargs: ~KWARGS~ValDataset


FUNCS:
  Main:
    abcde_pip.templates.simple_train_test.main:
      model: ~REF~Model
      optimizer: ~REF~Optimizer
      train_set: ~REF~TrainDataset
      val_set: ~REF~ValDataset
      batch_size: 64
      test_batch_size: 1000
      epochs: 1


