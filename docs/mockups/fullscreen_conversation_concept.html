<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>Setta — living reasoning stream</title>
<style>
  html, body { margin: 0; height: 100%; background: #05060a; overflow: hidden;
    font: 13px ui-monospace, Menlo, monospace; color: #cdd3e0; }
  #c { display: block; width: 100vw; height: 100vh; }
  .grp { display: flex; gap: 6px; align-items: center; }
  .grp > span { opacity: 0.5; margin-right: 4px; letter-spacing: 0.04em; text-transform: uppercase; font-size: 11px; }
  button { font: inherit; color: #cdd3e0; background: rgba(40,48,66,0.6);
    border: 1px solid rgba(120,140,180,0.22); padding: 5px 10px; border-radius: 7px; cursor: pointer; }
  button:hover { background: rgba(60,72,98,0.7); }
  button.on { background: rgba(90,150,210,0.35); border-color: rgba(120,190,240,0.6); color: #eaf2ff; }
  label { display: flex; gap: 6px; align-items: center; cursor: pointer; user-select: none; }
  #tip { position: fixed; z-index: 12; pointer-events: none; transform: translate(-50%, -100%);
    background: rgba(10,14,22,0.94); border: 1px solid rgba(120,190,240,0.5);
    color: #eaf2ff; padding: 6px 10px; border-radius: 7px; white-space: nowrap; display: none; }
  #tip .k { font-size: 10px; letter-spacing: 0.06em; text-transform: uppercase; opacity: 0.6; }
  #tip .alt { opacity: 0.55; color: #b9a7ff; }
  #tip .chip { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 7px; vertical-align: 0; box-shadow: 0 0 6px currentColor; }
  .reticle { position: fixed; z-index: 11; pointer-events: none; display: none; transform: translate(-50%,-50%); }
  .reticle .c { position: absolute; width: 11px; height: 11px; filter: drop-shadow(0 0 3px currentColor); }
  .reticle .c.tl { left:0; top:0; border-left:2px solid; border-top:2px solid; }
  .reticle .c.tr { right:0; top:0; border-right:2px solid; border-top:2px solid; }
  .reticle .c.bl { left:0; bottom:0; border-left:2px solid; border-bottom:2px solid; }
  .reticle .c.br { right:0; bottom:0; border-right:2px solid; border-bottom:2px solid; }
  #reticleSel { color: rgba(255,158,216,0.95); }
  #err { position: fixed; bottom: 0; left: 0; color: #f77; white-space: pre-wrap; padding: 8px; z-index: 20; }
  /* ── setta palette + fullscreen chrome ── */
  :root {
    --bg: oklch(0.128 0.007 261); --surface: oklch(0.147 0.009 264); --panel: oklch(0.165 0.010 264);
    --fg: oklch(0.908 0.013 263); --muted: oklch(0.717 0.044 264); --faint: oklch(0.522 0.065 264);
    --border: oklch(0.290 0.032 262); --primary: oklch(0.76 0.115 250); --sans: ui-sans-serif, system-ui, sans-serif;
    --mono: ui-monospace, Menlo, monospace; --accent-green: oklch(0.79 0.145 152); --accent-red: oklch(0.62 0.14 25.331); --accent-teal: oklch(0.82 0.125 185);
  }
  #topbar { position: fixed; top: 0; left: 0; right: 0; height: 44px; z-index: 14; font-family: var(--sans);
    display: flex; align-items: center; justify-content: space-between; padding: 0 14px;
    background: linear-gradient(to bottom, rgba(8,10,16,0.8), rgba(8,10,16,0)); }
  .tb-left, .tb-right { display: flex; align-items: center; gap: 8px; }
  .tb-nav { font-size: 17px; line-height: 1; color: var(--muted); background: transparent; border: 0; padding: 4px 8px; border-radius: 6px; cursor: pointer; }
  .tb-nav:hover { color: var(--fg); background: rgba(255,255,255,0.05); }
  .tb-conv { font-size: 13px; color: var(--fg); font-weight: 600; min-width: 190px; text-align: center; font-family: var(--sans); }
  .tb-conv .is-director, #convTitle.is-director { color: var(--merge); }
  .tb-dots { display: flex; align-items: center; gap: 5px; margin-left: 6px; }
  /* The Director leads the strip: a slightly larger ring, because it is a
     different kind of destination rather than one more thread. */
  .tb-dots i.dir { width: 7px; height: 7px; border-radius: 50%; background: transparent;
    box-shadow: inset 0 0 0 1.5px var(--faint); }
  .tb-dots i.dir.on { background: var(--merge); box-shadow: 0 0 8px var(--merge); }
  .dot-sep { width: 1px; height: 9px; background: var(--border); margin: 0 3px; }
  .tb-dots i { width: 5px; height: 5px; border-radius: 50%; background: var(--border); }
  .tb-dots i.on { background: var(--primary); }
  .tb-chip { font: 11px var(--sans); color: var(--faint); background: transparent; border: 1px solid var(--border); border-radius: 999px; padding: 4px 11px; cursor: pointer; letter-spacing: 0.02em; }
  .tb-chip:hover { color: var(--muted); }
  .tb-chip.on { color: var(--fg); border-color: color-mix(in oklch, var(--primary) 55%, transparent); background: color-mix(in oklch, var(--primary) 12%, transparent); }
  .artifact-from { font-size: 10px; text-transform: uppercase; letter-spacing: 0.14em;
    color: var(--faint); font-weight: 600; margin-top: 3px; }
  .rail { position: fixed; top: 44px; bottom: 92px; width: 300px; z-index: 12; display: flex; flex-direction: column; gap: 12px; padding: 20px; font-family: var(--sans); pointer-events: none; }
  .rail > * { pointer-events: auto; }
  #railLeft { left: 0; justify-content: flex-start; }
  /* floating transcript labels riding the ladder nodes */
  #nodeLabels { position: fixed; inset: 0; z-index: 8; pointer-events: none; }
  .nlabel { position: absolute; transform: translateX(-50%); max-width: 300px; font: 12px/1.4 var(--sans); letter-spacing: 0.01em; text-align: center;
    padding: 3px 9px; border-radius: 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    background: color-mix(in oklch, var(--bg) 86%, transparent); transition: opacity 0.28s ease; }   /* solid tint (no backdrop-filter); opacity animates the show->fade */
  .nl-reason { color: var(--muted); border: 1px solid var(--border); font-size: 11.5px; max-width: 260px; }
  .multi-cols .nlabel { font-size: 11px; }
  .multi-cols .nl-outcome { max-width: 210px; }
  .nl-coltitle { position: absolute; transform: translateX(-50%); font: 10px var(--sans); text-transform: uppercase;
    letter-spacing: 0.13em; color: var(--muted); font-weight: 600; white-space: nowrap; pointer-events: none; }
  .nl-coltitle.focus { color: var(--accent-teal); }
  .nl-coltitle.tile { font-size: 10px; color: var(--muted); }
  /*
   * A tile's live step, under its node. This is the part that changes as the
   * thread works, which is what makes the tile a thing that is happening
   * rather than a status glyph that was set once.
   */
  .nl-colstep { position: absolute; transform: translateX(-50%); font: 11px var(--sans);
    color: var(--faint); white-space: nowrap; pointer-events: none; max-width: 210px;
    overflow: hidden; text-overflow: ellipsis; transition: opacity 240ms; }
  .nl-you { border-color: color-mix(in oklch, var(--accent-teal) 34%, transparent); }
  .nl-you .nl-mark { color: var(--accent-teal); }
  .nlabel.nl-sticky { z-index: 9; background: color-mix(in oklch, var(--bg) 90%, transparent); border-color: color-mix(in oklch, var(--accent-teal) 55%, transparent); box-shadow: 0 6px 18px rgba(0,0,0,0.55); transition: top 120ms ease-out; }
  /* outcome summary: floats over the ✓/✗ node, mark on the left, click to expand the full result */
  .nl-outcome { transform: translate(-50%, -50%); pointer-events: auto; display: inline-flex; align-items: baseline; gap: 7px;
    text-align: left; white-space: normal; overflow: visible; max-width: 320px; cursor: pointer; color: var(--fg);
    border: 1px solid var(--border); background: color-mix(in oklch, var(--bg) 90%, transparent); }
  .nl-outcome .nl-mark { flex: none; font-weight: 700; font-size: 13px; line-height: 1; }
  .nl-outcome .nl-sum { min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .nl-ok { border-color: color-mix(in oklch, var(--accent-green) 34%, transparent); }
  .nl-ok .nl-mark { color: var(--accent-green); }
  .nl-fail { border-color: color-mix(in oklch, var(--accent-red) 42%, transparent); }
  .nl-fail .nl-mark { color: var(--accent-red); }
  .nl-outcome:hover { border-color: color-mix(in oklch, var(--primary) 45%, transparent); }
  .nl-outcome.nl-below { transform: translateX(-50%); }   /* failure: summary sits below so the eclipsed node stays visible */
  .nl-outcome.expanded { max-width: min(440px, 40vw); z-index: 12; box-shadow: 0 8px 22px rgba(0,0,0,0.55); }
  .nl-outcome.expanded .nl-sum { white-space: normal; }
  #railRight { right: 0; overflow-y: auto; scrollbar-width: thin;
    -webkit-mask-image: linear-gradient(to bottom, transparent, #000 24px, #000 calc(100% - 24px), transparent);
            mask-image: linear-gradient(to bottom, transparent, #000 24px, #000 calc(100% - 24px), transparent); }
  body.hide-summaries #railLeft, body.hide-artifacts #railRight, body.hide-composer #composer { display: none; }
  /*
   * The Director's view is the constellation, so it gives the canvas the whole
   * window. Artifacts belong to the thread that produced them and are one
   * arrow away; the Now rail keeps only what is waiting on an answer, and
   * disappears when nothing is.
   */
  body.director-view #railRight, body.director-view #railLeft { display: none; }
  /*
   * What needs you rides the composer instead, because that is where you can
   * do something about it. A rail would only be able to tell you.
   */
  #directorHint .needs { color: var(--risk); font-weight: 600; }
  #directorHint button.needs { background: transparent; border: 0; padding: 0;
    font: inherit; cursor: pointer; text-decoration: underline;
    text-underline-offset: 3px; text-decoration-color: color-mix(in oklch, var(--risk) 45%, transparent); }
  #directorHint button.needs:hover { text-decoration-color: var(--risk); }
  .rail-label { font-size: 10px; text-transform: uppercase; letter-spacing: 0.14em; color: var(--faint); font-weight: 600; }
  #highlights { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
  .hl { display: grid; grid-template-columns: 7px 1fr; gap: 9px; font-size: 13px; color: var(--muted); line-height: 1.35; cursor: pointer; }
  .hl .d { width: 6px; height: 6px; border-radius: 50%; margin-top: 5px; box-shadow: 0 0 6px currentColor; }
  .hl.old { opacity: 0.4; }
  .hl.old:hover { opacity: 0.7; }
  .hl.cur .hl-short { color: var(--fg); font-weight: 600; }
  .hl-full { display: none; margin-top: 3px; font-size: 12px; color: var(--muted); line-height: 1.45; }
  .hl.cur .hl-full, .hl.expanded .hl-full { display: block; }   /* newest + clicked items show the fuller detail */
  .hl.expanded .hl-short { color: var(--fg); }
  .rail-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
  .rail-link { background: transparent; border: 0; padding: 0; font: 11px var(--sans); color: var(--faint); cursor: pointer; letter-spacing: 0.02em; }
  .rail-link:hover { color: var(--accent-teal); }
  #artifacts { display: flex; flex-direction: column; gap: 12px; }
  .artifact { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 12px 13px 13px; cursor: pointer; transition: border-color 160ms, transform 160ms;
    animation: art-in 420ms cubic-bezier(0.22,1,0.36,1); }
  @keyframes art-in { from { opacity: 0; transform: translateY(10px); } }
  .artifact:hover { border-color: color-mix(in oklch, var(--primary) 45%, transparent); transform: translateY(-1px); }
  .artifact-kicker { font-size: 10px; text-transform: uppercase; letter-spacing: 0.14em; color: var(--faint); font-weight: 600; margin-bottom: 3px; display: flex; justify-content: space-between; }
  .artifact-kicker .exp { opacity: 0.55; font-size: 11px; }
  .artifact-title { font-size: 13px; font-weight: 600; color: var(--fg); }
  .artifact-meta { font-size: 11.5px; color: var(--muted); margin-top: 6px; }
  #composer { position: fixed; bottom: 0; left: 0; right: 0; z-index: 13; display: flex; flex-direction: column; align-items: center; gap: 9px; padding: 0 24px 22px; font-family: var(--sans); }
  #directorHint { font-size: 11px; color: var(--faint); display: flex; align-items: center; gap: 7px; }
  #directorHint i { width: 6px; height: 6px; border-radius: 50%; background: oklch(0.82 0.125 185); color: oklch(0.82 0.125 185); box-shadow: 0 0 8px currentColor; }
  .input-wrap { width: 100%; max-width: 620px; display: flex; align-items: center; gap: 8px;
    background: color-mix(in oklch, var(--surface) 94%, transparent); border: 1px solid var(--border); border-radius: 999px; padding: 0 12px 0 18px; }
  .input-wrap:focus-within { border-color: color-mix(in oklch, var(--primary) 55%, transparent); box-shadow: 0 0 0 3px color-mix(in oklch, var(--primary) 10%, transparent); }
  .input-wrap input { flex: 1; background: transparent; border: 0; outline: none; color: var(--fg); font: 13px var(--sans); padding: 13px 0; }
  .input-wrap input::placeholder { color: var(--faint); }
  .enter-chip { font: 10px ui-monospace, monospace; color: var(--faint); border: 1px solid var(--border); border-radius: 4px; padding: 1px 5px; }
/*
 * The level-of-detail switch, shown on the Director's view only.
 *
 * Columns are readable to about four threads. Past that the honest move is not
 * to shrink them — a twelve-column constellation is a partial view of
 * everything instead of a complete view of anything — but to change what a
 * thread is drawn as. This is here so the transition can be watched rather
 * than described.
 */
#lodbar { position: fixed; top: 52px; left: 50%; translate: -50% 0; z-index: 15;
  display: flex; gap: 6px; align-items: center;
  background: color-mix(in oklch, var(--bg) 82%, transparent);
  border: 1px solid color-mix(in oklch, var(--border) 70%, transparent);
  padding: 5px 10px; border-radius: 999px; }
#lodbar[hidden] { display: none; }
.lod-label, .lod-note { font: 10px var(--sans); text-transform: uppercase; letter-spacing: 0.14em;
  color: var(--faint); font-weight: 600; }
.lod-note { text-transform: none; letter-spacing: 0.01em; font-size: 11px; margin-left: 6px; }
#lodbar button { background: transparent; border: 1px solid var(--border); border-radius: 999px;
  color: var(--faint); font: 11px var(--sans); padding: 2px 9px; cursor: pointer;
  font-variant-numeric: tabular-nums; }
#lodbar button:hover { color: var(--muted); }
#lodbar button.on { color: var(--fg); border-color: color-mix(in oklch, var(--primary) 55%, transparent);
  background: color-mix(in oklch, var(--primary) 12%, transparent); }

  #devbar { position: fixed; top: 52px; left: 14px; z-index: 14; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; max-width: 62vw;
    background: rgba(8,10,16,0.84); border: 1px solid rgba(120,140,180,0.18); padding: 8px 10px; border-radius: 10px; }
  #devbar[hidden] { display: none; }
  /* longer-form summary in the Now rail */
  #summaryToggle { align-self: flex-start; margin-top: 4px; font: 11px var(--sans); color: var(--faint); background: transparent; border: 0; padding: 2px 0; cursor: pointer; letter-spacing: 0.03em; }
  #summaryToggle:hover { color: var(--muted); }
  #summaryToggle .caret { display: inline-block; transition: transform 160ms; }
  #summaryToggle.open .caret { transform: rotate(90deg); }
  #summaryText { font: 12.5px/1.5 var(--sans); color: var(--muted); max-width: 300px; }
  #summaryText[hidden] { display: none; }
  /* artifact body preview */
  .artifact-body { margin-top: 9px; display: flex; flex-direction: column; gap: 4px; }
  .ab-row { display: grid; grid-template-columns: 62px 1fr auto; gap: 8px; align-items: center; font: 11px var(--mono); color: var(--muted); }
  .ab-track { height: 5px; border-radius: 3px; background: color-mix(in oklch, var(--border) 60%, transparent); overflow: hidden; }
  .ab-bar { height: 100%; border-radius: 3px; background: color-mix(in oklch, var(--primary) 60%, transparent); }
  .ab-num { font-variant-numeric: tabular-nums; }
  .ab-diff { font: 11px var(--mono); white-space: pre; line-height: 1.5; }
  .ab-add { color: var(--accent-green); } .ab-del { color: var(--accent-red); }
  /* main response area */
  #response-legacy-unused { position: fixed; left: 50%; transform: translateX(-50%); bottom: 96px; width: min(680px, calc(100vw - 660px)); z-index: 13; cursor: pointer; font-family: var(--sans);
    background: color-mix(in oklch, var(--surface) 74%, transparent); border: 1px solid var(--border); border-top-color: color-mix(in oklch, var(--primary) 35%, transparent);
    border-radius: 14px; padding: 13px 16px 9px; transition: border-color 160ms; }
  #response:hover { border-color: color-mix(in oklch, var(--primary) 45%, transparent); }
  body.hide-composer #response { bottom: 22px; }
  #responseText { font: 14px/1.5 var(--sans); color: var(--fg); display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  #responseText.working { color: var(--muted); }
  #responseText.working::after { content: '▍'; color: var(--primary); animation: caret 1s steps(1) infinite; }
  @keyframes caret { 50% { opacity: 0; } }
  #responseFoot { display: flex; justify-content: space-between; align-items: center; margin-top: 8px; font: 10px var(--sans); letter-spacing: 0.06em; text-transform: uppercase; color: var(--faint); }
  .rf-hist { opacity: 0.8; }
  /* history overlay */
  #history { position: fixed; inset: 0; z-index: 20; background: rgba(4,6,10,0.82); display: grid; place-items: center; font-family: var(--sans); }
  #history[hidden] { display: none; }
  #historyPanel { width: min(560px, calc(100vw - 40px)); max-height: 74vh; overflow-y: auto; background: var(--panel); border: 1px solid var(--border); border-radius: 16px; padding: 18px 20px 20px; animation: art-in 260ms cubic-bezier(0.22,1,0.36,1); }
  .hh { display: flex; justify-content: space-between; align-items: center; font-size: 14px; font-weight: 600; color: var(--fg); }
  .hh button { background: transparent; border: 0; color: var(--faint); font-size: 14px; cursor: pointer; }
  .hh-note { font-size: 11px; color: var(--faint); margin: 4px 0 16px; }
  .turn { display: flex; flex-direction: column; gap: 8px; margin-bottom: 18px; }
  .turn .u { align-self: flex-end; font-size: 13px; color: var(--fg); background: color-mix(in oklch, var(--accent-teal) 14%, transparent); border: 1px solid color-mix(in oklch, var(--accent-teal) 32%, transparent); border-radius: 12px 12px 3px 12px; padding: 8px 12px; max-width: 82%; line-height: 1.4; }
  .turn .r { align-self: flex-start; font-size: 13px; color: var(--fg); background: color-mix(in oklch, var(--surface) 80%, transparent); border: 1px solid var(--border); border-left: 2px solid var(--accent-green); border-radius: 12px 12px 12px 3px; padding: 8px 12px; max-width: 82%; line-height: 1.5; }
  /* conversation-dot activity */
  .tb-dots i { transition: background 300ms, box-shadow 300ms; }
  .tb-dots i.act { background: var(--accent-teal); box-shadow: 0 0 7px currentColor; color: var(--accent-teal); animation: dotpulse 1.4s ease-in-out infinite; }
  .tb-dots i.done { background: var(--accent-green); opacity: 0.65; }
  @keyframes dotpulse { 50% { opacity: 0.4; } }
  .dot-count { margin-left: 8px; font: 10px var(--mono); color: var(--faint); letter-spacing: 0.04em; }
  #railLeft, #railRight, #directorHint, .tb-conv, #convDots { transition: opacity 0.28s ease; }
  body.switching #railLeft, body.switching #railRight, body.switching #directorHint { opacity: 0; }
  body.switching .tb-conv, body.switching #convDots { opacity: 0.35; }
  @media (max-width: 760px) { .rail { display: none; } .tb-chip[data-view="summaries"], .tb-chip[data-view="artifacts"] { display: none; } .tb-conv { min-width: 120px; } }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="reticleActive" class="reticle"><span class="c tl"></span><span class="c tr"></span><span class="c bl"></span><span class="c br"></span></div>
<div id="reticleSel" class="reticle"><span class="c tl"></span><span class="c tr"></span><span class="c bl"></span><span class="c br"></span></div>
<div id="tip"></div>
<div id="lodbar" hidden>
  <span class="lod-label">Threads</span>
  <button data-lod="3" class="on">3</button><button data-lod="4">4</button>
  <button data-lod="6">6</button><button data-lod="9">9</button><button data-lod="16">16</button>
  <span class="lod-note" id="lodNote">columns · every thread's reasoning is legible</span>
</div>

<header id="topbar">
  <div class="tb-left">
    <button class="tb-nav" id="convPrev" aria-label="Previous conversation">‹</button>
    <div class="tb-conv"><span id="convTitle">—</span></div>
    <button class="tb-nav" id="convNext" aria-label="Next conversation">›</button>
    <div class="tb-dots" id="convDots"></div>
  </div>
  <div class="tb-right">
    <button class="tb-chip on" data-view="summaries">Summaries</button>
    <button class="tb-chip on" data-view="artifacts">Artifacts</button>
    <button class="tb-chip on" data-view="composer">Input</button>
    <button class="tb-chip" id="devToggle">Dev</button>
  </div>
</header>

<aside id="railLeft" class="rail">
  <div class="rail-head"><span class="rail-label">Now</span><button id="threadHistoryBtn" type="button" class="rail-link">see thread history ›</button></div>
  <ol id="highlights"></ol>
  <button id="summaryToggle" type="button"><span class="caret">▸</span> Summary</button>
  <div id="summaryText" hidden></div>
</aside>

<div id="nodeLabels"></div>

<aside id="railRight" class="rail">
  <div class="rail-label">Artifacts</div>
  <div id="artifacts"></div>
</aside>

<div id="history" hidden>
  <div id="historyPanel">
    <div class="hh"><span>History</span><button id="historyClose" aria-label="Close">✕</button></div>
    <div class="hh-note">Only your messages and each final response — nothing in between.</div>
    <div id="historyLog"></div>
  </div>
</div>

<div id="composer">
  <div id="directorHint"><i></i><span id="directorText"></span></div>
  <label class="input-wrap">
    <input id="chatInput" type="text" placeholder="Ask the director…   (‹ › switch conversation · scroll to look back)" autocomplete="off" />
    <span class="enter-chip">⏎</span>
  </label>
</div>

<div id="devbar" hidden>
  <div class="grp"><span>collapse</span>
    <button data-cm="off">off</button><button data-cm="ladder" class="on">ladder</button><button data-cm="focus">focus</button><button data-cm="implode">implode</button>
  </div>
  <div class="grp"><span>labels</span>
    <button data-lm="auto" class="on">auto</button><button data-lm="show">show</button><button data-lm="off">off</button>
  </div>
  <div class="grp"><span>pattern</span>

<script>
"use strict";
const canvas=document.getElementById('c');

const GPU_NAME=(()=>{ try{ const d=gl.getExtension('WEBGL_debug_renderer_info');
  const r=d?gl.getParameter(d.UNMASKED_RENDERER_WEBGL):'';
  if(/swiftshader|software|llvmpipe/i.test(r)) return 'SOFTWARE (no GPU accel!)';
  return (r.match(/ANGLE \(([^,]+), ([^,)]+)/)||[,'',r])[2].trim()||r||'unknown'; }catch(e){ return 'unknown'; } })();
let gpuQuery=null, gpuPending=null, gpuMs=0;
const errEl=document.getElementById('err'), tip=document.getElementById('tip');
function fail(m){errEl.textContent=m;throw new Error(m);}
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}

// modes: 0 think, 1 do, 2 struggle, 3 success, 4 fail, 5 merge
const M={think:0,do:1,struggle:2,success:3,fail:4,merge:5,listening:6};
const MODE_NAME=['thinking','doing','struggling','success','failed','synthesis','listening'];
const MODE_COLORS=['#4dcbf0','#9e73ff','#ffcb42','#5cf5a0','#ff495e','#c7edff','#b8e6ff'];
const CYAN=[0.30,0.80,0.95], VIOLET=[0.62,0.45,1.0];   // particle-field tints
const BARREL=0.21;   // CRT barrel curvature — shared by post pass, icon warp, and overlay/label warp so they stay aligned
// ── graph fit frame ──────────────────────────────────────────────────────────
// The reasoning graph is authored in a fixed PORTRAIT reference frame and letterboxed
// into the window, so its shape (aspect) and on-screen scale stay put no matter the
// window size — instead of the whole thing stretching + the nodes ballooning.
const REF_W=800, REF_H=1024, MAX_FIT=1.1;   // design frame (aspect + size the layout is tuned for); MAX_FIT caps growth on big displays
let VIEW={fitX:1,fitY:1,size:1};            // per-frame: authored graph-clip -> window-clip, plus a size multiplier for nodes/icons
function computeView(useFit){
  const W=Math.max(1,innerWidth), H=Math.max(1,innerHeight);
  if(!useFit){ VIEW.fitX=1; VIEW.fitY=1; VIEW.size=1; return; }   // grid views fill the window as before
  const fit=Math.min(MAX_FIT, W/REF_W, H/REF_H);                  // "contain" the reference frame, but never scale past MAX_FIT
  VIEW.fitX=(REF_W*fit)/W; VIEW.fitY=(REF_H*fit)/H; VIEW.size=fit;
}

const RUN=[
  {k:'step',m:'think',t:'read request'},
  {k:'step',m:'do',t:'open workspace layout engine'},
  {k:'dead',m:'do',t:'grep unrelated speech module',why:'wrong subsystem'},
  {k:'step',m:'think',t:'locate drag-reorder path'},
  {k:'fan',lanes:[
     {m:'do',t:'inspect swap logic',steps:[{m:'do',t:'check slot widths'},{m:'struggle',t:'trace adjacency'}]},
     {m:'do',t:'profile frame timing',steps:[{m:'think',t:'record baseline'}]},
     {m:'do',t:'read overview ghost',steps:[{m:'do',t:'measure pan cost'}],dead:true},
   ],merge:'synthesize findings'},
  {k:'step',m:'think',t:'draft adjacent-swap fix'},
  {k:'dead',m:'do',t:'add width-adopt compat shim',why:'violates no-compat rule'},
  {k:'step',m:'do',t:'apply fix'},
  {k:'step',m:'struggle',t:'re-measure frame timing'},
  {k:'step',m:'success',t:'commit change'},
];

const STEP=0.20, POP=0.38, FAIL_DELAY=1.1;
const RESP_H=0.34, TURN_GAP=0.42;          // expanded spacing: reason->response gap, and gap after an open turn
const COLLAPSE_GAP=0.18;                    // folded gap between outcome nodes (room for the question label under each)
let INTERVAL=5.5, DEAD_INTERVAL=4.0;   // node dwell (driven by the speed slider, default slowest); animation durations stay fixed
let collapseMode='ladder', labelMode='auto', bgStyle=1, threadCount=1, parallelCols=1;   // dev-panel variations; fluid field is the default now
// You land on the Director. Talking to it is the default, not a constraint:
// one arrow puts you on a thread, and then you are talking to that thread.
let onDirector=true, viewsReady=false;
function laneOffsets(K){if(K<=1)return[0];const s=0.30,st=-(K-1)/2*s,o=[];for(let i=0;i<K;i++)o.push(st+i*s);return o;}

// A conversation is a THREAD of turns. Each turn is user-input node -> live reasoning graph -> final
// response node. Positions are computed dynamically each frame (see layout()) so the reasoning graph can
// collapse into a clean user/AI ladder once the answer is logged, and re-expand from stored data on click.
function addThread(conv, nodes, edges, turns, col, xOff, xScale, clock0){
  let clock=clock0;
  const mk=(role,ti,x,label,mode,born,localY,fails)=>{ const md=M[mode]!==undefined?M[mode]:mode;
    const id=nodes.length; const px=xOff+x*xScale;
    nodes.push({id,role,turn:ti,col,x:px,baseX:px,label,mode:md,born,
      settleAt:born+(fails?FAIL_DELAY:INTERVAL*1.4), failAt:fails?FAIL_DELAY:999,
      localY:localY||0, worldY:0, alpha:1});
    return id; };
  const link=(a,b,childBorn,mode,dead,spine)=>{ const md=M[mode]!==undefined?M[mode]:mode;
    let conf=0.9; if(md===M.struggle) conf=0.45;
    edges.push({a,b,childBorn,mode:md,dead:!!dead,conf,spine:!!spine,turn:nodes[b].turn}); };

  (conv.thread||[]).forEach((T)=>{
    const ti=turns.length;                                       // global turn index (columns share one turns array)
    const turn={index:ti,col,userId:-1,reasonIds:[],respId:-1,open:0,openTarget:0,manual:null,collapseStart:0,reasonSpan:0,answerAt:0};
    const uborn=clock; clock+=INTERVAL;
    turn.userId=mk('user',ti,0,T.u,'listening',uborn,0);        // the listening node carries the user's input
    let tip=turn.userId, rrow=1, side=1;
    const raw=(T.reason==='RUN')?RUN:(T.reason||[]);
    const items=raw.map(s=>s.k?s:{k:'step',m:s.m,t:s.t});   // {m,t} => a plain step; {k:...} passes through (fan/dead)
    for(const ev of items){
      if(ev.k==='step'){ const b=clock; clock+=INTERVAL;
        const id=mk('reason',ti,0,ev.t,ev.m,b,rrow*STEP); turn.reasonIds.push(id); link(tip,id,b,ev.m); tip=id; rrow++; }
      else if(ev.k==='dead'){ const b=clock; clock+=DEAD_INTERVAL;
        const id=mk('reason',ti,0.30*side,ev.t,ev.m||'do',b,rrow*STEP,true); turn.reasonIds.push(id); link(tip,id,b,ev.m||'do',true); side*=-1; rrow++; }
      else if(ev.k==='fan'){
        const K=ev.lanes.length, xs=laneOffsets(K);
        const chains=ev.lanes.map((l,i)=>({x:xs[i],seq:[{m:l.m,t:l.t}].concat(l.steps||[]),dead:!!l.dead}));
        const maxLen=Math.max(...chains.map(c=>c.seq.length));
        const prev=chains.map(()=>tip), aliveTip=chains.map(()=>null), startRow=rrow, startClock=clock;
        for(let s=0;s<maxLen;s++){ const b=startClock+s*INTERVAL;
          for(let i=0;i<chains.length;i++){ const c=chains[i]; if(s>=c.seq.length) continue;
            const spec=c.seq[s], last=s===c.seq.length-1, isDead=c.dead&&last;
            const id=mk('reason',ti,c.x,spec.t,spec.m,b+i*0.12,(startRow+s)*STEP,isDead);
            turn.reasonIds.push(id); link(prev[i],id,b+i*0.12,spec.m,isDead); prev[i]=id; aliveTip[i]=(c.dead&&last)?null:id; } }
        clock=startClock+maxLen*INTERVAL; rrow=startRow+maxLen;
        const mb=clock; clock+=INTERVAL; const mm=mk('reason',ti,0,ev.merge||'synthesize','merge',mb,rrow*STEP);
        turn.reasonIds.push(mm);
        for(let i=0;i<chains.length;i++) if(!chains[i].dead && aliveTip[i]!=null) link(aliveTip[i],mm,mb,'merge');
        tip=mm; rrow++;
      }
    }
    const rborn=clock; clock+=INTERVAL;
    turn.reasonSpan=rrow*STEP; turn.fail=(T.outcome==='fail');
    const outMode=turn.fail?'fail':'success';
    turn.respId=mk('response',ti,0,T.r,outMode,rborn,turn.reasonSpan+RESP_H);   // the outcome node: ✓ success / ✗ fail
    link(tip,turn.respId,rborn,outMode);

}
// working envelope: a node stops "working" once it has produced its next thought (ignoring the spine)
function settlePass(nodes,edges){
  const childBorn={};
  for(const e of edges){ if(e.spine) continue; const cb=nodes[e.b].born; if(childBorn[e.a]===undefined||cb<childBorn[e.a]) childBorn[e.a]=cb; }
  for(const n of nodes){ if(childBorn[n.id]!==undefined) n.settleAt=childBorn[n.id];
    if(n.failAt<900) n.settleAt=n.born+n.failAt; }
}
function build(conv){ const nodes=[],edges=[],turns=[];
  const last=addThread(conv,nodes,edges,turns,0,0,1,0); settlePass(nodes,edges);
  return {nodes,edges,turns,lastBorn:last}; }

// Side-by-side view: K real threads (centred on the current one), each a full graph in its own column
// that scrolls itself so every column's live edge lines up on screen.
function buildMulti(K, startAt, lead){
  const nodes=[],edges=[],turns=[],cols=[]; const N=CONVS.length;
  const start=(startAt===undefined)?convIdx-Math.floor(K/2):startAt;
  // `lead` puts a conversation in the first column ahead of the list — the
  // Director's own thread on its own view, so the view is not missing the one
  // conversation you are actually talking to.
  const src=i=>(lead&&i===0)?lead:CONVS[(((start+i-(lead?1:0))%N)+N)%N];
  // 1.3 keeps columns clear of both side rails; the Director's view has only
  // one rail, and often none, so its columns get the width back.
  const span=lead?1.75:1.3;
  const colW=span/K, xScale=Math.min(1, colW/0.85); let lastBorn=0;
  for(let i=0;i<K;i++){
    const conv=src(i);
    const nFrom=nodes.length, tFrom=turns.length;
    const lb=addThread(conv,nodes,edges,turns,i,(i-(K-1)/2)*colW,xScale,(i*2.7)%11);   // staggered so columns run out of phase
    cols.push({i,nodeFrom:nFrom,nodeTo:nodes.length,turnFrom:tFrom,turnTo:turns.length,cam:0,title:conv.title,
      xClip:(i-(K-1)/2)*colW, focus:lead?i===0:((((start+i)%N+N)%N)===convIdx),
      // Which conversation this column draws. Null on the Director's own
      // column: you are already in it, so there is nowhere to go.
      conv:lead?(i===0?null:i-1):(((start+i)%N+N)%N)});
    lastBorn=Math.max(lastBorn,lb);
  }
  settlePass(nodes,edges);
  return {nodes,edges,turns,cols,multi:true,lastBorn};
}

/*
 * The Director's view at scale.
 *
 * Columns are readable to about four. Beyond that the honest move is not to
 * shrink them — a 12-column constellation is a partial view of everything
 * instead of a complete view of anything — but to change what a thread is
 * drawn as. The Director keeps its full column on the left because it is the
 * conversation you are talking to; every other thread becomes a tile in the
 * remaining space, carrying position, status, and motion but no reasoning.
 */
function buildDirectorGrid(lead){
  const nodes=[],edges=[],turns=[],cols=[]; const N=CONVS.length;
  const leadSpan=0.62, leadX=-0.86;                       // the Director's own column, left
  const lb0=addThread(lead,nodes,edges,turns,0,leadX,Math.min(1,leadSpan/0.85),0);
  cols.push({i:0,nodeFrom:0,nodeTo:nodes.length,turnFrom:0,turnTo:turns.length,cam:0,
    title:lead.title,xClip:leadX,focus:true,conv:null});
  let lastBorn=lb0;
  const gc=Math.ceil(Math.sqrt(N)), gr=Math.ceil(N/gc);   // the rest, tiled
  /*
   * The grid fills the band between the switch and the composer.
   *
   * The band has to be computed rather than constant, and in two ways. A 4x4
   * sized for a 3x3 leaves the top third of the window empty — that is the row
   * count. And the canvas maps world units to a fraction of the viewport while
   * the switch, the hint, and the composer are fixed pixels, so a span tuned at
   * one window height runs into the composer at another. Both are divided out
   * here, which is why this is arithmetic and not three tuned constants.
   */
  const worldPx=0.4956*innerHeight;                    // one world unit, in CSS px
  const bandPx=Math.max(300, innerHeight-275);         // switch above, hint and composer below
  // The lift is constant in world units, not pixels: the canvas already scales
  // its own centre with the viewport, so a pixel-constant lift over-corrects in
  // a tall window and the grid drifts back into the composer.
  const cellW=1.45/gc, cellH=(bandPx/worldPx)/gr, bias=-0.36;
  for(let k=0;k<N;k++){
    const conv=CONVS[k], nFrom=nodes.length, tFrom=turns.length;
    // Larger worldY draws lower, so the row index runs with it: the oldest
    // thread is top-left and the newest is bottom-right, in reading order.
    const cx=0.24+((k%gc)-(gc-1)/2)*cellW, cy=(Math.floor(k/gc)-(gr-1)/2)*cellH+bias;
    const tail=Object.assign({},conv,{thread:(conv.thread||[]).slice(-1)});   // the live turn only
    const lb=addThread(tail,nodes,edges,turns,k+1,cx,Math.min(0.42,cellW/0.9),(k*2.7)%11);
    cols.push({i:k+1,nodeFrom:nFrom,nodeTo:nodes.length,turnFrom:tFrom,turnTo:turns.length,cam:0,
      title:conv.title,xClip:cx,focus:false,tile:true,rowY:cy,cellH,conv:k});
    lastBorn=Math.max(lastBorn,lb); }
  settlePass(nodes,edges);
  return {nodes,edges,turns,cols,multi:true,lastBorn}; }

// Parallel-threads view: N independent threads in a grid, each revealing on its own staggered clock.
// Positions are baked here (nothing folds), so there is zero per-frame buffer repacking at high counts.
function buildParallel(n){
  const nodes=[],edges=[],turns=[];
  const cols=Math.ceil(Math.sqrt(n)), rows=Math.ceil(n/cols);
  const cellW=1.85/cols, cellH=1.95/rows, step=cellH/7.5;
  const SCRIPT=[['think','read request'],['do','open engine'],['struggle','trace path'],['do','apply fix']];
  const rng=mulberry32(97);
  for(let t=0;t<n;t++){
    const c=t%cols, r=Math.floor(t/cols);
    const xB=(c-(cols-1)/2)*cellW, yB=r*cellH, fail=(t%7===3);
    const turn={index:t,userId:-1,reasonIds:[],respId:-1,open:1,openTarget:1,manual:null,collapseStart:1e9,reasonSpan:0,fail};
    let clock=rng()*6.0, row=0;                                  // staggered so threads run out of phase
    const mk=(role,label,mode,born,ly,fails)=>{ const md=M[mode]!==undefined?M[mode]:mode; const id=nodes.length;
      nodes.push({id,role,turn:t,x:xB,baseX:xB,label,mode:md,born,settleAt:born+0.75,
        failAt:fails?FAIL_DELAY:999,localY:ly,worldY:yB+ly,alpha:1}); return id; };
    turn.userId=mk('user','input','listening',clock,0); clock+=0.55; row=1;
    let tip=turn.userId;
    for(const s of SCRIPT){ const b=clock; clock+=0.55;
      const id=mk('reason',s[1],s[0],b,row*step); turn.reasonIds.push(id);
      edges.push({a:tip,b:id,childBorn:b,mode:(M[s[0]]!==undefined?M[s[0]]:s[0]),dead:false,conf:0.9,spine:false,turn:t});
      tip=id; row++; }
    const rb=clock, om=fail?'fail':'success';
    turn.respId=mk('response','result',om,rb,row*step);
    edges.push({a:tip,b:turn.respId,childBorn:rb,mode:M[om],dead:false,conf:0.9,spine:false,turn:t});
    turns.push(turn);
  }
  return {nodes,edges,turns,lastBorn:10.0,parallel:true};
}

function sh(t,s){const o=gl.createShader(t);gl.shaderSource(o,s);gl.compileShader(o);
  if(!gl.getShaderParameter(o,gl.COMPILE_STATUS))fail(gl.getShaderInfoLog(o));return o;}
function prog(v,f){const p=gl.createProgram();gl.attachShader(p,sh(gl.VERTEX_SHADER,v));gl.attachShader(p,sh(gl.FRAGMENT_SHADER,f));

const COMMON=`
float hash11(float p){ p=fract(p*0.1031); p*=p+33.33; p*=p+p; return fract(p); }
vec3 modeColor(float m){
  if(m<0.5) return vec3(0.30,0.80,0.95);   // think cyan
  if(m<1.5) return vec3(0.62,0.45,1.0);    // do violet
  if(m<2.5) return vec3(1.0,0.79,0.26);    // struggle amber
  if(m<3.5) return vec3(0.36,0.96,0.63);   // success green
  if(m<4.5) return vec3(1.0,0.29,0.37);    // fail red
  if(m<5.5) return vec3(0.78,0.95,1.0);    // merge bright

const PT_VS=`#version 300 es
layout(location=0) in float a_worldY;
layout(location=1) in float a_x;
layout(location=2) in float a_born;
layout(location=3) in float a_settle;
layout(location=4) in float a_mode;
layout(location=5) in float a_dx;     // emission direction
layout(location=6) in float a_dy;
layout(location=7) in float a_phase;  // per-particle phase 0..1
layout(location=8) in float a_speed;  // per-particle speed
layout(location=9) in float a_role;   // 0 core orbiter, 1 emitted spark
layout(location=10) in float a_failAt; // node age at which it fails (999 = never)
layout(location=11) in float a_open;    // collapse visibility 0..1 (reason nodes fade as their turn folds)
uniform float u_cam,u_time,u_dpr,u_hoverX,u_hoverWY,u_hoverOn,u_listen,u_pmode,u_xshift,u_scale,u_fitX,u_fitY;
out float v_mode,v_recent,v_alpha,v_active,v_hover,v_fail,v_isCore,v_ecl;
void main(){
  if(a_open<0.004){ gl_Position=vec4(2.0,2.0,2.0,1.0); gl_PointSize=0.0; return; }   // folded away
  float age=u_time-a_born;
  float vis=step(a_born - step(0.5,a_role)*step(a_role,1.5)*0.55, u_time);   // sparks appear early to spiral in
  float recent=exp(-max(0.0,u_cam-a_worldY)*0.85);

  float working=smoothstep(a_born,a_born+0.45,u_time)*(1.0-smoothstep(a_settle-0.35,a_settle+0.7,u_time));
  // explosion pop: spikes past full size on arrival, then settles
  float rise=smoothstep(0.0,0.10,age);
  float settle=exp(-max(age-0.10,0.0)*6.0);
  float pop=rise*(1.0+0.55*settle);
  vec2 center=vec2(a_x, -0.35 + (u_cam - a_worldY));
  if(center.y>1.3||center.y<-1.3){ gl_Position=vec4(2.0,2.0,2.0,1.0); gl_PointSize=0.0; return; }   // cull off-viewport
  float hover = exp(-distance(vec2(a_x,a_worldY),vec2(u_hoverX,u_hoverWY))*20.0) * u_hoverOn;  // u_hoverOn is eased 0..1
  float failing=step(a_failAt,998.0);
  float failAge=age-a_failAt;
  float failP=failing>0.5 ? smoothstep(0.0,0.35,failAge) : 0.0;   // was fine, now turning to failure
  vec2 pos; float psize; float palpha;
  if(failing>0.5 && failAge>0.0){
    if(a_role<0.5){

      pos=center; psize=(40.0+recent*20.0+hover*38.0)*pop; palpha=1.0;
    } else {
      // particles burst outward, then get slowly sucked back into the eclipse while the node is focused
      float burstP=exp(-failAge*2.2);
      vec2 burstPos=center+vec2(a_dx,a_dy)*(0.02+failAge*0.16);
      float t2=fract(failAge*0.25 + a_phase);
      float ang=a_phase*6.2832 + t2*5.2 + failAge*0.7;
      vec2 suckPos=center+vec2(cos(ang),sin(ang))*mix(0.085,0.004,t2);
      float focus=clamp(recent*0.9+hover,0.0,1.0);
      pos=mix(suckPos,burstPos,burstP);
      palpha=mix(focus*(1.0-t2)*0.6, 1.15*exp(-failAge*1.2), burstP);
      psize=mix((3.0+recent*3.5)*(0.35+(1.0-t2)*0.8), 6.5+recent*10.0, burstP);
    }
  } else if(a_role<0.5){
    // node body — a clean ring. Listening node is large + calm (pulses only while receiving input).
    float listen=step(5.5,a_mode);
    float lp=1.0 + listen*u_listen*0.32*abs(sin(u_time*6.0));   // pulse only when simulating listening
    pos=center;
    psize=(40.0 + recent*20.0 + working*58.0 + hover*38.0 + listen*46.0)*pop*lp;   // listening node much larger
    palpha=1.0;    // solid node body (black glyph is cut into it)
  } else if(a_role<1.5){
    float listen=step(5.5,a_mode);

  mkConv({ title:'Codex run lifecycle', seed:222, director:'on: queueing + steering an active run', t0:12.5,
    nows:[{t:'Opened the topic conversation',mode:0,full:'A run was already active on this topic, so new instructions queue rather than interrupt it.'},
          {t:'Queued work during an active run',mode:1,full:'The test task landed in the queue behind the active run instead of forcing a restart.'},
          {t:'Steered mid-run',mode:2,full:'A mid-run steer nudged the objective without cancelling — deltas kept streaming.'},
          {t:'Run completed',mode:3,full:'On completion the queued work promoted cleanly and the 214-delta stream reconciled.'}],
    summary:'A run was already active, so the new instruction queued behind it rather than interrupting; a mid-run steer nudged the objective without a restart, and the queued work promoted cleanly on completion.',
    response:'Your follow-up queued behind the active run and then promoted on completion — no restart. The mid-run steer landed, and the run finished with the queue drained.',
    history:[{u:'add tests for the queue while it’s still running', r:'Queued behind the active run and steered mid-flight; it finished and the queued test work promoted cleanly.'}],
    thread:[
      {u:'open the codex run for the queue work',
       reason:[{m:'think',t:'open topic conversation'},{m:'do',t:'read run state'},{m:'do',t:'a run is active'}],
       r:'Opened it — there’s already an active run, so a new instruction will queue rather than interrupt.'},
      {u:'add tests for the queue while it’s still running',
       reason:[{m:'do',t:'queue behind active run'},{m:'struggle',t:'steer mid-run'},{m:'think',t:'confirm objective'}],
       r:'Queued behind the active run and nudged the objective mid-flight — no restart.'},
      {u:'let it finish and promote the queued work',
       reason:[{k:'step',m:'do',t:'await active run'},
               {k:'dead',m:'do',t:'force-cancel run',why:'would drop deltas'},
               {k:'fan',lanes:[{m:'do',t:'drain queue',steps:[{m:'do',t:'promote tests'}]},
                               {m:'do',t:'flush stream',steps:[{m:'think',t:'reconcile 214 deltas'}]}],merge:'finalize run'},
               {k:'step',m:'success',t:'run completed'}],
       r:'Your follow-up queued behind the active run and then promoted on completion — no restart. The mid-run steer landed and the run finished with the queue drained.'}],
    arts:[{kicker:'State',title:'Run queue',meta:'1 active · 2 queued',
           body:{type:'rows',rows:[['active','apply fix'],['queued','add tests'],['queued','re-measure']]}},
          {kicker:'Event',title:'Assistant stream',meta:'214 deltas',
           body:{type:'rows',rows:[['deltas','214'],['tools','6']]}}] }),
];
// the switchable thread list — every one of these ticks in parallel in the background
const EXTRA_TITLES=['Pane focus ring','Sprite hydration','Overview pan cost','Codex queue drain','Voice VAD tuning',
  'Artifact diffing','Shortcut remap','Theme tokens','Session restore','Native view bounds','Presentation engine','Mobile controls'];
// how long a thread's graph runs, in units of INTERVAL — mirrors addThread's clock so we can advance
// a thread's progress in the background without ever building its graph
function threadSpanUnits(conv){ let clock=0;
  for(const T of (conv.thread||[])){
    clock+=1;                                                    // the input node
    const raw=(T.reason==='RUN')?RUN:(T.reason||[]);
    for(const s of raw){ const k=s.k||'step';
      if(k==='step') clock+=1;
      else if(k==='dead') clock+=0.727;                          // DEAD_INTERVAL/INTERVAL
      else if(k==='fan') clock+=Math.max(...s.lanes.map(l=>1+(l.steps?l.steps.length:0)))+1; }
    clock+=1;                                                    // the outcome node
    clock+=2; }                                                  // breath before the next turn
  return Math.max(1,clock); }
function buildConvList(n){ const list=[];
  for(let i=0;i<n;i++){ const base=BASE_CONVS[i%BASE_CONVS.length];
    const c=Object.assign({},base,{history:base.history.slice()});          // own mutable history; thread/arts are read-only and shared
    if(i>=BASE_CONVS.length){ const k=i-BASE_CONVS.length;
      c.title=EXTRA_TITLES[k%EXTRA_TITLES.length]+(k>=EXTRA_TITLES.length?' '+(1+Math.floor(k/EXTRA_TITLES.length)):'');
      c.seed=base.seed+i*37; c.t0=(i*1.7)%16; }
    c.spanU=threadSpanUnits(c);
    c.gT=((i*1.9)%c.spanU)*INTERVAL;                                        // its own graph clock, staggered so threads start out of phase
    list.push(mkConv(c)); }
  return list; }
// jump straight to a thread's present state (no restart from zero)
function snapToConv(){
  activeConv=CONVS[convIdx]; seed=activeConv.seed||seed; rebuild();
  if(onDirector){
    growT=g.lastBorn*0.62;                                   // arrive mid-flight; the threads did not wait for you
    layout(0); updateSceneBuffers();
    let m=0; for(const n of g.nodes) if(n.born<=growT&&n.alpha>0.02&&n.worldY>m) m=n.worldY;
    autoCam=m; viewCam=m; detached=false; camWorld=m; return; }
  activeConv.spanU=g.lastBorn/INTERVAL;                       // refine the estimate now that it's actually built
  if(activeConv.gT>g.lastBorn+FAIL_DELAY+6.0) activeConv.gT=0;
  growT=activeConv.gT||0; layout(0); updateSceneBuffers();
  let maxY=0; for(const n of g.nodes) if(n.born<=growT&&n.alpha>0.02&&n.worldY>maxY) maxY=n.worldY;
  autoCam=maxY; viewCam=maxY; detached=false; camWorld=viewCam; }
let CONVS=buildConvList(3); viewsReady=true;
function setThreads(n){ CONVS=buildConvList(n);
  convIdx=Math.min(convIdx,CONVS.length-1); lastIdx=-2; lastN=-1; snapToConv(); renderConv(); }
let convIdx=0, lastIdx=-1, lastN=-1, lastComplete=false, dotAcc=0;
const $=id=>document.getElementById(id);

function revealCount(c){ return Math.min(c.nows.length, Math.max(1, Math.floor(c.t/REVEAL_INT)+1)); }
function isComplete(c){ return c.t >= c.nows.length*REVEAL_INT + 0.8; }

// background progression — every conversation advances on its own clock
function tickConversations(dt){
  for(const c of CONVS){
    c.gT=(c.gT||0)+dt;                                             // every thread's graph keeps running in the background
    if(c.gT > c.spanU*INTERVAL + FAIL_DELAY + 6.0) c.gT=0;         // and loops on its own schedule
    if(isComplete(c)){ c.idle=(c.idle||0)+dt;                      // finished threads rest, then pick up new work so the set stays alive
      if(c.idle > 4 + (c.seed%9)){ c.t=0; c.lastReveal=0; c.idle=0; }
      continue; }
    const b=revealCount(c); c.t+=dt; if(revealCount(c)>b) c.lastReveal=c.t; }
  const c=CONVS[convIdx], n=revealCount(c), comp=isComplete(c);
  const idx=onDirector?-1:convIdx;
  if(idx!==lastIdx||n!==lastN||comp!==lastComplete){ lastIdx=idx; lastN=n; lastComplete=comp; renderConv(); }
  dotAcc+=dt; if(dotAcc>0.3){ dotAcc=0; renderDots(); }
}
function renderDots(){ const N=CONVS.length, el=$('convDots');
  const dot=(c,i)=>{ let cls=(!onDirector&&i===convIdx)?'on':''; if(isComplete(c)) cls+=' done'; else if(c.t-c.lastReveal<2.6) cls+=' act';
    return `<i class="${cls.trim()}"></i>`; };
  // The strip is a navigator between views, and the Director is a view.
  const head=`<i class="dir${onDirector?' on':''}"></i><span class="dot-sep"></span>`;
  if(N<=24){ el.innerHTML=head+CONVS.map(dot).join(''); return; }
  el.innerHTML=head+windowedDots(N,dot); return; }
function windowedDots(N,dot){
  const half=9, start=Math.max(0, Math.min(N-(half*2+1), convIdx-half));    // window the strip once there are many threads
  return CONVS.slice(start,start+half*2+1).map((c,i)=>dot(c,start+i)).join('')+
    `<span class="dot-count">${onDirector?'—':convIdx+1}/${N}</span>`; }

function artifactBody(b){ if(!b) return '';
  if(b.type==='bars') return `<div class="artifact-body">`+b.rows.map(r=>`<div class="ab-row"><span>${r[0]}</span><span class="ab-track"><span class="ab-bar" style="width:${Math.round(r[2]*100)}%"></span></span><span class="ab-num">${r[1].toFixed(1)}</span></div>`).join('')+`</div>`;
  if(b.type==='diff') return `<div class="artifact-body"><div class="ab-diff">`+b.lines.map(l=>`<span class="ab-${l[0]==='+'?'add':'del'}">${l[0]} ${l[1].replace(/</g,'&lt;')}</span>`).join('\n')+`</div></div>`;
  if(b.type==='rows') return `<div class="artifact-body">`+b.rows.map(r=>`<div class="ab-row" style="grid-template-columns:1fr auto"><span>${r[0]}</span><span class="ab-num">${r[1]}</span></div>`).join('')+`</div>`;
  return ''; }

function renderConv(){
  if(onDirector) return renderDirector();
  const c=CONVS[convIdx], n=revealCount(c), complete=isComplete(c);
  document.body.classList.remove('director-view'); $('lodbar').hidden=true;
  $('convTitle').textContent=c.title; $('convTitle').classList.remove('is-director');
  $('directorText').textContent=c.director; renderDots();
  $('chatInput').placeholder='Reply to “'+c.title+'”…   (‹ › switch conversation)';
  const shown=c.nows.slice(0,n);
  $('highlights').innerHTML=shown.map((h,i)=>{
    const col=MODE_COLORS[h.mode]||'#8aa'; const newest=i===shown.length-1;
    const cls='hl'+(i<shown.length-2?' old':'')+(newest?' cur':'')+(h.full?'':' nofull');   // newest shows its full text
    const full=h.full?`<span class="hl-full">${h.full.replace(/</g,'&lt;')}</span>`:'';
    return `<li class="${cls}" data-i="${i}"><span class="d" style="color:${col};background:${col}"></span>`+
      `<span class="hl-body"><span class="hl-short">${h.t.replace(/</g,'&lt;')}</span>${full}</span></li>`;
  }).join('');
  $('summaryText').textContent=c.summary;
  const reveal=Math.max(1, Math.ceil(n/c.nows.length*c.arts.length));
  $('artifacts').innerHTML=c.arts.map((a,i)=> (complete||i<reveal)?
    `<div class="artifact" data-i="${i}"><div class="artifact-kicker">${a.kicker}<span class="exp">⤢</span></div>`+
    `<div class="artifact-title">${a.title}</div><div class="artifact-meta">${a.meta}</div>`+artifactBody(a.body)+`</div>`:'').join('');
}
/*
 * What the Director's view says in words: one line above the composer, naming
 * what is waiting and taking you to it. There is no Now rail here — the
 * constellation already shows that everything is moving, and each thread's own
 * account belongs to its own view.
 */
function renderDirectorHint(){
  const waiting=DIRECTOR.waiting;
  const el=$('directorText');
  if(!waiting){ el.textContent=`watching ${CONVS.length} threads · nothing needs you`; return; }
  el.innerHTML=`watching ${CONVS.length} threads · `+
    `<button type="button" class="needs" data-goto="${waiting.at}">${waiting.label}</button>`;
}

/*
 * The Director's rails.
 *
 * Its Now rail is dispatch: what it started, what finished, what needs the
 * user. Its artifact rail is every thread's output, each card naming the
 * thread that produced it — on this view the reader is above the threads, so
 * the thread is the thing they need to be told.
 */
function renderDirector(){
  document.body.classList.add('director-view');
  $('lodbar').hidden=false;
  $('lodNote').textContent = (CONVS.length+1>5) ? LOD_NOTES.tiles : LOD_NOTES.columns;
  document.querySelectorAll('[data-lod]').forEach(x=>
    x.classList.toggle('on', parseInt(x.dataset.lod)===CONVS.length));
  $('convTitle').textContent=DIRECTOR.title; $('convTitle').classList.add('is-director');
  renderDirectorHint(); renderDots();
  $('chatInput').placeholder='Ask the Director…   (› to open a thread · scroll to look back)';
}

/*
 * Which conversation a turn belongs to, when the view is drawing more than one.
 */
function columnForTurn(turnIndex){
  if(!g.cols) return null;
  for(const C of g.cols) if(turnIndex>=C.turnFrom && turnIndex<C.turnTo) return C;
  return null; }

function openConversation(index){
  onDirector=false; convIdx=index; lastIdx=-2; selected=null;
  snapToConv(); renderConv(); }

function switchConv(dir){ if(switching) return;   // start a channel-change transition (swap happens mid-slide)
  switching={dir, t:0, swapped:false}; selected=null; document.body.classList.add('switching'); }

// The Director sits at position 0 and the threads follow it, so arrowing off
// the last thread wraps back to the Director rather than to the first thread.
function stepView(dir){
  const N=CONVS.length;
  if(onDirector){ onDirector=false; convIdx = dir>0 ? 0 : N-1; return; }
  const next=convIdx+dir;
  if(next<0||next>=N){ onDirector=true; return; }
  convIdx=next; }
/*
 * The switch is a demonstration, so it says what changed and why — the note is
 * the argument the control exists to make.
 */
const LOD_NOTES={ columns:'columns · latest turn per thread · click one to open it',
                  tiles:'tiles · latest turn per thread · click one to open it' };
document.querySelectorAll('[data-lod]').forEach(b=>b.onclick=()=>{
  setThreads(parseInt(b.dataset.lod));
  document.querySelectorAll('[data-lod]').forEach(x=>x.classList.toggle('on',x===b));
  $('lodNote').textContent = (CONVS.length+1>5) ? LOD_NOTES.tiles : LOD_NOTES.columns; });

$('directorHint').addEventListener('click',e=>{ const b=e.target.closest('[data-goto]'); if(!b) return;
  openConversation(+b.dataset.goto); });
$('convPrev').onclick=()=>switchConv(-1);
$('convNext').onclick=()=>switchConv(1);

// artifact expand -> open the fuller content in a new tab (concept: its own surface)
function expandBodyHTML(b){ if(!b) return '';
  if(b.type==='bars') return b.rows.map(r=>`<div style="display:grid;grid-template-columns:110px 1fr 46px;gap:10px;align-items:center;margin:7px 0;font:13px ui-monospace"><span style="color:oklch(0.717 0.044 264)">${r[0]}</span><span style="height:9px;background:oklch(0.22 0.02 264);border-radius:5px;overflow:hidden"><span style="display:block;height:100%;width:${Math.round(r[2]*100)}%;background:oklch(0.72 0.13 210)"></span></span><span style="text-align:right;color:oklch(0.908 0.013 263)">${r[1].toFixed(1)}</span></div>`).join('');
  if(b.type==='diff') return `<pre style="margin:0;font:13px/1.7 ui-monospace;white-space:pre-wrap">`+b.lines.map(l=>`<span style="color:${l[0]==='+'?'oklch(0.78 0.16 150)':'oklch(0.68 0.17 20)'}">${l[0]} ${l[1].replace(/</g,'&lt;')}</span>`).join('\n')+`</pre>`;
  if(b.type==='rows') return b.rows.map(r=>`<div style="display:flex;justify-content:space-between;border-bottom:1px solid oklch(0.24 0.01 264);padding:8px 0;font:13px ui-monospace"><span style="color:oklch(0.717 0.044 264)">${r[0]}</span><span style="color:oklch(0.908 0.013 263)">${r[1]}</span></div>`).join('');
  return ''; }
$('artifacts').addEventListener('click',e=>{ const card=e.target.closest('.artifact'); if(!card) return;
  const a=CONVS[convIdx].arts[+card.dataset.i];
  const html=`<!doctype html><meta charset=utf-8><title>${a.title}</title>`+
    `<body style="margin:0;background:oklch(0.128 0.007 261);color:oklch(0.908 0.013 263);font:15px/1.5 system-ui;display:grid;place-items:center;min-height:100vh">`+
    `<div style="max-width:640px;width:100%;padding:40px"><div style="font:11px system-ui;letter-spacing:.14em;text-transform:uppercase;color:oklch(0.522 0.065 264)">${a.kicker}</div>`+
    `<h1 style="font-size:26px;margin:6px 0 4px">${a.title}</h1><p style="color:oklch(0.717 0.044 264);margin:0 0 22px">${a.meta}</p>`+
    `<div style="background:oklch(0.16 0.008 261);border:1px solid oklch(0.24 0.01 264);border-radius:12px;padding:18px 20px">${expandBodyHTML(a.body)}</div>`+
    `<p style="color:oklch(0.522 0.065 264);font-size:12px;margin-top:22px">Expanded view — in the app this is the artifact's own tab / surface, with full history and controls.</p></div>`;
  window.open('data:text/html,'+encodeURIComponent(html),'_blank'); });

// chat input: the director takes the request -> append a new turn and jump the stream to it
const chatInput=$('chatInput');
chatInput.addEventListener('keydown',e=>{ if(e.key==='Enter'&&chatInput.value.trim()){
  const val=chatInput.value.trim();
  /*
   * What you are looking at is what you are talking to. On the Director's view
   * that is dispatch — it takes the request and decides which thread it
   * belongs to — so nothing is appended to a thread here.
   */
  if(onDirector){ DIRECTOR.history.push({u:val, r:DIRECTOR.response});
    DIRECTOR.nows.push({t:'Took “'+val.slice(0,44)+(val.length>44?'…':'')+'”',mode:1,
      full:'The Director decides whether this steers a running thread, queues behind it, or starts a new one.'});
    if(DIRECTOR.nows.length>4) DIRECTOR.nows.shift();
    chatInput.value=''; renderDirector(); return; }
  activeConv.thread.push({u:val, reason:'RUN', r:CONVS[convIdx].response||'Done.'});
  CONVS[convIdx].history.push({u:val, r:CONVS[convIdx].response});
  chatInput.value=''; rebuild();
  activeConv.spanU=g.lastBorn/INTERVAL;
  const lastT=g.turns[g.turns.length-1]; growT=g.nodes[lastT.userId].born-0.6; activeConv.gT=growT;
  layout(0); updateSceneBuffers();
  autoCam=g.nodes[lastT.userId].worldY; viewCam=autoCam; detached=false;
}});

// Now items: click to expand an item's fuller detail (the newest is expanded already)
$('highlights').addEventListener('click',e=>{ const li=e.target.closest('.hl'); if(li&&!li.classList.contains('nofull')) li.classList.toggle('expanded'); });

// "see thread history" -> a traditional chat transcript (your messages + each final response)
function renderHistory(){ const c=onDirector?DIRECTOR:CONVS[convIdx];
  $('historyLog').innerHTML=c.history.map(t=>`<div class="turn"><div class="u">${t.u}</div><div class="r">${t.r}</div></div>`).join('')||`<div class="turn"><div class="r">No prior turns on this thread yet.</div></div>`; }
function openHistory(){ renderHistory(); $('history').hidden=false; }
function closeHistory(){ $('history').hidden=true; }
$('threadHistoryBtn').addEventListener('click',openHistory);
$('historyClose').addEventListener('click',closeHistory);
$('history').addEventListener('click',e=>{ if(e.target===$('history')) closeHistory(); });
addEventListener('keydown',e=>{ if(e.key==='Escape'&&!$('history').hidden) closeHistory(); });

// longer-form summary toggle (setta-3 keeps these; hidden until asked for)
$('summaryToggle').addEventListener('click',()=>{ const st=$('summaryText'); st.hidden=!st.hidden; $('summaryToggle').classList.toggle('open',!st.hidden); });

// ← / → switch conversations (mod key required while typing)
addEventListener('keydown',e=>{ if(e.key==='ArrowLeft'||e.key==='ArrowRight'){
  const typing=document.activeElement===chatInput;
  if(!typing || e.metaKey || e.ctrlKey){ e.preventDefault(); switchConv(e.key==='ArrowRight'?1:-1); }
}});

// top-bar view toggles + dev panel
document.querySelectorAll('.tb-chip[data-view]').forEach(b=>b.onclick=()=>{
  b.classList.toggle('on'); document.body.classList.toggle('hide-'+b.dataset.view, !b.classList.contains('on')); });
$('devToggle').onclick=e=>{ const d=$('devbar'); d.hidden=!d.hidden; e.currentTarget.classList.toggle('on',!d.hidden); };
document.querySelectorAll('[data-tc]').forEach(b=>b.onclick=()=>{ setThreads(parseInt(b.dataset.tc));
  document.querySelectorAll('[data-tc]').forEach(x=>x.classList.toggle('on',x===b)); });   // how many threads you can arrow between

snapToConv();
renderConv();
</script>
