<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Setta · Workflow Graph — Aesthetic Explorations</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden;
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Inter, sans-serif; }
  body { background: #04050a; }
  #stage { position: fixed; inset: 0; display: block; touch-action: none; }

  /* ---------- top bar ---------- */
  .topbar {
    position: fixed; top: 14px; left: 50%; transform: translateX(-50%);
    display: flex; gap: 8px; align-items: center; padding: 7px 9px;
    background: rgba(10,12,20,0.62); border: 1px solid rgba(255,255,255,0.08);
    border-radius: 14px; backdrop-filter: blur(14px); z-index: 20;
    box-shadow: 0 10px 40px rgba(0,0,0,0.5);
  }
  .topbar .brand { font-size: 12px; font-weight: 700; letter-spacing: .12em;
    text-transform: uppercase; color: rgba(255,255,255,.55); padding: 0 10px 0 6px; }
  .pill {
    appearance: none; border: 1px solid rgba(255,255,255,0.10);
    background: rgba(255,255,255,0.03); color: rgba(255,255,255,.72);
    font-size: 13px; font-weight: 600; padding: 8px 14px; border-radius: 10px;
    cursor: pointer; transition: all .18s ease; white-space: nowrap;
  }
  .pill:hover { color: #fff; border-color: rgba(255,255,255,0.22); background: rgba(255,255,255,0.07); }
  .pill.active { color: #04050a; }
  .sep { width: 1px; height: 26px; background: rgba(255,255,255,0.10); margin: 0 4px; }
  .ctrl { font-size: 16px; padding: 8px 12px; }

  /* ---------- legend ---------- */
  .legend {
    position: fixed; left: 16px; bottom: 16px; z-index: 20;
    background: rgba(10,12,20,0.6); border: 1px solid rgba(255,255,255,0.08);
    border-radius: 12px; backdrop-filter: blur(12px); padding: 11px 13px;
    display: grid; grid-template-columns: auto auto; gap: 6px 16px;
  }
  .legend .row { display: flex; align-items: center; gap: 8px; font-size: 12px; color: rgba(255,255,255,.7); }
  .legend .dot { width: 11px; height: 11px; border-radius: 4px; box-shadow: 0 0 8px currentColor; }

  /* ---------- hint ---------- */
  .hint { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%);
    z-index: 19; font-size: 12px; color: rgba(255,255,255,.42); letter-spacing: .02em;
    background: rgba(10,12,20,0.5); padding: 6px 14px; border-radius: 999px;
    border: 1px solid rgba(255,255,255,0.06); }

  /* ---------- detail panel ---------- */
  .detail {
    position: fixed; top: 70px; right: 16px; width: 280px; z-index: 21;
    background: rgba(12,14,22,0.82); border: 1px solid rgba(255,255,255,0.10);
    border-radius: 16px; backdrop-filter: blur(18px); padding: 0; overflow: hidden;
    box-shadow: 0 24px 60px rgba(0,0,0,0.55);
    transform: translateX(20px); opacity: 0; pointer-events: none; transition: all .22s cubic-bezier(.2,.9,.3,1);
  }
  .detail.open { transform: none; opacity: 1; pointer-events: auto; }
  .detail .accent { height: 5px; }
  .detail .body { padding: 16px 18px 18px; }
  .detail .kind { font-size: 11px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase;
    color: rgba(255,255,255,.5); }
  .detail h2 { margin: 4px 0 12px; font-size: 19px; color: #fff; font-weight: 700; }
  .detail .statusrow { display: inline-flex; align-items: center; gap: 7px; font-size: 13px;
    font-weight: 600; padding: 5px 11px; border-radius: 999px; margin-bottom: 14px; }
  .detail .statusrow .s-dot { width: 8px; height: 8px; border-radius: 999px; box-shadow: 0 0 8px currentColor; }
  .detail p { margin: 0 0 12px; font-size: 13px; line-height: 1.55; color: rgba(255,255,255,.66); }
  .detail .meta { display: grid; grid-template-columns: auto 1fr; gap: 6px 12px; font-size: 12px;
    border-top: 1px solid rgba(255,255,255,0.08); padding-top: 12px; }
  .detail .meta .k { color: rgba(255,255,255,.42); }
  .detail .meta .v { color: rgba(255,255,255,.82); text-align: right; font-variant-numeric: tabular-nums; }
  .detail .close { position: absolute; top: 12px; right: 14px; cursor: pointer; color: rgba(255,255,255,.4);
    font-size: 18px; line-height: 1; }
  .detail .close:hover { color: #fff; }

  /* theme blurb under topbar */
  .blurb { position: fixed; top: 70px; left: 16px; z-index: 18; max-width: 300px;
    font-size: 12.5px; line-height: 1.5; color: rgba(255,255,255,.5);
    background: rgba(10,12,20,0.5); border: 1px solid rgba(255,255,255,0.07);
    border-radius: 12px; padding: 10px 13px; backdrop-filter: blur(10px); }
  .blurb b { color: rgba(255,255,255,.82); font-weight: 700; }
</style>
</head>
<body>
<canvas id="stage"></canvas>

<div class="topbar">
  <span class="brand">Setta · Flow</span>
  <button class="pill" data-theme="neon">Neon Circuit</button>
  <button class="pill" data-theme="cozy">Cozy Constellation</button>
  <button class="pill" data-theme="holo">Holo Command</button>
  <button class="pill" data-theme="factory">Factory Flow</button>
  <span class="sep"></span>
  <button class="pill ctrl" id="playBtn" title="Replay simulated run">▶</button>
  <button class="pill ctrl" id="fitBtn" title="Re-center">⤢</button>
</div>

<div class="blurb" id="blurb"></div>

<div class="legend" id="legend"></div>
<div class="hint">Drag to pan · Scroll to zoom · Click a node for details · 1–4 to switch theme</div>

<div class="detail" id="detail">
  <div class="accent" id="d-accent"></div>
  <span class="close" id="d-close">✕</span>
  <div class="body">
    <div class="kind" id="d-kind"></div>
    <h2 id="d-name"></h2>
    <div class="statusrow" id="d-status"><span class="s-dot"></span><span id="d-status-text"></span></div>
    <p id="d-desc"></p>
    <div class="meta" id="d-meta"></div>
  </div>
</div>

<script>
/* =====================================================================
   Setta workflow-graph aesthetic explorations
   One sample workflow, four visual languages, a looping simulated run.
   Pure canvas 2D so the *animation feel* comes through.
   ===================================================================== */

const canvas = document.getElementById('stage');
const ctx = canvas.getContext('2d');
let DPR = Math.min(window.devicePixelRatio || 1, 2);
let W = 0, H = 0;

/* ---------- shared status palette (mirrors the real app) ---------- */
const STATUS = {
  not_started: { c: '#64748b', label: 'Not started' },
  pending:     { c: '#a78bfa', label: 'Pending' },
  ready:       { c: '#38bdf8', label: 'Ready' },
  running:     { c: '#14b8a6', label: 'Running' },
  succeeded:   { c: '#22c55e', label: 'Succeeded' },
  failed:      { c: '#ef4444', label: 'Failed' },
  waiting:     { c: '#f59e0b', label: 'Waiting approval' },
};

const KIND_LABEL = {
  start: 'Start', end: 'End', action: 'Agent Task',
  'gateway.xor': 'Route · XOR', 'gateway.or': 'Merge · OR',
};

/* ---------- sample workflow (a small but expressive DAG) ---------- */
const COL = 250, ROW = 158, NW = 168, NH = 70;
const nodeDefs = [
  { id:'start',     label:'Start',          kind:'start',        col:0, row:0 },
  { id:'fetch',     label:'Fetch Data',     kind:'action',       col:1, row:0 },
  { id:'route',     label:'Valid?',         kind:'gateway.xor',  col:2, row:0 },
  { id:'process',   label:'Process',        kind:'action',       col:3, row:-1 },
  { id:'retry',     label:'Retry',          kind:'action',       col:3, row:1 },
  { id:'join',      label:'Merge',          kind:'gateway.or',   col:4, row:0 },
  { id:'summarize', label:'Summarize',      kind:'action',       col:5, row:0 },
  { id:'done',      label:'Done',           kind:'end',          col:6, row:0 },
];
const edgeDefs = [
  { from:'start',     to:'fetch' },
  { from:'fetch',     to:'route' },
  { from:'route',     to:'process',   tag:'yes' },
  { from:'route',     to:'retry',     tag:'no' },
  { from:'process',   to:'join' },
  { from:'retry',     to:'join' },
  { from:'join',      to:'summarize' },
  { from:'summarize', to:'done' },
];
const descs = {
  start:'Entry point of the workflow. Fires once when the run begins.',
  fetch:'Agent pulls the source dataset and normalizes it for downstream steps.',
  route:'XOR gateway. Inspects the payload and routes to exactly one branch.',
  process:'Agent transforms the validated data into the target shape.',
  retry:'Recovery branch. Re-attempts the fetch when validation fails.',
  join:'OR merge. Continues as soon as either incoming branch completes.',
  summarize:'Agent writes a concise summary of the processed results.',
  done:'Terminal node. Marks the run as complete.',
};

/* layout → world coordinates (top-left of each node box) */
const nodes = nodeDefs.map(n => ({
  ...n, x: n.col * COL, y: n.row * ROW, w: NW, h: NH,
  status: 'not_started', anim: Math.random() * Math.PI * 2,
}));
const byId = Object.fromEntries(nodes.map(n => [n.id, n]));
const edges = edgeDefs.map((e, i) => ({ ...e, i, a: byId[e.from], b: byId[e.to] }));

/* world bounding box */
function worldBBox() {
  let minX=1e9,minY=1e9,maxX=-1e9,maxY=-1e9;
  for (const n of nodes){ minX=Math.min(minX,n.x); minY=Math.min(minY,n.y);
    maxX=Math.max(maxX,n.x+n.w); maxY=Math.max(maxY,n.y+n.h); }
  return { minX,minY,maxX,maxY, w:maxX-minX, h:maxY-minY, cx:(minX+maxX)/2, cy:(minY+maxY)/2 };
}

/* ---------- camera ---------- */
const cam = { x:0, y:0, scale:1 };
function fit() {
  const b = worldBBox(); const pad = 160;
  const s = Math.min((W-pad)/b.w, (H-pad)/b.h, 1.15);
  cam.scale = s;
  cam.x = W/2 - b.cx * s;
  cam.y = H/2 - b.cy * s;
}
function toWorld(sx, sy){ return { x:(sx-cam.x)/cam.scale, y:(sy-cam.y)/cam.scale }; }

/* ---------- edge geometry (cubic bezier, source-right → target-left) ---------- */
function edgeAnchors(e){
  const a=e.a, b=e.b;
  return { sx:a.x+a.w, sy:a.y+a.h/2, ex:b.x, ey:b.y+b.h/2 };
}
function edgePath(e){
  const {sx,sy,ex,ey} = edgeAnchors(e);
  const off = Math.max(70, Math.abs(ex-sx)*0.45);
  return { sx,sy,ex,ey, c1x:sx+off, c1y:sy, c2x:ex-off, c2y:ey };
}
function bezAt(p, t){
  const mt=1-t, a=mt*mt*mt, b=3*mt*mt*t, c=3*mt*t*t, d=t*t*t;
  return {
    x:a*p.sx+b*p.c1x+c*p.c2x+d*p.ex,
    y:a*p.sy+b*p.c1y+c*p.c2y+d*p.ey,
  };
}
function bezTangent(p, t){
  const mt=1-t;
  const x=3*mt*mt*(p.c1x-p.sx)+6*mt*t*(p.c2x-p.c1x)+3*t*t*(p.ex-p.c2x);
  const y=3*mt*mt*(p.c1y-p.sy)+6*mt*t*(p.c2y-p.c1y)+3*t*t*(p.ey-p.c2y);
  const m=Math.hypot(x,y)||1; return { x:x/m, y:y/m };
}

/* ---------- simulation: a looping run that lights up the frontier ---------- */
const PERIOD = 11000; // ms per full run loop
const schedule = {
  start:{at:0.00}, fetch:{at:0.08}, route:{at:0.22},
  process:{at:0.36}, retry:{at:0.36, fail:true},
  join:{at:0.56}, summarize:{at:0.70}, done:{at:0.86},
};
const RUN_WIN = 0.085; // fraction of loop a node spends "running"
let runStart = 0;

function updateSimulation(now){
  const t = ((now - runStart) % PERIOD) / PERIOD;
  for (const n of nodes){
    const s = schedule[n.id];
    if (t < s.at) n.status = 'not_started';
    else if (t < s.at + RUN_WIN) n.status = s.fail ? 'running' : 'running';
    else n.status = s.fail ? 'failed' : 'succeeded';
  }
  // a touch of variety: summarize waits for approval briefly
  const ts = schedule.summarize.at;
  if (t > ts - 0.06 && t < ts) byId.summarize.status = 'waiting';
}
function edgeActivity(e){
  // bright flow when the target is currently running and source is done
  const tgt = e.b.status, src = e.a.status;
  if (tgt === 'running' && (src === 'succeeded' || src === 'failed')) return 1;
  if (src === 'succeeded' && (tgt === 'succeeded' || tgt === 'failed')) return 0.5;
  return 0.12; // ambient
}

/* ===================================================================
   THEME HELPERS
   =================================================================== */
function rr(ctx, x, y, w, h, r){
  r = Math.min(r, w/2, h/2);
  ctx.beginPath();
  ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath();
}
function lerpHex(h1,h2,t){
  const a=hx(h1), b=hx(h2);
  return rgb(Math.round(a[0]+(b[0]-a[0])*t),Math.round(a[1]+(b[1]-a[1])*t),Math.round(a[2]+(b[2]-a[2])*t));
}
function hx(h){ h=h.replace('#',''); return [parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)]; }
function rgb(r,g,b){ return `rgb(${r},${g},${b})`; }
function withAlpha(hex,a){ const c=hx(hex); return `rgba(${c[0]},${c[1]},${c[2]},${a})`; }

/* glyphs per kind (simple vector marks) */
function drawGlyph(ctx, kind, cx, cy, size, color){
  ctx.save();
  ctx.strokeStyle = color; ctx.fillStyle = color;
  ctx.lineWidth = 2; ctx.lineJoin='round'; ctx.lineCap='round';
  const s = size;
  if (kind==='start'){
    ctx.beginPath(); ctx.moveTo(cx-s*0.32,cy-s*0.5); ctx.lineTo(cx+s*0.5,cy); ctx.lineTo(cx-s*0.32,cy+s*0.5); ctx.closePath(); ctx.fill();
  } else if (kind==='end'){
    const n=4, cell=s/n*1.0, ox=cx-s*0.5, oy=cy-s*0.5;
    for(let i=0;i<n;i++)for(let j=0;j<n;j++){ if((i+j)%2===0){ ctx.fillRect(ox+i*cell, oy+j*cell, cell, cell);} }
  } else if (kind==='action'){
    // gear
    const teeth=8, ro=s*0.52, ri=s*0.34;
    ctx.beginPath();
    for(let i=0;i<teeth*2;i++){ const r=i%2?ri:ro; const a=(i/(teeth*2))*Math.PI*2; const x=cx+Math.cos(a)*r,y=cy+Math.sin(a)*r; i?ctx.lineTo(x,y):ctx.moveTo(x,y);}
    ctx.closePath(); ctx.stroke();
    ctx.beginPath(); ctx.arc(cx,cy,s*0.15,0,Math.PI*2); ctx.stroke();
  } else if (kind==='gateway.xor'){
    ctx.beginPath(); ctx.moveTo(cx,cy-s*0.55); ctx.lineTo(cx+s*0.55,cy); ctx.lineTo(cx,cy+s*0.55); ctx.lineTo(cx-s*0.55,cy); ctx.closePath(); ctx.stroke();
    ctx.font = `700 ${Math.round(s*0.7)}px ui-sans-serif`; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText('?', cx, cy+1);
  } else if (kind==='gateway.or'){
    ctx.beginPath(); ctx.moveTo(cx-s*0.5,cy-s*0.45); ctx.lineTo(cx+s*0.1,cy); ctx.lineTo(cx-s*0.5,cy+s*0.45); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(cx+s*0.55,cy); ctx.lineTo(cx-s*0.05,cy); ctx.stroke();
  }
  ctx.restore();
}

/* small status badge glyph (top-right of node) */
function statusGlyph(ctx, status, cx, cy, r, phase){
  ctx.save();
  ctx.translate(cx,cy);
  const col = STATUS[status].c;
  ctx.fillStyle = col; ctx.strokeStyle = col; ctx.lineWidth=2; ctx.lineCap='round';
  ctx.beginPath(); ctx.arc(0,0,r,0,Math.PI*2);
  ctx.fillStyle = withAlpha(col, status==='not_started'?0.25:0.9); ctx.fill();
  ctx.fillStyle = '#04050a';
  if (status==='running'){
    ctx.strokeStyle='rgba(255,255,255,.95)';
    ctx.beginPath(); ctx.arc(0,0,r*0.5, phase, phase+Math.PI*1.3); ctx.stroke();
  } else if (status==='succeeded'){
    ctx.strokeStyle='#04140a'; ctx.beginPath();
    ctx.moveTo(-r*0.42,0); ctx.lineTo(-r*0.1,r*0.34); ctx.lineTo(r*0.46,-r*0.38); ctx.stroke();
  } else if (status==='failed'){
    ctx.strokeStyle='#160404'; ctx.beginPath();
    ctx.moveTo(-r*0.34,-r*0.34); ctx.lineTo(r*0.34,r*0.34);
    ctx.moveTo(r*0.34,-r*0.34); ctx.lineTo(-r*0.34,r*0.34); ctx.stroke();
  } else if (status==='waiting'){
    ctx.strokeStyle='#1a1404'; ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(0,-r*0.42);
    ctx.moveTo(0,0); ctx.lineTo(r*0.34,r*0.12); ctx.stroke();
  }
  ctx.restore();
}

/* ===================================================================
   THEME: NEON CIRCUIT — synthwave / Tron. Glowing wires, energy pulses.
   =================================================================== */
const ThemeNeon = {
  name:'neon',
  bg(ctx, now){
    ctx.fillStyle = '#05060d'; ctx.fillRect(0,0,W,H);
    const g = ctx.createRadialGradient(W/2,H*0.42,80, W/2,H*0.42, Math.max(W,H)*0.75);
    g.addColorStop(0,'rgba(20,40,70,0.45)'); g.addColorStop(1,'rgba(4,5,12,0)');
    ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
    // grid
    ctx.save(); applyCam();
    const b=worldBBox(); const step=64;
    ctx.lineWidth=1/cam.scale; ctx.strokeStyle='rgba(56,189,248,0.07)';
    ctx.beginPath();
    for(let x=b.minX-200;x<b.maxX+200;x+=step){ ctx.moveTo(x,b.minY-200); ctx.lineTo(x,b.maxY+200); }
    for(let y=b.minY-200;y<b.maxY+200;y+=step){ ctx.moveTo(b.minX-200,y); ctx.lineTo(b.maxX+200,y); }
    ctx.stroke(); ctx.restore();
  },
  edge(ctx, e, now){
    const p = edgePath(e); const act = edgeActivity(e); const col = e.b.status==='failed'? '#ef4444':'#38bdf8';
    ctx.save();
    // base wire
    ctx.beginPath(); ctx.moveTo(p.sx,p.sy); ctx.bezierCurveTo(p.c1x,p.c1y,p.c2x,p.c2y,p.ex,p.ey);
    ctx.lineWidth = 2; ctx.strokeStyle = withAlpha(col, 0.18+act*0.25);
    ctx.shadowColor = col; ctx.shadowBlur = 6+act*14; ctx.stroke();
    // energy pulses
    const n = act>0.6?5:act>0.3?3:2; const speed = act>0.6?0.00055:0.0002;
    for(let k=0;k<n;k++){
      const t = ((now*speed + k/n + e.i*0.13) % 1);
      const pt = bezAt(p,t);
      const r = (act>0.6?3.2:2.2);
      ctx.beginPath(); ctx.arc(pt.x,pt.y,r,0,Math.PI*2);
      ctx.fillStyle = '#eaf6ff'; ctx.shadowColor=col; ctx.shadowBlur=14; ctx.fill();
    }
    ctx.restore();
  },
  node(ctx, n, now, hovered, selected){
    const st = STATUS[n.status]; const col = st.c;
    const pulse = n.status==='running' ? 0.5+0.5*Math.sin(now/140) : 1;
    ctx.save();
    // outer glow ring
    if (n.status==='running' || hovered || selected){
      ctx.beginPath(); rr(ctx,n.x-6,n.y-6,n.w+12,n.h+12,16);
      ctx.strokeStyle = withAlpha(col, 0.25+0.35*pulse); ctx.lineWidth=2; ctx.shadowColor=col; ctx.shadowBlur=24; ctx.stroke();
    }
    // body
    ctx.beginPath(); rr(ctx,n.x,n.y,n.w,n.h,14);
    const bg = ctx.createLinearGradient(n.x,n.y,n.x,n.y+n.h);
    bg.addColorStop(0,'rgba(13,18,30,0.96)'); bg.addColorStop(1,'rgba(8,11,20,0.96)');
    ctx.fillStyle=bg; ctx.fill();
    ctx.lineWidth = selected?2.5:1.5; ctx.strokeStyle = withAlpha(col, n.status==='not_started'?0.4:0.9);
    ctx.shadowColor=col; ctx.shadowBlur = n.status==='not_started'?4:(10+10*pulse); ctx.stroke();
    ctx.shadowBlur=0;
    // glyph chip
    drawGlyph(ctx, n.kind, n.x+26, n.y+n.h/2, 18, withAlpha(col,0.95));
    // label
    ctx.fillStyle = n.status==='not_started'?'rgba(226,232,240,.55)':'#eef6ff';
    ctx.font='600 15px ui-sans-serif'; ctx.textAlign='left'; ctx.textBaseline='middle';
    ctx.fillText(n.label, n.x+46, n.y+n.h/2);
    // status badge
    statusGlyph(ctx, n.status, n.x+n.w-16, n.y+16, 9, now/200);
    ctx.restore();
  },
};

/* ===================================================================
   THEME: COZY CONSTELLATION — soft, friendly, gently bobbing cards.
   =================================================================== */
const ThemeCozy = {
  name:'cozy',
  bg(ctx, now){
    const g = ctx.createLinearGradient(0,0,0,H);
    g.addColorStop(0,'#161033'); g.addColorStop(0.55,'#1a1340'); g.addColorStop(1,'#0f0a26');
    ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
    // drifting soft blobs
    const blobs=[['#7c3aed',0.2,0.35],['#ec4899',0.78,0.6],['#22d3ee',0.5,0.85]];
    for(let i=0;i<blobs.length;i++){
      const [c,bx,by]=blobs[i];
      const x=W*bx+Math.sin(now/4000+i)*40, y=H*by+Math.cos(now/5200+i)*30;
      const rg=ctx.createRadialGradient(x,y,0,x,y,Math.max(W,H)*0.32);
      rg.addColorStop(0,withAlpha(c,0.18)); rg.addColorStop(1,withAlpha(c,0));
      ctx.fillStyle=rg; ctx.fillRect(0,0,W,H);
    }
    // twinkling stars (screen-space, deterministic)
    for(let i=0;i<70;i++){
      const x=(i*137.5)%W, y=(i*89.7+ (i*i)%50)%H;
      const tw=0.3+0.7*Math.abs(Math.sin(now/700+i));
      ctx.fillStyle=`rgba(255,255,255,${0.05+tw*0.18})`;
      ctx.fillRect(x,y,1.6,1.6);
    }
  },
  edge(ctx, e, now){
    const p=edgePath(e); const act=edgeActivity(e); const col=e.b.status==='failed'?'#fb7185':'#a78bfa';
    ctx.save(); ctx.lineCap='round';
    // soft ribbon
    ctx.beginPath(); ctx.moveTo(p.sx,p.sy); ctx.bezierCurveTo(p.c1x,p.c1y,p.c2x,p.c2y,p.ex,p.ey);
    ctx.lineWidth=7; ctx.strokeStyle=withAlpha(col,0.12); ctx.stroke();
    ctx.lineWidth=3; ctx.strokeStyle=withAlpha(col,0.22+act*0.3); ctx.stroke();
    // soft glowing beads
    const n=act>0.6?4:2; const speed=act>0.6?0.00035:0.00014;
    for(let k=0;k<n;k++){
      const t=((now*speed+k/n+e.i*0.2)%1); const pt=bezAt(p,t);
      const rg=ctx.createRadialGradient(pt.x,pt.y,0,pt.x,pt.y,9);
      rg.addColorStop(0,withAlpha('#ffffff',0.9)); rg.addColorStop(0.4,withAlpha(col,0.7)); rg.addColorStop(1,withAlpha(col,0));
      ctx.fillStyle=rg; ctx.beginPath(); ctx.arc(pt.x,pt.y,9,0,Math.PI*2); ctx.fill();
    }
    ctx.restore();
  },
  node(ctx, n, now, hovered, selected){
    const st=STATUS[n.status]; const col=st.c;
    const bob = Math.sin(now/900 + n.anim)*3.2;
    const pop = n.status==='succeeded' ? 1+0.0*Math.sin(now/200):1;
    ctx.save(); ctx.translate(0,bob);
    // drop shadow
    ctx.beginPath(); rr(ctx,n.x+3,n.y+8,n.w,n.h,20); ctx.fillStyle='rgba(0,0,0,0.28)'; ctx.filter='blur(6px)'; ctx.fill(); ctx.filter='none';
    // card body (soft gradient tinted by status)
    ctx.beginPath(); rr(ctx,n.x,n.y,n.w,n.h,20);
    const g=ctx.createLinearGradient(n.x,n.y,n.x,n.y+n.h);
    g.addColorStop(0, lerpHex('#3a2f63', col, 0.18));
    g.addColorStop(1, lerpHex('#241c45', col, 0.10));
    ctx.fillStyle=g; ctx.fill();
    ctx.lineWidth = selected?3:2; ctx.strokeStyle = withAlpha('#ffffff', hovered||selected?0.5:0.16); ctx.stroke();
    // rounded icon chip
    const chipX=n.x+20, chipY=n.y+n.h/2;
    ctx.beginPath(); ctx.arc(chipX, chipY, 17, 0, Math.PI*2);
    ctx.fillStyle=withAlpha(col,0.9); ctx.shadowColor=withAlpha(col,0.8); ctx.shadowBlur=12; ctx.fill(); ctx.shadowBlur=0;
    drawGlyph(ctx, n.kind, chipX, chipY, 15, '#0c0a1e');
    // label
    ctx.fillStyle='#f4f1ff'; ctx.font='700 15px ui-sans-serif'; ctx.textAlign='left'; ctx.textBaseline='middle';
    ctx.fillText(n.label, n.x+44, n.y+n.h/2-7);
    // status pill text
    ctx.fillStyle=withAlpha(col,1); ctx.font='600 11px ui-sans-serif';
    ctx.fillText(st.label.toLowerCase(), n.x+44, n.y+n.h/2+11);
    // status badge (bouncy)
    const bs = n.status==='running'? 9+Math.sin(now/160)*1.5 : 9;
    statusGlyph(ctx, n.status, n.x+n.w-16, n.y+15, bs, now/220);
    ctx.restore();
  },
};

/* ===================================================================
   THEME: HOLO COMMAND — sci-fi HUD. Glass panels, brackets, packets.
   =================================================================== */
const ThemeHolo = {
  name:'holo',
  bg(ctx, now){
    ctx.fillStyle='#03070a'; ctx.fillRect(0,0,W,H);
    // faint hex-ish triangle grid in world space
    ctx.save(); applyCam(); const b=worldBBox(); const step=46;
    ctx.strokeStyle='rgba(45,212,191,0.06)'; ctx.lineWidth=1/cam.scale;
    ctx.beginPath();
    for(let y=b.minY-200;y<b.maxY+200;y+=step){ ctx.moveTo(b.minX-200,y); ctx.lineTo(b.maxX+200,y); }
    for(let x=b.minX-200;x<b.maxX+200;x+=step){ ctx.moveTo(x,b.minY-200); ctx.lineTo(x,b.maxY+200); }
    ctx.stroke(); ctx.restore();
    // scanlines (screen space)
    ctx.fillStyle='rgba(0,0,0,0.16)';
    for(let y=0;y<H;y+=3){ ctx.fillRect(0,y,W,1); }
    const sweep=(now/9)%(H+200)-100;
    const sg=ctx.createLinearGradient(0,sweep-60,0,sweep+60);
    sg.addColorStop(0,'rgba(45,212,191,0)'); sg.addColorStop(0.5,'rgba(45,212,191,0.05)'); sg.addColorStop(1,'rgba(45,212,191,0)');
    ctx.fillStyle=sg; ctx.fillRect(0,sweep-60,W,120);
  },
  edge(ctx, e, now){
    const p=edgePath(e); const act=edgeActivity(e); const col=e.b.status==='failed'?'#f87171':'#5eead4';
    ctx.save();
    // conduit
    ctx.beginPath(); ctx.moveTo(p.sx,p.sy); ctx.bezierCurveTo(p.c1x,p.c1y,p.c2x,p.c2y,p.ex,p.ey);
    ctx.lineWidth=1.5; ctx.strokeStyle=withAlpha(col,0.22+act*0.2); ctx.setLineDash([2,5]); ctx.stroke(); ctx.setLineDash([]);
    // data packets (rectangles riding the tangent)
    const n=act>0.6?4:act>0.3?2:1; const speed=act>0.6?0.0004:0.00016;
    for(let k=0;k<n;k++){
      const t=((now*speed+k/n+e.i*0.17)%1); const pt=bezAt(p,t); const tg=bezTangent(p,t);
      ctx.save(); ctx.translate(pt.x,pt.y); ctx.rotate(Math.atan2(tg.y,tg.x));
      ctx.fillStyle=withAlpha(col,0.95); ctx.shadowColor=col; ctx.shadowBlur=10;
      ctx.fillRect(-5,-1.6,10,3.2); ctx.restore();
    }
    ctx.restore();
  },
  node(ctx, n, now, hovered, selected){
    const st=STATUS[n.status]; const col=st.c;
    ctx.save();
    // glass panel
    ctx.beginPath(); rr(ctx,n.x,n.y,n.w,n.h,4);
    ctx.fillStyle=withAlpha('#0a1a1d',0.66); ctx.fill();
    ctx.lineWidth=1; ctx.strokeStyle=withAlpha(col, n.status==='not_started'?0.35:0.7); ctx.stroke();
    // top status bar
    ctx.fillStyle=withAlpha(col,0.85); ctx.fillRect(n.x, n.y, n.w, 3);
    // corner brackets (targeting reticle) — emphasised on hover/select/running
    const em = (hovered||selected||n.status==='running');
    const bl = em?16:10; const bo = em?-5:0;
    ctx.strokeStyle=withAlpha(col, em?1:0.6); ctx.lineWidth=2;
    const corners=[[n.x+bo,n.y+bo,1,1],[n.x+n.w-bo,n.y+bo,-1,1],[n.x+bo,n.y+n.h-bo,1,-1],[n.x+n.w-bo,n.y+n.h-bo,-1,-1]];
    for(const [cx,cy,dx,dy] of corners){ ctx.beginPath(); ctx.moveTo(cx+dx*bl,cy); ctx.lineTo(cx,cy); ctx.lineTo(cx,cy+dy*bl); ctx.stroke(); }
    // glyph
    drawGlyph(ctx, n.kind, n.x+24, n.y+n.h/2+3, 16, withAlpha(col,0.95));
    // label (mono, uppercase)
    ctx.fillStyle = n.status==='not_started'?'rgba(190,255,245,.5)':'#d6fff6';
    ctx.font='600 13px ui-monospace, SFMono-Regular, Menlo, monospace'; ctx.textAlign='left'; ctx.textBaseline='middle';
    ctx.fillText(n.label.toUpperCase(), n.x+44, n.y+n.h/2+3);
    // status readout
    ctx.fillStyle=withAlpha(col,0.95); ctx.font='600 9px ui-monospace, monospace';
    ctx.fillText('▸ '+st.label.toUpperCase(), n.x+12, n.y+14);
    // running scan inside panel
    if(n.status==='running'){
      const sx=n.x + ((now/12)%(n.w));
      ctx.strokeStyle=withAlpha('#bdfff2',0.5); ctx.lineWidth=1.2;
      ctx.beginPath(); ctx.moveTo(sx,n.y+4); ctx.lineTo(sx,n.y+n.h-4); ctx.stroke();
    }
    ctx.restore();
  },
};

/* ===================================================================
   THEME: FACTORY FLOW — top-down builder. Conveyor belts carry items.
   =================================================================== */
const ThemeFactory = {
  name:'factory',
  bg(ctx, now){
    const g=ctx.createLinearGradient(0,0,0,H); g.addColorStop(0,'#0e1116'); g.addColorStop(1,'#070a0e');
    ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
    ctx.save(); applyCam(); const b=worldBBox(); const step=48;
    ctx.strokeStyle='rgba(148,163,184,0.06)'; ctx.lineWidth=1/cam.scale;
    ctx.beginPath();
    for(let x=b.minX-200;x<b.maxX+200;x+=step){ ctx.moveTo(x,b.minY-200); ctx.lineTo(x,b.maxY+200); }
    for(let y=b.minY-200;y<b.maxY+200;y+=step){ ctx.moveTo(b.minX-200,y); ctx.lineTo(b.maxX+200,y); }
    ctx.stroke(); ctx.restore();
  },
  edge(ctx, e, now){
    const p=edgePath(e); const act=edgeActivity(e);
    ctx.save();
    // belt body (dark casing)
    ctx.beginPath(); ctx.moveTo(p.sx,p.sy); ctx.bezierCurveTo(p.c1x,p.c1y,p.c2x,p.c2y,p.ex,p.ey);
    ctx.lineWidth=12; ctx.lineCap='round'; ctx.strokeStyle='rgba(30,37,48,0.95)'; ctx.stroke();
    ctx.lineWidth=10; ctx.strokeStyle='#171c24'; ctx.stroke();
    // moving belt treads (dashes scrolling)
    const moving = act>0.25;
    ctx.lineWidth=10; ctx.strokeStyle = moving? 'rgba(148,163,184,0.35)':'rgba(90,100,115,0.18)';
    ctx.setLineDash([3,9]); ctx.lineDashOffset = -(now*(moving?0.05:0.0)); ctx.stroke(); ctx.setLineDash([]);
    // edge rails
    ctx.lineWidth=12; ctx.strokeStyle='rgba(0,0,0,0)';
    // items riding the belt
    const carry = e.b.status==='failed'? '#ef4444' : (act>0.6? '#fbbf24':'#22c55e');
    const n = act>0.6?4:act>0.3?2:0; const speed=0.00028;
    for(let k=0;k<n;k++){
      const t=((now*speed+k/n+e.i*0.15)%1); const pt=bezAt(p,t); const tg=bezTangent(p,t);
      ctx.save(); ctx.translate(pt.x,pt.y); ctx.rotate(Math.atan2(tg.y,tg.x));
      ctx.fillStyle=carry; ctx.shadowColor=carry; ctx.shadowBlur=8;
      rr(ctx,-5,-5,10,10,2.5); ctx.fill();
      ctx.shadowBlur=0; ctx.fillStyle='rgba(255,255,255,0.25)'; rr(ctx,-5,-5,10,4,2.5); ctx.fill();
      ctx.restore();
    }
    ctx.restore();
  },
  node(ctx, n, now, hovered, selected){
    const st=STATUS[n.status]; const col=st.c;
    ctx.save();
    // machine base shadow
    ctx.beginPath(); rr(ctx,n.x+2,n.y+5,n.w,n.h,8); ctx.fillStyle='rgba(0,0,0,0.4)'; ctx.fill();
    // beveled metal body
    ctx.beginPath(); rr(ctx,n.x,n.y,n.w,n.h,8);
    const g=ctx.createLinearGradient(n.x,n.y,n.x,n.y+n.h);
    g.addColorStop(0,'#2b333f'); g.addColorStop(0.5,'#222a34'); g.addColorStop(1,'#1a212a');
    ctx.fillStyle=g; ctx.fill();
    ctx.lineWidth=selected?3:2; ctx.strokeStyle = selected? withAlpha(col,1) : 'rgba(0,0,0,0.6)'; ctx.stroke();
    // top inset highlight
    ctx.beginPath(); rr(ctx,n.x+3,n.y+3,n.w-6,2,2); ctx.fillStyle='rgba(255,255,255,0.08)'; ctx.fill();
    // status LED strip on left
    ctx.fillStyle=col; ctx.shadowColor=col; ctx.shadowBlur=(n.status==='running')?(8+6*Math.abs(Math.sin(now/200))):6;
    rr(ctx,n.x+6,n.y+8,5,n.h-16,3); ctx.fill(); ctx.shadowBlur=0;
    // machine "panel" with rotating gear for action while running
    const gx=n.x+34, gy=n.y+n.h/2;
    ctx.save(); ctx.translate(gx,gy);
    if(n.status==='running' && n.kind==='action'){ ctx.rotate((now/600)%(Math.PI*2)); }
    drawGlyph(ctx, n.kind, 0,0, 16, withAlpha(col,0.95)); ctx.restore();
    // label
    ctx.fillStyle = n.status==='not_started'?'rgba(226,232,240,.55)':'#eef2f7';
    ctx.font='700 14px ui-sans-serif'; ctx.textAlign='left'; ctx.textBaseline='middle';
    ctx.fillText(n.label, n.x+56, n.y+n.h/2-7);
    // bolt rivets
    ctx.fillStyle='rgba(0,0,0,0.45)';
    for(const [bx,by] of [[n.x+8,n.y+8],[n.x+n.w-8,n.y+8],[n.x+8,n.y+n.h-8],[n.x+n.w-8,n.y+n.h-8]]){ ctx.beginPath(); ctx.arc(bx,by,2,0,Math.PI*2); ctx.fill(); }
    // status text
    ctx.fillStyle=withAlpha(col,1); ctx.font='600 11px ui-monospace, monospace';
    ctx.fillText(st.label.toUpperCase(), n.x+56, n.y+n.h/2+10);
    // gauge badge
    statusGlyph(ctx, n.status, n.x+n.w-16, n.y+16, 9, now/200);
    ctx.restore();
  },
};

const THEMES = { neon:ThemeNeon, cozy:ThemeCozy, holo:ThemeHolo, factory:ThemeFactory };
const BLURBS = {
  neon:'<b>Neon Circuit.</b> Tron-style glowing wires. Bright energy pulses race along the active path so you can literally watch execution travel the graph. Heavy bloom, dark void, sharp edges.',
  cozy:'<b>Cozy Constellation.</b> Friendly puzzle-game vibe. Soft rounded cards bob gently, pastel beads drift down the ribbons. Calm and inviting — status shown by colour + a chunky icon chip.',
  holo:'<b>Holo Command.</b> Starship-terminal HUD. Glass panels, corner reticle brackets, scanlines, and segmented data packets. Reads as a control console you operate.',
  factory:'<b>Factory Flow.</b> Factorio-style builder. Edges are conveyor belts that physically carry item blocks between machines; gears spin while a node works. The most literal “see what’s happening”.',
};
let current = 'neon';

/* ===================================================================
   RENDER LOOP
   =================================================================== */
function applyCam(){ ctx.setTransform(DPR,0,0,DPR,0,0); ctx.translate(cam.x,cam.y); ctx.scale(cam.scale,cam.scale); }
function resetCam(){ ctx.setTransform(DPR,0,0,DPR,0,0); }

let hoverId=null, selId=null;

function frame(now){
  updateSimulation(now);
  const T = THEMES[current];
  resetCam();
  // background (some themes draw in world space internally)
  T.bg(ctx, now);
  // world-space content
  applyCam();
  for(const e of edges) T.edge(ctx, e, now);
  for(const n of nodes){
    T.node(ctx, n, now, hoverId===n.id, selId===n.id);
  }
  resetCam();
  requestAnimationFrame(frame);
}

/* ===================================================================
   INTERACTION
   =================================================================== */
function nodeAt(sx, sy){
  const w = toWorld(sx,sy);
  for(let i=nodes.length-1;i>=0;i--){ const n=nodes[i];
    if(w.x>=n.x && w.x<=n.x+n.w && w.y>=n.y-6 && w.y<=n.y+n.h+6) return n; }
  return null;
}
let dragging=false, dragMoved=false, lastX=0, lastY=0;
canvas.addEventListener('pointerdown', ev=>{ dragging=true; dragMoved=false; lastX=ev.clientX; lastY=ev.clientY; canvas.setPointerCapture(ev.pointerId); });
canvas.addEventListener('pointermove', ev=>{
  if(dragging){ const dx=ev.clientX-lastX, dy=ev.clientY-lastY; if(Math.abs(dx)+Math.abs(dy)>3) dragMoved=true;
    cam.x+=dx; cam.y+=dy; lastX=ev.clientX; lastY=ev.clientY; }
  else { const n=nodeAt(ev.clientX,ev.clientY); hoverId=n?n.id:null; canvas.style.cursor=n?'pointer':'grab'; }
});
canvas.addEventListener('pointerup', ev=>{
  dragging=false;
  if(!dragMoved){ const n=nodeAt(ev.clientX,ev.clientY); if(n){ selId=n.id; openDetail(n); } else { selId=null; closeDetail(); } }
});
canvas.addEventListener('wheel', ev=>{
  ev.preventDefault();
  const factor = Math.exp(-ev.deltaY*0.0015);
  const before = toWorld(ev.clientX,ev.clientY);
  cam.scale = Math.max(0.4, Math.min(2.6, cam.scale*factor));
  const after = toWorld(ev.clientX,ev.clientY);
  cam.x += (after.x-before.x)*cam.scale; cam.y += (after.y-before.y)*cam.scale;
}, {passive:false});

/* detail panel */
const detail=document.getElementById('detail');
function openDetail(n){
  const st=STATUS[n.status];
  document.getElementById('d-accent').style.background=st.c;
  document.getElementById('d-kind').textContent=KIND_LABEL[n.kind]||n.kind;
  document.getElementById('d-name').textContent=n.label;
  const sr=document.getElementById('d-status'); sr.style.background=withAlpha(st.c,0.16); sr.style.color=st.c;
  document.getElementById('d-status-text').textContent=st.label;
  document.getElementById('d-desc').textContent=descs[n.id]||'';
  document.getElementById('d-meta').innerHTML =
    `<span class="k">Node ID</span><span class="v">${n.id}</span>`+
    `<span class="k">Kind</span><span class="v">${KIND_LABEL[n.kind]||n.kind}</span>`+
    `<span class="k">Inputs</span><span class="v">${edges.filter(e=>e.to===n.id).length}</span>`+
    `<span class="k">Outputs</span><span class="v">${edges.filter(e=>e.from===n.id).length}</span>`;
  detail.classList.add('open');
}
function closeDetail(){ detail.classList.remove('open'); selId=null; }
document.getElementById('d-close').addEventListener('click', closeDetail);

/* theme + control buttons */
function setTheme(name){
  current=name;
  document.querySelectorAll('.pill[data-theme]').forEach(b=>{
    const on=b.dataset.theme===name; b.classList.toggle('active',on);
    b.style.background = on ? accentFor(name) : '';
    b.style.borderColor = on ? accentFor(name) : '';
  });
  document.getElementById('blurb').innerHTML=BLURBS[name];
  document.body.style.background = name==='cozy'?'#0f0a26':(name==='factory'?'#070a0e':'#04050a');
}
function accentFor(name){ return ({neon:'#38bdf8', cozy:'#c084fc', holo:'#5eead4', factory:'#fbbf24'})[name]; }
document.querySelectorAll('.pill[data-theme]').forEach(b=> b.addEventListener('click',()=>setTheme(b.dataset.theme)) );
document.getElementById('playBtn').addEventListener('click', ()=>{ runStart=performance.now(); });
document.getElementById('fitBtn').addEventListener('click', fit);
window.addEventListener('keydown', e=>{
  const map={'1':'neon','2':'cozy','3':'holo','4':'factory'};
  if(map[e.key]) setTheme(map[e.key]);
  if(e.key===' '){ runStart=performance.now(); e.preventDefault(); }
});

/* legend */
const legend=document.getElementById('legend');
legend.innerHTML = Object.entries(STATUS).filter(([k])=>k!=='ready'&&k!=='pending').map(([k,v])=>
  `<div class="row"><span class="dot" style="background:${v.c};color:${v.c}"></span>${v.label}</div>`).join('');

/* ---------- resize ---------- */
function resize(){
  W=window.innerWidth; H=window.innerHeight;
  DPR=Math.min(window.devicePixelRatio||1,2);
  canvas.width=W*DPR; canvas.height=H*DPR; canvas.style.width=W+'px'; canvas.style.height=H+'px';
  fit();
}
window.addEventListener('resize', resize);

/* ---------- boot ---------- */
window.addEventListener('hashchange', ()=>{ const h=location.hash.replace('#',''); if(THEMES[h]) setTheme(h); });
resize();
const initial = location.hash.replace('#','');
setTheme(THEMES[initial] ? initial : 'neon');
runStart=performance.now();
requestAnimationFrame(frame);
</script>
</body>
