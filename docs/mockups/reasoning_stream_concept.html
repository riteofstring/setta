<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>Setta — living reasoning stream</title>
<style>
  html, body { margin: 0; height: 100%; background: #05060a; overflow: hidden;
    font: 13px ui-monospace, Menlo, monospace; color: #cdd3e0; }
  #c { display: block; width: 100vw; height: 100vh; }
  #ui { position: fixed; top: 14px; left: 14px; z-index: 10; display: flex; gap: 14px;
    align-items: center; flex-wrap: wrap; background: rgba(8,10,16,0.55);
    border: 1px solid rgba(120,140,180,0.18); padding: 10px 12px; border-radius: 10px;
    backdrop-filter: blur(8px); }
  .grp { display: flex; gap: 6px; align-items: center; }
  .grp > span { opacity: 0.5; margin-right: 4px; letter-spacing: 0.04em; text-transform: uppercase; font-size: 11px; }
  button { font: inherit; color: #cdd3e0; background: rgba(40,48,66,0.6);
    border: 1px solid rgba(120,140,180,0.22); padding: 5px 10px; border-radius: 7px; cursor: pointer; }
  button:hover { background: rgba(60,72,98,0.7); }
  button.on { background: rgba(90,150,210,0.35); border-color: rgba(120,190,240,0.6); color: #eaf2ff; }
  label { display: flex; gap: 6px; align-items: center; cursor: pointer; user-select: none; }
  #tip { position: fixed; z-index: 12; pointer-events: none; transform: translate(-50%, -100%);
    background: rgba(10,14,22,0.94); border: 1px solid rgba(120,190,240,0.5);
    color: #eaf2ff; padding: 6px 10px; border-radius: 7px; white-space: nowrap; display: none; }
  #tip .k { font-size: 10px; letter-spacing: 0.06em; text-transform: uppercase; opacity: 0.6; }
  #tip .alt { opacity: 0.55; color: #b9a7ff; }
  #tip .chip { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 7px; vertical-align: 0; box-shadow: 0 0 6px currentColor; }
  .reticle { position: fixed; z-index: 11; pointer-events: none; display: none; transform: translate(-50%,-50%); }
  .reticle .c { position: absolute; width: 11px; height: 11px; filter: drop-shadow(0 0 3px currentColor); }
  .reticle .c.tl { left:0; top:0; border-left:2px solid; border-top:2px solid; }
  .reticle .c.tr { right:0; top:0; border-right:2px solid; border-top:2px solid; }
  .reticle .c.bl { left:0; bottom:0; border-left:2px solid; border-bottom:2px solid; }
  .reticle .c.br { right:0; bottom:0; border-right:2px solid; border-bottom:2px solid; }
  #reticleSel { color: rgba(255,158,216,0.95); }
  #err { position: fixed; bottom: 0; left: 0; color: #f77; white-space: pre-wrap; padding: 8px; z-index: 20; }
  #legend { position: fixed; bottom: 12px; left: 14px; z-index: 10; display: flex; gap: 12px;
    opacity: 0.75; font-size: 11px; }
  #legend i { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 5px; vertical-align: -1px; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="reticleActive" class="reticle"><span class="c tl"></span><span class="c tr"></span><span class="c bl"></span><span class="c br"></span></div>
<div id="reticleSel" class="reticle"><span class="c tl"></span><span class="c tr"></span><span class="c bl"></span><span class="c br"></span></div>
<div id="tip"></div>
<div id="ui">
  <div class="grp"><span>pattern</span>
    <button data-pat="0" class="on">halftone</button><button data-pat="1">bayer</button><button data-pat="2">hatch</button>
  </div>
  <div class="grp"><span>size</span>
    <button data-px="4" class="on">S</button><button data-px="6">M</button><button data-px="9">L</button>
  </div>
  <div class="grp"><span>particles</span>
    <button data-pm="0" class="on">emit</button><button data-pm="1">orbit</button>
  </div>
  <div class="grp"><label><input type="checkbox" id="scan" /> scanline</label></div>
  <div class="grp"><label><input type="checkbox" id="listen" /> listen</label></div>
  <div class="grp"><span>speed</span><input id="speed" type="range" min="0.2" max="3" step="0.05" value="0.2" style="width:88px"></div>
  <div class="grp"><button id="restart">restart</button></div>
  <div class="grp" id="fps" style="opacity:0.6">–</div>
</div>
<div id="legend">
  <span><i style="background:#4dcbf0"></i>thinking</span>
  <span><i style="background:#9e73ff"></i>doing</span>
  <span><i style="background:#ffcb42"></i>struggling</span>
  <span><i style="background:#5cf5a0"></i>success</span>
  <span><i style="background:#ff495e"></i>failed</span>
</div>
<pre id="err"></pre>
<script>
"use strict";
const canvas=document.getElementById('c');
const gl=canvas.getContext('webgl2',{alpha:false,antialias:false});
const errEl=document.getElementById('err'), tip=document.getElementById('tip');
function fail(m){errEl.textContent=m;throw new Error(m);}
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}

// modes: 0 think, 1 do, 2 struggle, 3 success, 4 fail, 5 merge
const M={think:0,do:1,struggle:2,success:3,fail:4,merge:5,listening:6};
const MODE_NAME=['thinking','doing','struggling','success','failed','synthesis','listening'];
const MODE_COLORS=['#4dcbf0','#9e73ff','#ffcb42','#5cf5a0','#ff495e','#c7edff','#b8e6ff'];
const CYAN=[0.30,0.80,0.95], VIOLET=[0.62,0.45,1.0];   // particle-field tints

const RUN=[
  {k:'step',m:'think',t:'read request'},
  {k:'step',m:'do',t:'open workspace layout engine'},
  {k:'dead',m:'do',t:'grep unrelated speech module',why:'wrong subsystem'},
  {k:'step',m:'think',t:'locate drag-reorder path'},
  {k:'fan',lanes:[
     {m:'do',t:'inspect swap logic',steps:[{m:'do',t:'check slot widths'},{m:'struggle',t:'trace adjacency'}]},
     {m:'do',t:'profile frame timing',steps:[{m:'think',t:'record baseline'}]},
     {m:'do',t:'read overview ghost',steps:[{m:'do',t:'measure pan cost'}],dead:true},
   ],merge:'synthesize findings'},
  {k:'step',m:'think',t:'draft adjacent-swap fix'},
  {k:'dead',m:'do',t:'add width-adopt compat shim',why:'violates no-compat rule'},
  {k:'step',m:'do',t:'apply fix'},
  {k:'step',m:'struggle',t:'re-measure frame timing'},
  {k:'step',m:'success',t:'commit change'},
];

const STEP=0.20, POP=0.38, FAIL_DELAY=1.1;
let INTERVAL=5.5, DEAD_INTERVAL=4.0;   // node dwell (driven by the speed slider, default slowest); animation durations stay fixed
function laneOffsets(K){if(K<=1)return[0];const s=0.30,st=-(K-1)/2*s,o=[];for(let i=0;i<K;i++)o.push(st+i*s);return o;}

function build(seed){
  const rng=mulberry32(seed);
  const nodes=[],edges=[],embers=[]; let row=0,clock=0,side=1;
  const add=(x,label,mode,born,extra)=>{const id=nodes.length; const fails=extra&&extra.fails;
    nodes.push({id,x,worldY:row*STEP,born,settleAt:born+(fails?FAIL_DELAY:INTERVAL*1.4),
      mode:M[mode]!==undefined?M[mode]:mode, failAt:fails?FAIL_DELAY:999,
      label,why:extra&&extra.why,alts:extra&&extra.alts});
    return id;};
  const link=(a,b,childBorn,mode,dead)=>{ const md=M[mode]!==undefined?M[mode]:mode;
    let conf=0.9; if(md===M.struggle) conf=0.45;   // base straightness by mode; failure wobble is added in-shader
    edges.push({a,b,childBorn,mode:md,dead:!!dead,conf,phase:0}); };
  let tip=add(0,'listening','listening',0); clock=INTERVAL;   // starts by listening to the user
  for(const ev of RUN){
    if(ev.k==='step'){ row++; const b=clock; clock+=INTERVAL;
      const id=add(0,ev.t,ev.m,b,{alts:ev.alts}); link(tip,id,b,ev.m); tip=id; }
    else if(ev.k==='dead'){ row++; const b=clock; clock+=DEAD_INTERVAL;
      const d=add(0.30*side,ev.t,ev.m||'do',b,{why:ev.why,fails:true}); link(tip,d,b,ev.m||'do',true); side*=-1; }
    else if(ev.k==='fan'){
      const K=ev.lanes.length, xs=laneOffsets(K);
      const chains=ev.lanes.map((l,i)=>({x:xs[i],seq:[{m:l.m,t:l.t}].concat(l.steps||[]),dead:!!l.dead}));
      const maxLen=Math.max(...chains.map(c=>c.seq.length));
      const prev=chains.map(()=>tip), aliveTip=chains.map(()=>null), startClock=clock;
      for(let s=0;s<maxLen;s++){ row++;
        const b=startClock+s*INTERVAL;
        for(let i=0;i<chains.length;i++){ const c=chains[i]; if(s>=c.seq.length) continue;
          const spec=c.seq[s], last=s===c.seq.length-1, isDead=c.dead&&last;
          const id=add(c.x,spec.t,spec.m, b+i*0.12, isDead?{fails:true}:undefined);
          link(prev[i],id,b+i*0.12,spec.m,isDead); prev[i]=id; aliveTip[i]=(c.dead&&last)?null:id; } }
      clock=startClock+maxLen*INTERVAL; row++;
      const mb=clock; clock+=INTERVAL; const mm=add(0,ev.merge||'synthesize','merge',mb);
      for(let i=0;i<chains.length;i++) if(!chains[i].dead && aliveTip[i]!=null) link(aliveTip[i],mm,mb,'merge');
      tip=mm;
    }
  }
  // after finishing, return to a fresh listening node (ready for the next turn)
  row++; { const lb=clock; clock+=INTERVAL; const ln=add(0,'listening','listening',lb); link(tip,ln,lb,'listening'); tip=ln; }
  // settleAt = when the child forms (node stops "working" once it produced the next thought)
  const childBorn={};
  for(const e of edges){ const cb=nodes[e.b].born; if(childBorn[e.a]===undefined||cb<childBorn[e.a]) childBorn[e.a]=cb; }
  for(const n of nodes){ if(childBorn[n.id]!==undefined) n.settleAt=childBorn[n.id];
    if(n.failAt<900) n.settleAt=n.born+n.failAt;
    if(n.mode===M.listening && childBorn[n.id]===undefined) n.settleAt=n.born+99999; }   // final listening node stays listening
  return {nodes,edges,embers,lastBorn:clock};
}

// ---- GL ----
function sh(t,s){const o=gl.createShader(t);gl.shaderSource(o,s);gl.compileShader(o);
  if(!gl.getShaderParameter(o,gl.COMPILE_STATUS))fail(gl.getShaderInfoLog(o));return o;}
function prog(v,f){const p=gl.createProgram();gl.attachShader(p,sh(gl.VERTEX_SHADER,v));gl.attachShader(p,sh(gl.FRAGMENT_SHADER,f));
  gl.linkProgram(p);if(!gl.getProgramParameter(p,gl.LINK_STATUS))fail(gl.getProgramInfoLog(p));return p;}

const COMMON=`
vec3 modeColor(float m){
  if(m<0.5) return vec3(0.30,0.80,0.95);   // think cyan
  if(m<1.5) return vec3(0.62,0.45,1.0);    // do violet
  if(m<2.5) return vec3(1.0,0.79,0.26);    // struggle amber
  if(m<3.5) return vec3(0.36,0.96,0.63);   // success green
  if(m<4.5) return vec3(1.0,0.29,0.37);    // fail red
  if(m<5.5) return vec3(0.78,0.95,1.0);    // merge bright
  return vec3(0.72,0.90,1.0);              // listening pale cyan
}`;

const PT_VS=`#version 300 es
layout(location=0) in float a_worldY;
layout(location=1) in float a_x;
layout(location=2) in float a_born;
layout(location=3) in float a_settle;
layout(location=4) in float a_mode;
layout(location=5) in float a_dx;     // emission direction
layout(location=6) in float a_dy;
layout(location=7) in float a_phase;  // per-particle phase 0..1
layout(location=8) in float a_speed;  // per-particle speed
layout(location=9) in float a_role;   // 0 core orbiter, 1 emitted spark
layout(location=10) in float a_failAt; // node age at which it fails (999 = never)
uniform float u_cam,u_time,u_dpr,u_hoverX,u_hoverWY,u_hoverOn,u_listen,u_pmode;
out float v_mode,v_recent,v_alpha,v_active,v_hover,v_fail,v_isCore;
void main(){
  float age=u_time-a_born;
  float vis=step(a_born - step(0.5,a_role)*step(a_role,1.5)*0.55, u_time);   // sparks appear early to spiral in
  float recent=exp(-max(0.0,u_cam-a_worldY)*0.85);
  // smooth "working" envelope: eases up at birth, eases down as it settles (no snapping)
  float working=smoothstep(a_born,a_born+0.45,u_time)*(1.0-smoothstep(a_settle-0.35,a_settle+0.7,u_time));
  // explosion pop: spikes past full size on arrival, then settles
  float rise=smoothstep(0.0,0.10,age);
  float settle=exp(-max(age-0.10,0.0)*6.0);
  float pop=rise*(1.0+0.55*settle);
  vec2 center=vec2(a_x, -0.6 + (u_cam - a_worldY));
  float hover = exp(-distance(vec2(a_x,a_worldY),vec2(u_hoverX,u_hoverWY))*20.0) * u_hoverOn;  // u_hoverOn is eased 0..1
  float failing=step(a_failAt,998.0);
  float failAge=age-a_failAt;
  float failP=failing>0.5 ? smoothstep(0.0,0.35,failAge) : 0.0;   // was fine, now turning to failure
  vec2 pos; float psize; float palpha;
  if(failing>0.5 && failAge>0.0){
    // executing node collapses: particles burst outward and fizzle (bigger, further, longer)
    pos=center+vec2(a_dx,a_dy)*(0.02+failAge*0.16);
    float life=clamp(1.0-failAge/1.7,0.0,1.0);
    psize=(6.5+recent*10.0)*life; palpha=life*1.15;
  } else if(a_role<0.5){
    // node body — a clean ring. Listening node is large + calm (pulses only while receiving input).
    float listen=step(5.5,a_mode);
    float lp=1.0 + listen*u_listen*0.32*abs(sin(u_time*6.0));   // pulse only when simulating listening
    pos=center;
    psize=(40.0 + recent*20.0 + working*58.0 + hover*38.0 + listen*46.0)*pop*lp;   // listening node much larger
    palpha=1.0;    // solid node body (black glyph is cut into it)
  } else if(a_role<1.5){
    float listen=step(5.5,a_mode);
    float act=working*(1.0-listen*0.85);
    vec2 dir=vec2(a_dx,a_dy); vec2 perp=vec2(-dir.y,dir.x);
    float toBirth=a_born-u_time;                    // >0 while the pulse is still travelling the wire
    if(toBirth>0.0){
      // singularity: spiral inward to the point as the pulse approaches; collapse at arrival
      float suck=clamp(toBirth/0.55, 0.0, 1.0);
      float spin=a_phase*6.2832 + toBirth*9.0;
      pos=center + vec2(cos(spin),sin(spin))*(suck*0.10);
      palpha=(1.0-suck)*0.9 + 0.08;                 // brighter as they near the singularity
      psize=(2.5+recent*3.0)*(0.45 + (1.0-suck)*0.8);
    } else {
      // pulse has arrived -> explode with a flash, then settle into emission cloud OR orbit shell
      float et=-toBirth;
      float snOut=16.0*et*exp(-et*13.0); float flash=snOut;
      float pt=fract(u_time*a_speed*(0.18+act*0.18) + a_phase);
      vec2 restPos; float restSize; float restAlpha;
      if(u_pmode < 0.5){
        // EMISSION cloud
        float cloudFade=smoothstep(0.25, 0.70, et);
        vec2 cloudOff=dir*(0.35+pt*0.65) + perp*0.30*sin(u_time*0.7 + a_phase*20.0);
        float cloudR=0.020 + act*0.070 + recent*0.020 + hover*0.02;
        restPos=center + cloudOff*cloudR*pop*cloudFade;
        restAlpha=(1.0-pt)*(0.15 + act*0.9*cloudFade + recent*0.25 + hover*0.4);
        restSize=(3.2+recent*5.0+act*4.0)*pop;
      } else {
        // ORBIT shell (tilted elliptical orbits around the node)
        float planeAng=atan(a_dy,a_dx); float squash=0.30+0.5*fract(a_phase*7.0);
        float ang=u_time*a_speed*1.6 + a_phase*6.2832;
        vec2 ell=vec2(cos(ang), sin(ang)*squash); float ca=cos(planeAng),sa=sin(planeAng);
        vec2 rot=vec2(ell.x*ca-ell.y*sa, ell.x*sa+ell.y*ca);
        float on=clamp(working+hover,0.0,1.0);
        restPos=center + rot*((0.045+recent*0.014+working*0.032)*pop);
        restAlpha=on*(0.6+recent*0.3); restSize=(3.5+recent*4.0)*pop*(0.4+on);
      }
      pos=restPos + dir*(snOut*1.3*0.16);          // birth explosion pushes out over either mode
      palpha=max(flash*1.3, 0.0) + restAlpha;
      psize=restSize + flash*8.0*pop;
    }
  } else {
    // orbital electron — tilted elliptical orbit; only when active/hovered (atom cloud)
    float on=clamp(working+hover,0.0,1.0);
    float ang=u_time*a_speed*1.5 + a_phase*6.2832;
    vec2 ell=vec2(cos(ang), sin(ang)*a_dy);
    float ca=cos(a_dx), sa=sin(a_dx);
    vec2 rot=vec2(ell.x*ca-ell.y*sa, ell.x*sa+ell.y*ca);
    float orbR=(0.045+recent*0.014+working*0.032)*pop;    // orbit further out (around the node)
    pos=center+rot*orbR;
    psize=(3.5+recent*4.0)*pop*on; palpha=on*(0.6+recent*0.3);
  }
  float succ=step(2.5,a_mode)*step(a_mode,3.5);
  psize*=(1.0+succ*0.5);                         // success flourish
  v_mode=a_mode; v_recent=recent; v_active=working; v_hover=hover; v_fail=failP; v_alpha=palpha*vis; v_isCore=step(a_role,0.5);
  gl_Position=vec4(pos,0.0,1.0);
  gl_PointSize=psize*u_dpr*vis;
}`;
const PT_FS=`#version 300 es
precision highp float;
${COMMON}
in float v_mode,v_recent,v_alpha,v_active,v_hover,v_fail,v_isCore;
out vec4 o;
void main(){
  vec3 col=mix(modeColor(v_mode), vec3(1.0,0.29,0.37), v_fail);   // transitions to failure red
  float r=length(gl_PointCoord-0.5)*2.0;
  float glow=smoothstep(1.0,0.0,r);
  float disc=smoothstep(0.55,0.42,r);
  float core=smoothstep(0.0,0.34,r);             // 0 at centre -> 1 toward the rim
  float bodyCore=disc*mix(0.07,1.0,core);        // solid disc that fades to near-black in the middle
  float body=mix(disc, bodyCore, v_isCore);
  float a=v_alpha*(glow*(0.24+v_recent*0.18)*(1.0-v_isCore*0.9)+body*(1.05+v_recent*0.55));
  col*=(0.8+v_active*0.35+v_hover*0.6);
  o=vec4(col*a,a);
}`;

const EDGE_VS=`#version 300 es
layout(location=0) in float aWY;
layout(location=1) in float aX;
layout(location=2) in float bWY;
layout(location=3) in float bX;
layout(location=4) in float childBorn;
layout(location=5) in float mode;
layout(location=6) in float side;
layout(location=7) in float t;      // 0..1 along the path
layout(location=8) in float conf;   // confidence -> straightness
layout(location=9) in float phase;
layout(location=10) in float childFail;   // time the child fails (9999 = never)
uniform float u_cam,u_time,u_aspect,u_width;
out float v_mode,v_recent,v_alpha,v_along,v_failP;
void main(){
  float grow=clamp((u_time-(childBorn-0.6))/0.6,0.0,1.0);   // line grows out; tip arrives at childBorn
  float tt=min(t,grow);
  vec2 A=vec2(aX,-0.6+(u_cam-aWY));
  vec2 B=vec2(bX,-0.6+(u_cam-bWY));
  vec2 dS=normalize((B-A)*vec2(u_aspect,1.0)+vec2(1e-6));
  vec2 perpS=vec2(-dS.y,dS.x);
  vec2 perpC=vec2(perpS.x/u_aspect, perpS.y);
  float failP=smoothstep(childFail, childFail+0.35, u_time);   // 0 normal -> 1 once the child fails
  float unc=clamp((1.0-conf) + failP*0.85, 0.0, 1.0);          // straight normally, degrades to wavy on failure
  float wob=(sin(tt*9.0+phase*6.2832+u_time*unc*3.2)*0.05 + sin(tt*19.0+phase*3.0)*0.02)*unc;
  wob*=sin(tt*3.14159);                                     // meet the endpoints cleanly
  vec2 p=mix(A,B,tt)+perpC*wob;
  vec2 e=p+perpC*side*(u_width*(0.85+conf*1.15));   // confident main threads thicker
  v_mode=mode; v_recent=exp(-max(0.0,u_cam-bWY)*0.9); v_alpha=grow; v_along=t; v_failP=failP;
  gl_Position=vec4(e,0.0,1.0);
}`;
const EDGE_FS=`#version 300 es
precision highp float;
${COMMON}
in float v_mode,v_recent,v_alpha,v_along,v_failP;
uniform float u_time;
out vec4 o;
void main(){
  vec3 col=mix(modeColor(v_mode), vec3(1.0,0.29,0.37), v_failP);    // starts normal, degrades to red on failure
  float grow=v_alpha;                                               // 0..1 how far the line has grown
  float drawn=step(v_along,grow+0.001);                             // only the grown portion
  float dash=0.5+0.5*step(0.5,fract(v_along*13.0 - u_time*1.4));    // signal dashes
  float lead=smoothstep(grow-0.16, grow, v_along)*drawn;           // bright pulse riding the growing tip
  col=mix(col, vec3(0.92,0.98,1.0), lead*0.7);
  float a=drawn*(0.34+v_recent*0.28)*dash*(1.0+v_failP*0.8) + lead*(0.75+v_recent*0.5);
  o=vec4(col*a,a);
}`;

const POST_VS=`#version 300 es
out vec2 v_uv;
void main(){vec2 c=vec2(float((gl_VertexID<<1)&2),float(gl_VertexID&2));v_uv=c;gl_Position=vec4(c*2.0-1.0,0.0,1.0);}`;
const POST_FS=`#version 300 es
precision highp float;
in vec2 v_uv; uniform sampler2D u_tex; uniform vec3 u_bg; uniform float u_pixel,u_scan,u_pattern,u_time,u_cam;
out vec4 o;
float bayer8(ivec2 p){const float m[64]=float[64](
  0.,32.,8.,40.,2.,34.,10.,42.,48.,16.,56.,24.,50.,18.,58.,26.,12.,44.,4.,36.,14.,46.,6.,38.,60.,28.,52.,20.,62.,30.,54.,22.,
  3.,35.,11.,43.,1.,33.,9.,41.,51.,19.,59.,27.,49.,17.,57.,25.,15.,47.,7.,39.,13.,45.,5.,37.,63.,31.,55.,23.,61.,29.,53.,21.);
  return m[(p.y&7)*8+(p.x&7)]/64.0-0.5;}

  const target = best? best.n : selected;
  if(target){ const s0=best?best.s:screenOf(target); const s=warpToScreen(s0.x,s0.y);
    tip.style.display='block'; tip.style.left=s.x+'px'; tip.style.top=(s.y - nodeCssDiam(target)*0.5 - 12)+'px';   // just above the node's top edge
    const chip=`<span class="chip" style="color:${MODE_COLORS[target.mode]};background:${MODE_COLORS[target.mode]}"></span>`;
    const extra=target.why?` <span class="alt">✕ ${target.why}</span>`:(target.alts&&target.alts.length?` <span class="alt">▸ ${target.alts.join(' · ')}</span>`:'');
    tip.innerHTML=`${chip}<span class="k">${MODE_NAME[target.mode]}</span> &nbsp;<b>${target.label}</b>${extra}`;
  } else tip.style.display='none';
}

rebuild();resize();
const fpsEl=document.getElementById('fps');let last=performance.now(),acc=0,frames=0;
function frame(ms){const dt=Math.min(0.05,(ms-last)/1000);last=ms;growT+=dt;acc+=dt;frames++;
  if(acc>=0.5){fpsEl.textContent=Math.round(frames/acc)+' fps';acc=0;frames=0;}
  if(growT>g.lastBorn+FAIL_DELAY+10.0){growT=0;camWorld=0;}   // linger on the listening node, then loop
  let maxY=0;for(const n of g.nodes)if(n.born<=growT&&n.worldY>maxY)maxY=n.worldY;
  camWorld+=(maxY-camWorld)*Math.min(1,dt*1.7);        // slower follow

  resize();const dpr=Math.min(window.devicePixelRatio||1,1.5);
  gl.bindFramebuffer(gl.FRAMEBUFFER,fbo);gl.viewport(0,0,fw,fh);
  gl.clearColor(0,0,0,1);gl.clear(gl.COLOR_BUFFER_BIT);gl.enable(gl.BLEND);gl.blendFunc(gl.ONE,gl.ONE);
  gl.useProgram(bgP);gl.uniform1f(BU.time,growT);gl.uniform1f(BU.cam,camWorld);gl.uniform1f(BU.dpr,dpr);
  gl.uniform3fv(BU.cyan,CYAN);gl.uniform3fv(BU.violet,VIOLET);
  gl.bindVertexArray(bgVao);gl.drawArrays(gl.POINTS,0,NBG);
  gl.useProgram(edgeP);gl.uniform1f(EU.cam,camWorld);gl.uniform1f(EU.time,growT);
  gl.uniform1f(EU.aspect,canvas.width/canvas.height);gl.uniform1f(EU.width,0.0035);
  gl.bindVertexArray(edVao);gl.drawArrays(gl.TRIANGLES,0,g.edges.length*EDGE_SEG*6);
  gl.useProgram(ptP);gl.uniform1f(PU.cam,camWorld);gl.uniform1f(PU.time,growT);gl.uniform1f(PU.dpr,dpr);
  hoverAmt+=((hovered?1:0)-hoverAmt)*Math.min(1,dt*7);   // ease the hover flare in/out
  if(hovered){hoverX=hovered.x;hoverWY=hovered.worldY;}
  gl.uniform1f(PU.hoverX,hoverX);gl.uniform1f(PU.hoverWY,hoverWY);gl.uniform1f(PU.hoverOn,hoverAmt);gl.uniform1f(PU.listen,listenSim?1:0);gl.uniform1f(PU.pmode,particleMode);
  gl.bindVertexArray(ptVao);gl.drawArrays(gl.POINTS,0,g.ptCount);

  gl.bindFramebuffer(gl.FRAMEBUFFER,null);gl.viewport(0,0,canvas.width,canvas.height);gl.disable(gl.BLEND);
  gl.useProgram(postP);gl.activeTexture(gl.TEXTURE0);gl.bindTexture(gl.TEXTURE_2D,fboTex);
  gl.uniform1i(OU.tex,0);gl.uniform3f(OU.bg,0,0,0);gl.uniform1f(OU.pixel,ditherPx);gl.uniform1f(OU.scan,scan?1:0);gl.uniform1f(OU.pattern,pattern);gl.uniform1f(OU.time,growT);
  gl.bindVertexArray(null);gl.drawArrays(gl.TRIANGLES,0,3);
  // crisp icons on top (legible), barrel-aligned to the warped nodes
  gl.enable(gl.BLEND);gl.blendFunc(gl.SRC_ALPHA,gl.ONE_MINUS_SRC_ALPHA);
  gl.useProgram(iconP);
  gl.uniform1f(IU.cam,camWorld);gl.uniform1f(IU.time,growT);gl.uniform1f(IU.aspect,canvas.width/canvas.height);gl.uniform1f(IU.nicon,NICON);gl.uniform1f(IU.pixel,ditherPx);
  gl.activeTexture(gl.TEXTURE1);gl.bindTexture(gl.TEXTURE_2D,atlasTex);gl.uniform1i(IU.atlas,1);
  gl.bindVertexArray(icVao);gl.drawArrays(gl.TRIANGLES,0,g.icCount);
  gl.disable(gl.BLEND);
  updateHover();
  reticleActive.style.display='none';        // selected-only for now
  placeReticle(reticleSel, selected);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
