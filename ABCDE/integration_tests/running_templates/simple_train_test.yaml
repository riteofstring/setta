abcde.registration.global_ref_dict.add_to_ref_dict:
  transform:
    torchvision.transforms.Compose:
      transforms:
        - torchvision.transforms.ToTensor:
        - torchvision.transforms.Normalize:
            mean: [0.1307]
            std: [0.3081]
  dataset_root: "."

abcde.templates.simple_train_test.main:
  model:
    abcde.templates.simple_train_test.Net:
  
  optimizer:
    torch.optim.Adadelta: ~DO_NOT_INIT~
  
  train_set:
    torchvision.datasets.MNIST:
      root: ~REF~dataset_root
      train: True
      download: True
      transform: ~REF~transform

  val_set:
    torchvision.datasets.MNIST:
      root: ~REF~dataset_root
      train: False
      download: True
      transform: ~REF~transform

  batch_size: 64
  test_batch_size: 1000
  epochs: 1
  lr: 1.0