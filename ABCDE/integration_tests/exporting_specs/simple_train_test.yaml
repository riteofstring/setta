IMPORTS:
  torch.optim:
  torchvision:
  abcde.templates:
    - simple_train_test

UI_TYPES:
  LIST: 
    - torch.Tensor

SECTIONS:
  Model:
    - IMPORTS:
        torchvision:
          - models
    - ModuleInfo:
        name: models
        include:
          - resnet18
          - resnet50
    - ModuleInfo:
        name: simple_train_test
        include:
          - Net

  Optimizer:
    - ModuleInfo:
        name: torch.optim
        include:
          - SGD
          - Adam
    
  Transform:
    - ModuleInfo:
        name: torchvision.transforms
        include:
          - Compose
          - ColorJitter
        set_type:
          Compose:
            transforms:
              list:
                - ModuleInfo:
                    name: torchvision.transforms
                    include:
                      - ToTensor
                      - RandomHorizontalFlip
                      - RandomVerticalFlip
                      - Normalize
          ColorJitter:
            brightness: list
            contrast: int
            saturation: int



