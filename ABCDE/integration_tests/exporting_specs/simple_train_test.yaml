IMPORTS:
  torch.optim:
  torchvision:
  abcde.templates:
    - simple_train_test

UI_TYPES:
  LIST: 
    - torch.Tensor


transforms: &transforms
  name: torchvision.transforms 

transforms_module_without_compose: &transforms_module_without_compose
  - ModuleInfo:
      <<: *transforms
      include:
        - ColorJitter

transforms_module: &transforms_module
  - ModuleInfo:
      <<: *transforms
      include:
        - Compose
      set_type:
        Compose:
          transforms:
            list:
              - <<: *transforms_module_without_compose   

SECTIONS:
  Model:
    - IMPORTS:
        torchvision:
          - models
    - ModuleInfo:
        name: models
        include:
          - resnet18
          - resnet50
    - ClassInfo:
        name: simple_train_test.Net

  Other Stuff:
    - ParameterInfo:
        dataset_root:
          default: .
        batch_size:
          type: int
        name:
        weights: 
          type: torch.Tensor
  Dataset:
    - ModuleInfo:
        name: torchvision.datasets
        include:
          - ~REGEX~CIFAR*
        set_type:
          ~ALL~:
            root: str



