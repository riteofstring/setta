SELECTED:
  Model:
    abcde_pip.templates.simple_train_test.Net:

  Optimizer:
    torch.optim.Adadelta:
      lr: 0.1
      
  TrainDataset:
    torchvision.datasets.MNIST:
      root: .
      train: True
      download: True

  ValDataset:
    torchvision.datasets.MNIST:
      root: .
      train: False
      download: True

  Transform:
    torchvision.transforms.Compose:
      transforms:
        - torchvision.transforms.ToTensor:
        - torchvision.transforms.Normalize:
            mean: [0.1307]
            std: [0.3081]         

  Various Params:
    batch_size: 64
    test_batch_size: 1000
    epochs: 1



FACTORIES:
  Optimizer:
    abcde_pip.templates.pytorch_factories.optimizer_factory:
      model: ~REF~Model
      optimizer: ~REF~Optimizer
      kwargs: ~KWARGS~Optimizer

  TrainDataset:
    abcde_pip.templates.pytorch_factories.dataset_factory:
      dataset: ~REF~TrainDataset
      transform: ~REF~Transform
      kwargs: ~KWARGS~TrainDataset

  ValDataset:
    abcde_pip.templates.pytorch_factories.dataset_factory:
      dataset: ~REF~ValDataset
      transform: ~REF~Transform
      kwargs: ~KWARGS~ValDataset


FUNCS:
  Main:
    abcde_pip.templates.simple_train_test.main:
      model: ~REF~Model
      optimizer: ~REF~Optimizer
      train_set: ~REF~TrainDataset
      val_set: ~REF~ValDataset
      batch_size: 64
      test_batch_size: 1000
      epochs: 1


