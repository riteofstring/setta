Model:
  ui_specifier.templates.simple_train_test.Net: {}
Optimizer:
  torch.optim.Adadelta:
    lr: 0.9
Transform:
  torchvision.transforms.Compose:
    transforms:
    - torchvision.transforms.ToTensor: {}
    - torchvision.transforms.Normalize:
        mean:
        - 0.23
        std:
        - 0.45
TrainDataset:
  torchvision.datasets.MNIST:
    train: true
    download: true
ValDataset:
  torchvision.datasets.MNIST:
    train: false
    download: true
