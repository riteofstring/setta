IMPORTS:
  torch.optim:
  torchvision:
  ui_specifier.templates:
    - simple_train_test

UI_TYPES:
  LIST: 
    - torch.Tensor


transforms: &transforms
  name: torchvision.transforms 

transforms_module_without_compose: &transforms_module_without_compose
  - ModuleInfo:
      <<: *transforms
      include:
        - RandomHorizontalFlip
        - Compose
      set_type:
        Compose:
          transforms:
            - ModuleInfo:
                <<: *transforms
                include:
                  - RandomHorizontalFlip
                  - Compose
                set_type:
                  Compose:
                    transforms:
                      - ModuleInfo:
                          <<: *transforms
                          include:
                            - RandomHorizontalFlip
                            - Compose
                          set_type:
                            Compose:
                              transforms:
                                - ModuleInfo:
                                    <<: *transforms
                                    include:
                                      - RandomHorizontalFlip
                                      - Compose
                                    set_type:
                                      Compose:
                                        transforms:
                                          - ModuleInfo:
                                              <<: *transforms
                                              include:
                                                - RandomHorizontalFlip
                                                - Compose
                                              set_type:
                                                Compose:
                                                  transforms:
                                                    - ModuleInfo:
                                                        <<: *transforms
                                                        include:
                                                          - RandomHorizontalFlip
                                                          - Compose
                                                        set_type:
                                                          Compose:
                                                            transforms:
                                                              - ModuleInfo:
                                                                  <<: *transforms
                                                                  include:
                                                                    - RandomHorizontalFlip
                                                                    - Compose
                                                                  set_type:
                                                                    Compose:
                                                                      transforms:
                                                                        - ModuleInfo:
                                                                            <<: *transforms
                                                                            include:
                                                                              - RandomHorizontalFlip
                                                                              - Compose
                                                                            set_type:
                                                                              Compose:
                                                                                transforms:
                                                                                  - ModuleInfo:
                                                                                      <<: *transforms
                                                                                      include:
                                                                                        - ~REGEX~Random*
            
transforms_module: &transforms_module
  - ModuleInfo:
      <<: *transforms
      include:
        - Compose
      set_type:
        Compose:
          transforms:
            - <<: *transforms_module_without_compose

SECTIONS:
  Model:
    - IMPORTS:
        torchvision:
          - models
    - ModuleInfo:
        name: models
        include:
          - ~REGEX~resnet*
        set_ui_type:
          ~ALL~:
            pretrained: CRAZY_SHIT
        set_default:
          ~ALL~:
            pretrained: True
    - ClassInfo:
        name: torchvision.models.densenet161
        set_ui_type:
          pretrained: CRAZY_SHIT
        set_default:
          pretrained: True

  Other Stuff:
    - ParameterInfo:
        dataset_root:
          default: .
        batch_size:
          type: int
        name:
        weights: 
          type: torch.Tensor
  Dataset:
    - ModuleInfo:
        name: torchvision.datasets
        include:
          - ~REGEX~CIFAR*
        set_type:
          ~ALL~:
            root: str

  Transform:
    - <<: *transforms_module


  Optimizer:
    - ModuleInfo:
        name: torch.optim
        include:
          - SGD
          - Adam

