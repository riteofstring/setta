scenarios:
  - name: create_project_defaults
    kind: create_project_defaults
    seed: none
    description: New projects should bootstrap a single active view mode while starting outside view-edit mode.
  - name: initial_frontend_websocket_inventory
    kind: initial_frontend_websocket_inventory
    seed: none
    description: Initial frontend websocket inventory should expose the same transport health view as the baseline backend.
  - name: toggle_view_mode_broadcast
    kind: toggle_view_mode_broadcast
    seed: none
    description: Toggling view-edit mode should persist and rebroadcast the updated latest project state.
  - name: latest_state_after_create_project
    kind: latest_state_after_create_project
    seed: none
    description: Fresh projects should expose the same initial latest-project-state shape after creation.
  - name: persisted_project_windowing_after_create
    kind: persisted_project_windowing_after_create
    seed: none
    description: Fresh projects should persist authoritative project chat windowing state immediately after creation.
  - name: settings_project_shell
    kind: settings_project_shell
    seed: none
    description: The dedicated /settings project shell should load and rehydrate with the same section/view-mode contract as the baseline backend.
  - name: settings_project_live_hydration
    kind: settings_project_live_hydration
    seed: none
    description: Direct live settings saves should rehydrate the dedicated /settings shell before the next load/readback.
  - name: settings_project_required_view_mode_repair
    kind: settings_project_required_view_mode_repair
    seed: none
    description: Reloading /settings after a required built-in tab is deleted should repair the dedicated settings shell and persist the repaired view-mode set.
  - name: settings_project_missing_required_section_fails_closed
    kind: settings_project_missing_required_section_fails_closed
    seed: none
    description: Reloading /settings after a required built-in section is removed from the persisted settings shell should fail closed instead of silently rebuilding it.
  - name: settings_project_existing_section_code_obj_backfill
    kind: settings_project_existing_section_code_obj_backfill
    seed: none
    description: Restarting with a stale dedicated settings project missing a field inside an existing section should backfill that field without dropping the settings shell.
  - name: settings_project_valid_view_mode_noop
    kind: settings_project_valid_view_mode_noop
    seed: none
    description: Restarting and reloading an already-valid dedicated settings project should not rewrite the persisted settings shell.
  - name: settings_project_top_level_layout_repair
    kind: settings_project_top_level_layout_repair
    seed: none
    description: Restarting after the persisted settings shell loses its top-level layouts should rebuild the active layouts and persist the repaired settings shell.
