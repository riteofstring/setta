scenarios:
  - name: create_project_defaults
    kind: create_project_defaults
    seed: none
    description: New projects should bootstrap a single active view mode while starting outside view-edit mode.
  - name: initial_frontend_websocket_inventory
    kind: initial_frontend_websocket_inventory
    seed: none
    description: Initial frontend websocket inventory should expose the same transport health view as the baseline backend.
  - name: toggle_view_mode_broadcast
    kind: toggle_view_mode_broadcast
    seed: none
    description: Toggling view-edit mode should persist and rebroadcast the updated latest project state.
  - name: latest_state_after_create_project
    kind: latest_state_after_create_project
    seed: none
    description: Fresh projects should expose the same initial latest-project-state shape after creation.
  - name: latest_state_prunes_stale_active_ids
    kind: latest_state_prunes_stale_active_ids
    seed: none
    description: Latest-state hydration should prune persisted activeIds that no longer reference live sections.
  - name: persisted_project_windowing_after_create
    kind: persisted_project_windowing_after_create
    seed: none
    description: Fresh projects should persist authoritative project chat windowing state immediately after creation.
  - name: project_windowing_authoritative_presence_on_load
    kind: project_windowing_authoritative_presence_on_load
    seed: none
    description: Restarting with a project missing its authoritative live project-chat windowing payload should fail closed instead of synthesizing a default on read.
  - name: windowing_section_binding_dedup_and_title_clearing_on_load
    kind: windowing_section_binding_dedup_and_title_clearing_on_load
    seed: none
    description: Restarting with duplicate section-bound project-chat and window-space windows should preserve only the authoritative survivor and clear section-owned titles on load/readback.
  - name: project_chat_windowing_invalid_owner_mode_combos_on_load
    kind: project_chat_windowing_invalid_owner_mode_combos_on_load
    seed: none
    description: Restarting with invalid persisted project-chat owner or mode combinations should fail closed instead of normalizing impossible windows.
  - name: window_spaces_invalid_owner_mode_combos_on_load
    kind: window_spaces_invalid_owner_mode_combos_on_load
    seed: none
    description: Restarting with invalid persisted saved-window-space owner or mode combinations should fail closed instead of normalizing impossible windows.
  - name: windowing_scoped_per_project_config
    kind: windowing_scoped_per_project_config
    seed: none
    description: Restarting with distinct persisted windowing for two projects should keep live project-chat windowing and saved window spaces scoped to each project config.
  - name: project_chat_window_chat_id_route_contract
    kind: project_chat_window_chat_id_route_contract
    seed: none
    description: The direct project-chat chatId route should persist bindings for project_ai windows while rejecting non-project_ai and missing window targets with the source transport contract.
  - name: project_chat_windowing_state_invalid_owner_mode_write_contract
    kind: project_chat_windowing_state_invalid_owner_mode_write_contract
    seed: none
    description: Project-chat layout writes should reject the documented invalid owner/mode combinations instead of normalizing impossible windows.
  - name: window_space_create_invalid_owner_mode_write_contract
    kind: window_space_create_invalid_owner_mode_write_contract
    seed: none
    description: Saved window-space writes should reject the documented invalid owner/mode combinations instead of normalizing impossible windows.
  - name: window_spaces_duplicate_sort_indices_on_load
    kind: window_spaces_duplicate_sort_indices_on_load
    seed: none
    description: Persisted duplicate saved-window-space sort indices should compact in persisted map order before callers hydrate load/latest-state payloads.
  - name: settings_project_shell
    kind: settings_project_shell
    seed: none
    description: The dedicated /settings project shell should load and rehydrate with the same section/view-mode contract as the baseline backend.
  - name: settings_project_live_hydration
    kind: settings_project_live_hydration
    seed: none
    description: Direct live settings saves should rehydrate the dedicated /settings shell before the next load/readback.
  - name: settings_project_reserved_name_save_update
    kind: settings_project_reserved_name_save_update
    seed: none
    description: Saving a mutated dedicated /settings project should preserve the reserved built-in project name across restart and readback.
  - name: settings_project_required_view_mode_repair
    kind: settings_project_required_view_mode_repair
    seed: none
    description: Reloading /settings after a required built-in tab is deleted should repair the dedicated settings shell and persist the repaired view-mode set.
  - name: settings_project_deleted_active_view_mode_repair
    kind: settings_project_deleted_active_view_mode_repair
    seed: none
    description: Restarting with /settings pointing at a deleted active tab should restore a valid active tab, clear view-edit mode, and reproject the active layout/viewport back onto the project shell.
  - name: settings_project_missing_required_section_fails_closed
    kind: settings_project_missing_required_section_fails_closed
    seed: none
    description: Reloading /settings after a required built-in section is removed from the persisted settings shell should fail closed instead of silently rebuilding it.
  - name: settings_project_existing_section_code_obj_backfill
    kind: settings_project_existing_section_code_obj_backfill
    seed: none
    description: Restarting with a stale dedicated settings project missing a field inside an existing section should backfill that field without dropping the settings shell.
  - name: settings_project_display_name_backfill
    kind: settings_project_display_name_backfill
    seed: none
    description: Reloading /settings after restart should preserve existing settings-node display names while backfilling newly materialized blank-label nodes only.
  - name: settings_project_valid_view_mode_noop
    kind: settings_project_valid_view_mode_noop
    seed: none
    description: Restarting and reloading an already-valid dedicated settings project should not rewrite the persisted settings shell.
  - name: settings_project_missing_visible_layout_repair
    kind: settings_project_missing_visible_layout_repair
    seed: none
    description: Restarting after a built-in settings tab loses one of its visible section layouts should restore that missing layout entry on load and latest-state readback without dropping the dedicated settings shell.
  - name: settings_project_top_level_layout_repair
    kind: settings_project_top_level_layout_repair
    seed: none
    description: Restarting after the persisted settings shell loses its top-level layouts should rebuild the active layouts and persist the repaired settings shell.
  - name: workspace_launch_outdated_settings_error
    kind: workspace_launch_outdated_settings_error
    seed: none
    description: Launching a workspace with a stale persisted settings project missing a required section should fail with the typed OutdatedProjectSettings contract instead of spawning a backend.
