<svg xmlns="http://www.w3.org/2000/svg" width="960" height="300" viewBox="0 0 960 300" role="img" aria-labelledby="title description">
  <title id="title">How Setta fits into your application</title>
  <desc id="description">Setta's workspace exchanges state and interactions with your application. Your code owns the data, algorithms, application behavior and persistence. Optional Setta browser pipelines execute your computations in Web Workers and return results and progress. The workspace and pipelines can be used independently.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .background { fill: #f5f7fb; }
    .card { fill: #ffffff; stroke: #dce2ed; }
    .heading { fill: #243255; font-size: 24px; font-weight: 650; }
    .eyebrow { fill: #526587; font-size: 12px; font-weight: 700; letter-spacing: 1.4px; }
    .body { fill: #465675; font-size: 18px; }
    .divider { stroke: #e4e9f1; }
    .icon { fill: none; stroke: #526587; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
    .connector { fill: none; stroke: #7e90af; stroke-width: 2; }
    .arrow { fill: #7e90af; }
    .application { fill: #243255; stroke: #243255; }
    .application-heading { fill: #ffffff; font-size: 24px; font-weight: 650; }
    .application-eyebrow { fill: #c1d1fa; font-size: 12px; font-weight: 700; letter-spacing: 1.4px; }
    .application-body { fill: #e3eaff; font-size: 18px; }
    .application-icon { fill: none; stroke: #c1d1fa; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
    .application-divider { stroke: #475778; }
    @media (prefers-color-scheme: dark) {
      .background { fill: #111823; }
      .card { fill: #1b2535; stroke: #36435a; }
      .heading { fill: #edf2ff; }
      .eyebrow { fill: #b3c3e4; }
      .body { fill: #c2cee5; }
      .divider { stroke: #36435a; }
      .icon { stroke: #b3c3e4; }
      .connector { stroke: #95a9ce; }
      .arrow { fill: #95a9ce; }
      .application { fill: #293e68; stroke: #5a77a9; }
      .application-divider { stroke: #536c98; }
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 6 6" refX="5" refY="3" markerWidth="6" markerHeight="6" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path class="arrow" d="M 0 0 L 6 3 L 0 6 Z" />
    </marker>
  </defs>
  <rect class="background" width="960" height="300" rx="20" />
  <rect class="card" x="24" y="24" width="268" height="252" rx="14" />
  <rect class="application" x="346" y="24" width="268" height="252" rx="14" />
  <rect class="card" x="668" y="24" width="268" height="252" rx="14" />

  <g transform="translate(48 0)">
    <text class="eyebrow" y="62">SETTA</text>
    <g class="icon" transform="translate(198 44)">
      <rect width="22" height="19" rx="3" />
      <path d="M 0 6 H 22 M 8 6 V 19" />
    </g>
    <text class="heading" y="100">Workspace</text>
    <path class="divider" d="M 0 124 H 220" />
    <text class="body" y="160">Controls &amp; sections</text>
    <text class="body" y="192">Views &amp; windows</text>
    <text class="body" y="224">Editing &amp; navigation</text>
  </g>

  <path class="connector" d="M 301 170 H 337" marker-start="url(#arrow)" marker-end="url(#arrow)" />

  <g transform="translate(370 0)">
    <text class="application-eyebrow" y="62">YOUR CODE</text>
    <g class="application-icon" transform="translate(198 44)">
      <path d="M 5 3 L 0 9.5 L 5 16 M 17 3 L 22 9.5 L 17 16 M 13 1 L 9 18" />
    </g>
    <text class="application-heading" y="100">Your application</text>
    <path class="application-divider" d="M 0 124 H 220" />
    <text class="application-body" y="160">Data &amp; algorithms</text>
    <text class="application-body" y="192">Application behavior</text>
    <text class="application-body" y="224">Storage &amp; sync</text>
  </g>

  <path class="connector" d="M 623 170 H 659" marker-start="url(#arrow)" marker-end="url(#arrow)" />

  <g transform="translate(692 0)">
    <text class="eyebrow" y="62">SETTA · OPTIONAL</text>
    <g class="icon" transform="translate(198 44)">
      <rect y="6" width="7" height="7" rx="1.5" />
      <rect x="15" width="7" height="7" rx="1.5" />
      <rect x="15" y="12" width="7" height="7" rx="1.5" />
      <path d="M 7 9.5 H 11 V 3.5 H 15 M 11 9.5 V 15.5 H 15" />
    </g>
    <text class="heading" y="100">Browser pipelines</text>
    <path class="divider" d="M 0 124 H 220" />
    <text class="body" y="160">Web Worker computation</text>
    <text class="body" y="192">Dependencies &amp; progress</text>
    <text class="body" y="224">Cancellation &amp; recovery</text>
  </g>
</svg>
