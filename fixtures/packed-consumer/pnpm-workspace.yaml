# The packed-consumer fixture installs under the same supply-chain controls as the
# repository root (supply-chain-policy.json); scripts/check-dependencies.mjs verifies the
# root copy of these settings and scripts/verify-packed-consumer.mjs materializes this file
# verbatim into the temporary install.
packages:
  - "."

saveExact: true
strictPeerDependencies: true

minimumReleaseAge: 10080
minimumReleaseAgeStrict: true
minimumReleaseAgeIgnoreMissingTime: false
trustPolicy: no-downgrade
trustLockfile: false
blockExoticSubdeps: true

onlyBuiltDependencies: []
