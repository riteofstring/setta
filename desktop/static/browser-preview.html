<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Setta Browser Preview</title>
    <style>
      :root {
        color-scheme: light;
        font-family:
          Inter,
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
      }

      body {
        margin: 0;
        background: #ffffff;
        color: #18181b;
      }

      main {
        display: grid;
        gap: 16px;
        min-height: 100vh;
        padding: 24px;
      }

      button,
      input {
        border: 1px solid #d4d4d8;
        border-radius: 6px;
        font: inherit;
        min-height: 36px;
        padding: 0 12px;
      }

      button {
        background: #18181b;
        color: #ffffff;
        justify-self: start;
      }

      input {
        max-width: 320px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1 id="preview-title">Setta Preview</h1>
      <button id="preview-action" type="button">Click 0</button>
      <input id="preview-input" aria-label="Preview input" />
    </main>
    <script>
      let clicks = 0;
      console.log("preview-ready");
      document.getElementById("preview-action").addEventListener("click", (event) => {
        clicks += 1;
        event.currentTarget.textContent = `Click ${clicks}`;
        console.log(`preview-clicked:${clicks}`);
      });
    </script>
  </body>
</html>
