  - path: /etc/motd.d/setta-devbox
    permissions: "0644"
    owner: root:root
    content: |
      Setta devbox bootstrap complete.
      - Repo checkout: ${repo_checkout_path}
      - Default Setta port: ${setta_port}
      - Default CDP port: ${cdp_port}
      - Start a persistent shell with: tmux new -As setta

  - path: /usr/local/bin/setta-devbox-bootstrap
    permissions: "0755"
    owner: root:root
    content: |
      #!/usr/bin/env bash
      set -euo pipefail

      export DEBIAN_FRONTEND=noninteractive

      apt-get update
      apt-get install -y \
        build-essential \
        ca-certificates \
        curl \
        fd-find \
        fonts-liberation \
        git \
        gnupg \
        jq \
        libasound2t64 \
        libatk-bridge2.0-0 \
        libatk1.0-0 \
        libcairo2 \
        libcups2 \
        libdbus-1-3 \
        libdrm2 \
        libgbm1 \
        libglib2.0-0 \
        libgtk-3-0 \
        libnspr4 \
        libnss3 \
        libpango-1.0-0 \
        libu2f-udev \
        libwayland-client0 \
        libx11-6 \
        libx11-xcb1 \
        libxcb1 \
        libxcomposite1 \
        libxdamage1 \
        libxext6 \
        libxfixes3 \
        libxkbcommon0 \
        libxrandr2 \
        ncurses-bin \
        openssh-server \
        python3 \
        python3-dev \
        python3-pip \
        python3-venv \
        ripgrep \
        tmux \
        unzip \
        xauth \
        xdg-utils \
        xvfb \
        zip

      install -d -m 0755 /etc/apt/keyrings
      if [ ! -f /etc/apt/keyrings/google-chrome.gpg ]; then
        curl -fsSL https://dl.google.com/linux/linux_signing_key.pub \
          | gpg --dearmor -o /etc/apt/keyrings/google-chrome.gpg
      fi

      cat >/etc/apt/sources.list.d/google-chrome.list <<'EOF'
      deb [arch=amd64 signed-by=/etc/apt/keyrings/google-chrome.gpg] http://dl.google.com/linux/chrome/deb/ stable main
      EOF

      apt-get update
      apt-get install -y google-chrome-stable

      install -d -o ubuntu -g ubuntu /home/ubuntu/dev
      install -d -o ubuntu -g ubuntu "${repo_checkout_path}"
      install -d -m 0700 -o ubuntu -g ubuntu /home/ubuntu/.ssh
      cat >/home/ubuntu/.ssh/authorized_keys <<'EOF'
%{ for ssh_key in ssh_authorized_keys ~}
      ${ssh_key}
%{ endfor ~}
      EOF
      chown ubuntu:ubuntu /home/ubuntu/.ssh/authorized_keys
      chmod 0600 /home/ubuntu/.ssh/authorized_keys

      if [ -n "${repo_clone_url}" ] && [ ! -d "${repo_checkout_path}/.git" ]; then
        sudo -u ubuntu -H git clone "${repo_clone_url}" "${repo_checkout_path}"
      fi

      sudo -u ubuntu -H bash -lc '
        set -euo pipefail
        export NVM_DIR="$HOME/.nvm"
        if [ ! -s "$NVM_DIR/nvm.sh" ]; then
          curl -fsSL https://raw.githubusercontent.com/nvm-sh/nvm/v0.40.3/install.sh | bash
        fi
        . "$NVM_DIR/nvm.sh"
        nvm install "${node_version}"
        nvm alias default "${node_version}"
        corepack enable
        npm install -g @openai/codex@latest
        install -d -m 0700 "$HOME/.codex"
        printf '\''cli_auth_credentials_store = "file"\n'\'' > "$HOME/.codex/config.toml"
      '

      sudo -u ubuntu -H bash -lc '
        set -euo pipefail
        export PATH="$HOME/.local/bin:$PATH"
        curl -LsSf https://astral.sh/uv/install.sh | sh
      '

      chown -R ubuntu:ubuntu /home/ubuntu/dev
      install -d -m 0700 -o ubuntu -g ubuntu /home/ubuntu/.terminfo
      sudo -u ubuntu -H env HOME=/home/ubuntu tic -x -o /home/ubuntu/.terminfo /usr/local/share/setta-devbox/terminfo/xterm-ghostty.terminfo
      sudo -u ubuntu -H env HOME=/home/ubuntu bash -lc 'tmux start-server >/dev/null 2>&1 || true; tmux source-file "$HOME/.tmux.conf" >/dev/null 2>&1 || true'
      systemctl enable --now ssh

  - path: /usr/local/bin/setta-devbox-install-repo
    permissions: "0755"
    owner: root:root
    content: |
      #!/usr/bin/env bash
      set -euo pipefail

      REPO_DIR="$${1:-$${SETTA_DEVBOX_REPO_CHECKOUT:-${repo_checkout_path}}}"
      export PATH="$${HOME}/.local/bin:$${PATH}"
      if [ -s "$${HOME}/.nvm/nvm.sh" ]; then
        . "$${HOME}/.nvm/nvm.sh"
        nvm use default >/dev/null
      fi
      cd "$${REPO_DIR}"
      ./dev_install.sh
      cd frontend
      pnpm build
      cd ..
      mkdir -p backend/setta/static
      rm -rf backend/setta/static/frontend
      cp -r frontend/dist backend/setta/static/frontend
      cd frontend
      pnpm exec playwright install chromium

  - path: /usr/local/bin/setta-devbox-prepare-repo
    permissions: "0755"
    owner: root:root
    content: |
      #!/usr/bin/env bash
      set -euo pipefail

      REPO_DIR="$${SETTA_DEVBOX_REPO_CHECKOUT:-${repo_checkout_path}}"
      REPO_REMOTE_URL="$${SETTA_DEVBOX_REPO_REMOTE_URL:-$${SETTA_DEVBOX_REPO_CLONE_URL:-}}"
      REPO_BRANCH="$${SETTA_DEVBOX_REPO_BRANCH:-}"

      if [ -d "$${REPO_DIR}/.git" ] || [ -f "$${REPO_DIR}/.git" ]; then
        if [ -z "$${REPO_REMOTE_URL}" ]; then
          exit 0
        fi

        CURRENT_REMOTE_URL="$$(git -C "$${REPO_DIR}" remote get-url origin 2>/dev/null || true)"
        if [ -z "$${CURRENT_REMOTE_URL}" ]; then
          git -C "$${REPO_DIR}" remote add origin "$${REPO_REMOTE_URL}"
          exit 0
        fi

        if [ "$${CURRENT_REMOTE_URL}" != "$${REPO_REMOTE_URL}" ]; then
          git -C "$${REPO_DIR}" remote set-url origin "$${REPO_REMOTE_URL}"
        fi
        exit 0
      fi

      if [ -z "$${REPO_REMOTE_URL}" ]; then
        exit 0
      fi

      install -d "$$(dirname "$${REPO_DIR}")"
      if [ -n "$${REPO_BRANCH}" ]; then
        exec git clone --branch "$${REPO_BRANCH}" "$${REPO_REMOTE_URL}" "$${REPO_DIR}"
      fi

      exec git clone "$${REPO_REMOTE_URL}" "$${REPO_DIR}"

  - path: /usr/local/bin/setta-devbox-ensure-ready
    permissions: "0755"
    owner: root:root
    content: |
      #!/usr/bin/env bash
      set -euo pipefail

      REPO_DIR="$${SETTA_DEVBOX_REPO_CHECKOUT:-${repo_checkout_path}}"
      START_DIR="$${1:-$${REPO_DIR}}"
      SHELL_MODE="$${2:-preserve}"

      /usr/local/bin/setta-devbox-prepare-repo

      shell_window_command() {
        printf "bash -lc 'cd %q && exec bash'" "$${START_DIR}"
      }

      ensure_window() {
        window_name="$${1}"
        window_command="$${2}"

        if ! tmux list-windows -t setta -F '#{window_name}' 2>/dev/null | grep -Fxq "$${window_name}"; then
          tmux new-window -d -t setta -n "$${window_name}" "$${window_command}"
          return
        fi

        pane_dead="$$(tmux display-message -p -t "setta:$${window_name}" '#{pane_dead}')"
        if [ "$${pane_dead}" = "1" ]; then
          tmux respawn-window -k -t "setta:$${window_name}" "$${window_command}"
        fi
      }

      tmux start-server >/dev/null 2>&1 || true
      tmux source-file "$${HOME}/.tmux.conf" >/dev/null 2>&1 || true

      if ! tmux has-session -t setta 2>/dev/null; then
        tmux new-session -d -s setta -n shell "$$(shell_window_command)"
      fi

      tmux set-option -t setta allow-rename off >/dev/null 2>&1 || true
      if [ -n "$${SSH_AUTH_SOCK:-}" ]; then
        tmux set-environment -t setta SSH_AUTH_SOCK "$${SSH_AUTH_SOCK}" >/dev/null 2>&1 || true
      else
        tmux set-environment -t setta -r SSH_AUTH_SOCK >/dev/null 2>&1 || true
      fi

      if ! tmux list-windows -t setta -F '#{window_name}' 2>/dev/null | grep -Fxq shell; then
        tmux new-window -d -t setta -n shell "$$(shell_window_command)"
      fi

      shell_pane_dead="$$(tmux display-message -p -t setta:shell '#{pane_dead}' 2>/dev/null || echo 0)"
      if [ "$${shell_pane_dead}" = "1" ] || [ "$${SHELL_MODE}" = "reset" ]; then
        tmux respawn-window -k -t setta:shell "$$(shell_window_command)"
      fi

      ensure_window app "bash -lc 'cd \"$${REPO_DIR}\" && exec setta-devbox-run-setta'"
      ensure_window chrome "bash -lc 'cd \"$${REPO_DIR}\" && exec setta-devbox-start-chrome'"

  - path: /usr/local/bin/setta-devbox-attach
    permissions: "0755"
    owner: root:root
    content: |
      #!/usr/bin/env bash
      set -euo pipefail

      START_DIR="$${1:-$${SETTA_DEVBOX_REPO_CHECKOUT:-${repo_checkout_path}}}"
      SHELL_MODE="$${2:-preserve}"

      /usr/local/bin/setta-devbox-ensure-ready "$${START_DIR}" "$${SHELL_MODE}"
      tmux select-window -t setta:shell >/dev/null 2>&1 || true
      exec tmux attach-session -t setta

  - path: /usr/local/bin/setta-devbox-run-setta
    permissions: "0755"
    owner: root:root
    content: |
      #!/usr/bin/env bash
      set -euo pipefail

      REPO_DIR="$${SETTA_DEVBOX_REPO_CHECKOUT:-${repo_checkout_path}}"
      PORT="$${SETTA_PORT:-${setta_port}}"
      cd "$${REPO_DIR}"
      source .venv/bin/activate
      exec setta --host 127.0.0.1 --port "$${PORT}" --no-open

  - path: /usr/local/bin/setta-devbox-start-chrome
    permissions: "0755"
    owner: root:root
    content: |
      #!/usr/bin/env bash
      set -euo pipefail

      export DISPLAY="$${DISPLAY:-:99}"
      PORT="$${1:-$${SETTA_DEVBOX_CDP_PORT:-${cdp_port}}}"
      USER_DATA_DIR="$${HOME}/.config/setta-devbox-chrome"

      if ! pgrep -f "Xvfb $${DISPLAY}" >/dev/null 2>&1; then
        nohup Xvfb "$${DISPLAY}" -screen 0 1920x1080x24 >/tmp/setta-devbox-xvfb.log 2>&1 &
        sleep 1
      fi

      install -d "$${USER_DATA_DIR}"

      exec /usr/bin/google-chrome-stable \
        --disable-background-networking \
        --disable-dev-shm-usage \
        --no-default-browser-check \
        --no-first-run \
        --remote-debugging-address=127.0.0.1 \
        --remote-debugging-port="$${PORT}" \
        --user-data-dir="$${USER_DATA_DIR}" \
        about:blank

runcmd:
  - [bash, -lc, "/usr/local/bin/setta-devbox-bootstrap"]
