#cloud-config
package_update: true
package_upgrade: false

write_files:
  - path: /etc/ssh/sshd_config.d/setta-devbox.conf
    permissions: "0644"
    owner: root:root
    content: |
      PasswordAuthentication no
      KbdInteractiveAuthentication no
      ChallengeResponseAuthentication no
      PermitRootLogin no
      PubkeyAuthentication yes
      AllowUsers ubuntu
      AllowAgentForwarding yes

  - path: /etc/ssh/ssh_config.d/setta-devbox-github.conf
    permissions: "0644"
    owner: root:root
    content: |
      Host github.com
        PubkeyAuthentication unbound
        IdentityAgent SSH_AUTH_SOCK

  - path: /etc/profile.d/setta-devbox.sh
    permissions: "0644"
    owner: root:root
    content: |
      export PATH="$HOME/.local/bin:$PATH"
      export SETTA_DEVBOX_REPO_CHECKOUT="${repo_checkout_path}"
      export SETTA_DEVBOX_REPO_CLONE_URL="${repo_clone_url}"
      export SETTA_DEVBOX_SETTA_PORT="${setta_port}"
      export SETTA_DEVBOX_CDP_PORT="${cdp_port}"

      if [ -s "$HOME/.nvm/nvm.sh" ]; then
        . "$HOME/.nvm/nvm.sh" >/dev/null 2>&1
      fi

  - path: /home/ubuntu/.tmux.conf
    permissions: "0644"
    owner: ubuntu:ubuntu
    content: |
      set -g default-terminal "tmux-256color"
      set -s extended-keys on
      set -s extended-keys-format csi-u
      set -as terminal-features ',xterm-ghostty:extkeys,RGB'
      bind c new-window -c "#{?pane_current_path,#{pane_current_path},/home/ubuntu/dev}"
      bind '"' split-window -v -c "#{?pane_current_path,#{pane_current_path},/home/ubuntu/dev}"
      bind % split-window -h -c "#{?pane_current_path,#{pane_current_path},/home/ubuntu/dev}"

