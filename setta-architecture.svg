<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title description">
  <title id="title">Setta application architecture</title>
  <desc id="description">Python Canvas, Realtime, Review, and Experiment Lens share a visual Workspace frontend and a local backend foundation. The backend works with projects and files on the user's computer.</desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0e13" />
      <stop offset="1" stop-color="#080a0f" />
    </linearGradient>
    <radialGradient id="blue-glow" cx="50%" cy="0" r="75%">
      <stop offset="0" stop-color="#2563eb" stop-opacity=".18" />
      <stop offset=".55" stop-color="#2563eb" stop-opacity=".03" />
      <stop offset="1" stop-color="#2563eb" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#121925" />
      <stop offset="1" stop-color="#0e131d" />
    </linearGradient>
    <linearGradient id="frontend" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#101a28" />
      <stop offset="1" stop-color="#0e151f" />
    </linearGradient>
    <linearGradient id="backend" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#151629" />
      <stop offset="1" stop-color="#10131f" />
    </linearGradient>
    <pattern id="dot-grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#60769b" fill-opacity=".13" />
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#00040a" flood-opacity=".38" />
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#526b91" />
    </marker>
    <style>
      .sans { font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .eyebrow { font-size: 12px; font-weight: 700; letter-spacing: 1.8px; }
      .headline { font-size: 32px; font-weight: 680; letter-spacing: -.7px; }
      .card-title { font-size: 20px; font-weight: 650; letter-spacing: -.2px; }
      .card-copy { font-size: 15px; font-weight: 450; }
      .layer-title { font-size: 24px; font-weight: 650; letter-spacing: -.35px; }
      .layer-copy { font-size: 16px; font-weight: 450; }
      .flow { fill: none; stroke: #526b91; stroke-width: 1.6; }
      .icon-line { fill: none; stroke-linecap: round; stroke-linejoin: round; stroke-width: 1.8; }
    </style>
  </defs>

  <rect width="1200" height="800" fill="url(#background)" />
  <rect width="1200" height="800" fill="url(#blue-glow)" />
  <rect width="1200" height="800" fill="url(#dot-grid)" />
  <rect x="28" y="28" width="1144" height="744" rx="28" fill="none" stroke="#202a3a" />

  <text x="60" y="70" class="sans eyebrow" fill="#7190bd">SETTA ARCHITECTURE</text>
  <text x="60" y="112" class="sans headline" fill="#e3e9f2">Four focused apps. One shared foundation.</text>
  <rect x="968" y="66" width="174" height="34" rx="17" fill="#101a28" stroke="#2b405e" />
  <circle cx="991" cy="83" r="5" fill="#60a5fa" />
  <text x="1005" y="88" class="sans" font-size="13" font-weight="600" fill="#a9bad1">RUNS LOCALLY</text>

  <g filter="url(#shadow)">
    <g transform="translate(56 154)">
      <rect width="260" height="176" rx="18" fill="url(#card)" stroke="#2a374b" />
      <rect x="16" y="18" width="42" height="42" rx="12" fill="#102b4b" stroke="#285d91" />
      <path d="M 28 31 H 46 M 28 47 H 46 M 29 31 V 47 M 45 31 V 47" class="icon-line" stroke="#69b3ff" opacity=".55" />
      <circle cx="29" cy="31" r="3" fill="#76bdff" />
      <circle cx="45" cy="47" r="3" fill="#76bdff" />
      <text x="70" y="45" class="sans card-title" fill="#e3e9f2">Python Canvas</text>
      <text x="18" y="100" class="sans card-copy" fill="#a0aec2">Visual Python authoring</text>
      <text x="18" y="123" class="sans card-copy" fill="#a0aec2">and execution</text>
      <rect x="18" y="151" width="62" height="3" rx="1.5" fill="#60a5fa" />
    </g>

    <g transform="translate(332 154)">
      <rect width="260" height="176" rx="18" fill="url(#card)" stroke="#2a374b" />
      <rect x="16" y="18" width="42" height="42" rx="12" fill="#0d3038" stroke="#21606e" />
      <path d="M 25 40 H 30 L 34 29 L 40 51 L 45 36 H 50" class="icon-line" stroke="#58d5e8" />
      <text x="70" y="45" class="sans card-title" fill="#e3e9f2">Realtime</text>
      <text x="18" y="100" class="sans card-copy" fill="#a0aec2">Interactive tools powered</text>
      <text x="18" y="123" class="sans card-copy" fill="#a0aec2">by Python handlers</text>
      <rect x="18" y="151" width="62" height="3" rx="1.5" fill="#4fd1e5" />
    </g>

    <g transform="translate(608 154)">
      <rect width="260" height="176" rx="18" fill="url(#card)" stroke="#2a374b" />
      <rect x="16" y="18" width="42" height="42" rx="12" fill="#211b3d" stroke="#514686" />
      <circle cx="37" cy="39" r="11" class="icon-line" stroke="#b6a3ff" />
      <path d="M 32 39 L 36 43 L 43 35" class="icon-line" stroke="#b6a3ff" />
      <text x="70" y="45" class="sans card-title" fill="#e3e9f2">Review</text>
      <text x="18" y="100" class="sans card-copy" fill="#a0aec2">Evidence-rich decisions</text>
      <text x="18" y="123" class="sans card-copy" fill="#a0aec2">and portable responses</text>
      <rect x="18" y="151" width="62" height="3" rx="1.5" fill="#a78bfa" />
    </g>

    <g transform="translate(884 154)">
      <rect width="260" height="176" rx="18" fill="url(#card)" stroke="#2a374b" />
      <rect x="16" y="18" width="42" height="42" rx="12" fill="#352914" stroke="#725a25" />
      <path d="M 25 50 L 31 42 L 37 45 L 44 31 L 50 35" class="icon-line" stroke="#f3c968" />
      <circle cx="31" cy="42" r="2.5" fill="#f3c968" />
      <circle cx="44" cy="31" r="2.5" fill="#f3c968" />
      <text x="70" y="45" class="sans card-title" fill="#e3e9f2">Experiment Lens</text>
      <text x="18" y="100" class="sans card-copy" fill="#a0aec2">Explore results and hand off</text>
      <text x="18" y="123" class="sans card-copy" fill="#a0aec2">exact selections</text>
      <rect x="18" y="151" width="62" height="3" rx="1.5" fill="#eabf5b" />
    </g>
  </g>

  <path d="M 186 330 V 370" class="flow" marker-end="url(#arrow)" />
  <path d="M 462 330 V 370" class="flow" marker-end="url(#arrow)" />
  <path d="M 738 330 V 370" class="flow" marker-end="url(#arrow)" />
  <path d="M 1014 330 V 370" class="flow" marker-end="url(#arrow)" />

  <g filter="url(#shadow)">
    <rect x="56" y="382" width="1088" height="112" rx="18" fill="url(#frontend)" stroke="#2a4667" />
    <rect x="56" y="382" width="5" height="112" rx="2.5" fill="#4c9cf3" />
    <rect x="80" y="407" width="62" height="62" rx="14" fill="#0b121c" stroke="#30445f" />
    <rect x="94" y="420" width="34" height="36" rx="5" fill="none" stroke="#67aeef" stroke-width="1.5" />
    <path d="M 94 429 H 128 M 103 429 V 456" fill="none" stroke="#67aeef" stroke-width="1.5" opacity=".7" />
    <circle cx="99" cy="425" r="1.5" fill="#67aeef" />
    <rect x="164" y="400" width="96" height="24" rx="12" fill="#102b4b" stroke="#285d91" />
    <text x="212" y="417" class="sans eyebrow" font-size="11" text-anchor="middle" fill="#79bcff">FRONTEND</text>
    <text x="164" y="461" class="sans layer-title" fill="#e3e9f2">Workspace</text>
    <text x="406" y="449" class="sans layer-copy" fill="#a0aec2">Shared visual canvas · navigation · windows · controls</text>
    <text x="406" y="472" class="sans" font-size="14" fill="#71839f">A consistent browser experience across every app</text>
  </g>

  <path d="M 600 494 V 536" class="flow" marker-end="url(#arrow)" />

  <g filter="url(#shadow)">
    <rect x="56" y="548" width="1088" height="112" rx="18" fill="url(#backend)" stroke="#39375d" />
    <rect x="56" y="548" width="5" height="112" rx="2.5" fill="#9278ed" />
    <rect x="80" y="573" width="62" height="62" rx="14" fill="#0d101a" stroke="#423d68" />
    <rect x="94" y="585" width="34" height="10" rx="4" fill="none" stroke="#b2a1f5" stroke-width="1.5" />
    <rect x="94" y="600" width="34" height="10" rx="4" fill="none" stroke="#b2a1f5" stroke-width="1.5" />
    <rect x="94" y="615" width="34" height="10" rx="4" fill="none" stroke="#b2a1f5" stroke-width="1.5" />
    <circle cx="101" cy="590" r="1.5" fill="#b2a1f5" />
    <circle cx="101" cy="605" r="1.5" fill="#b2a1f5" />
    <circle cx="101" cy="620" r="1.5" fill="#b2a1f5" />
    <rect x="164" y="566" width="88" height="24" rx="12" fill="#211b3d" stroke="#514686" />
    <text x="208" y="583" class="sans eyebrow" font-size="11" text-anchor="middle" fill="#bdadff">BACKEND</text>
    <text x="164" y="627" class="sans layer-title" fill="#e3e9f2">Local backend</text>
    <text x="406" y="615" class="sans layer-copy" fill="#a0aec2">Project access · live updates · execution · durable handoffs</text>
    <text x="406" y="638" class="sans" font-size="14" fill="#71839f">Shared local behavior with app-specific capabilities on top</text>
  </g>

  <path d="M 600 660 V 692" class="flow" marker-end="url(#arrow)" />

  <g>
    <rect x="298" y="704" width="604" height="44" rx="14" fill="#10151f" stroke="#2a374b" />
    <path d="M 322 721 H 334 L 338 725 H 354 V 738 H 322 Z" fill="#17273c" stroke="#629bd3" stroke-width="1.4" stroke-linejoin="round" />
    <text x="372" y="732" class="sans" font-size="16" font-weight="600" fill="#c6d1df">Your local projects &amp; files</text>
    <text x="623" y="732" class="sans" font-size="14" fill="#71839f">code · evidence · results · artifacts</text>
  </g>
</svg>
