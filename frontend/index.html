<!doctype html>
<!-- Need overscroll-x-none: https://github.com/xyflow/xyflow/discussions/3379#discussioncomment-10171429 -->
<html lang="en" class="overscroll-x-none">
  <head>
    <meta charset="utf-8" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="manifest" href="%BASE_URL%site.webmanifest" />
    <link rel="mask-icon" href="/safari-pinned-tab.svg" color="#00b5d8" />
    <meta name="msapplication-TileColor" content="#da532c" />
    <meta name="theme-color" content="#dce1ea" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="setta" />
    <script>
      (function () {
        try {
          const stored = localStorage.getItem("setta_data");
          if (!stored) {
            return;
          }
          const parsed = JSON.parse(stored);
          const isDarkMode = Boolean(parsed?.state?.darkMode);
          if (isDarkMode) {
            document.documentElement.classList.add("dark");
          } else {
            document.documentElement.classList.remove("dark");
          }
          const themeMeta = document.querySelector(
            'meta[name="theme-color"]',
          );
          if (themeMeta) {
            themeMeta.setAttribute(
              "content",
              isDarkMode ? "#0b0e13" : "#dce1ea",
            );
          }
        } catch {
          /* ignore */
        }
      })();
    </script>
    <link rel="stylesheet" href="/index.css" />

    <title>setta.dev</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <main
      id="root"
      class="app-shell flex h-screen w-screen flex-col items-center font-sans"
    ></main>

    <script type="module" src="/src/index.jsx"></script>
  </body>
</html>
