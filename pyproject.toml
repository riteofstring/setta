[build-system]
requires = ["hatchling==1.29.0"]
build-backend = "hatchling.build"

[project]
name = "setta"
dynamic = ["version"]
authors = [
    {name = "Kevin Musgrave"},
    {name = "Jeff Musgrave"}
]
description = "Go-powered Setta runtime with Python SDK and packaging support."
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.12,<3.14"
dependencies = [
    "claude-agent-sdk==0.1.52",
    "ruff==0.12.12",
]

[project.urls]
Homepage = "https://setta.dev"
GitHub = "https://github.com/settadev/setta"

[project.scripts]
setta = "setta.entrypoint:main"

[project.optional-dependencies]
defaults = [
    "setta-basedpyright==0.1.0",
]
source = [
    # Python SDK/source-only modules that still have live callers.
    "requests==2.32.4",
    "websockets==15.0.1",
    "psutil==7.0.0",
    "mcp==1.25.0",
    "pydantic==2.11.5",
    "watchfiles==0.24.0",
]
dev = [
    # Repo-only test, release, and auxiliary script tooling.
    "build==1.0.3",
    "coverage==7.10.6",
    "datamodel-code-generator==0.56.0",
    "pip-audit==2.9.0",
    "pyyaml==6.0.2",
    "pytest==8.3.3",
    "pytest-asyncio==0.23.8",
    "python-dotenv==1.1.0",
    "twine==6.1.0",
    "ty==0.0.29",
    "vulture==2.14",
    "watchdog==6.0.0",
]

[tool.hatch.version]
path = "backend/setta/__init__.py"

[tool.hatch.build.targets.wheel]
only-include = [
    "backend/setta/__init__.py",
    "backend/setta/__main__.py",
    "backend/setta/entrypoint.py",
    "backend/setta/plugin_runtime",
    "backend/setta/types/generated/go_shared_constants.py",
]
sources = ["backend"]
exclude = [
    "backend/setta/**/__pycache__/**",
]

[tool.hatch.build.targets.wheel.force-include]
"backend/setta/static/frontend" = "setta/static/frontend"
"backend/setta/agentic/external_adapters/sidecars" = "setta/agentic/external_adapters/sidecars"
"backend/setta/vendor/node" = "setta/vendor/node"
"backend/setta/plugins/schemas" = "setta/plugins/schemas"
"backend/setta/launcher_artifacts/assets" = "setta/launcher_artifacts/assets"
"backend/setta/go_bin" = "setta/go_bin"

[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.sdist]
include = [
    "/backend/setta",
    "/README.md",
    "/LICENSE",
]

[tool.hatch.build]
artifacts = [
    "backend/setta/static/frontend/**",
    "backend/setta/agentic/external_adapters/sidecars/**",
    "backend/setta/vendor/node/**",
    "backend/setta/plugins/schemas/**",
    "backend/setta/launcher_artifacts/assets/**",
    "backend/setta/go_bin/**",
]

[tool.uv.sources]
setta-basedpyright = { path = "plugins/setta-basedpyright" }
