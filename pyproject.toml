[build-system]
requires = []
build-backend = "setta_build_backend"
backend-path = ["packages/setta-runtime"]

[project]
name = "setta"
version = "0.1.0"
description = "Setta local application runtime and extensible command line."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = [
  "basedpyright==1.39.9",
  "nodejs-wheel-binaries==24.16.0",
]

[project.scripts]
setta = "setta.cli:main"

[tool.uv]
package = false
