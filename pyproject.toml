[build-system]
requires = []
build-backend = "setta_build_backend"
backend-path = ["packages/setta-runtime"]

[project]
name = "setta"
version = "0.1.0"
description = "Visual tools for local Python projects, reviews, and experiments."
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE", "packages/setta-runtime/licenses/*"]
authors = [
  { name = "Kevin Musgrave" },
  { name = "Jeff Musgrave" },
]
keywords = ["local-first", "python", "visual-tools", "workspace"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: User Interfaces",
]
dependencies = [
  "basedpyright==1.39.9",
  "nodejs-wheel-binaries==24.16.0",
]

[project.scripts]
setta = "setta.cli:main"

[tool.uv]
package = false
